<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 검색엔진 색인 차단 (#92: 사이트 상 조회 불가) -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이건영 포트폴리오</title>
    <!-- 자바스크립트 비활성 환경에서도 즉시 홈으로 이동 -->
    <meta http-equiv="refresh" content="0; url=../../index.html" />
    <link rel="canonical" href="https://pachir1su.github.io/" />
    <script>
      /* 직접 URL 접근 차단: 히스토리에 남기지 않고 홈으로 즉시 이동 (#92) */
      try {
        window.location.replace("../../index.html");
      } catch (err) {
        /* replace 실패 시 일반 이동으로 폴백 */
        window.location.href = "../../index.html";
      }
    </script>
  </head>
  <body>
    <noscript>
      <a href="../../index.html">홈으로 이동</a>
    </noscript>
  </body>
</html>
