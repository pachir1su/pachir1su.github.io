name: qa252-continue-fixes

on:
  push:
    branches:
      - chatgpt/qa252-regression-fix
    paths:
      - .github/workflows/qa252-continue-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa252-regression-fix
      - name: Apply remaining QA fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # KGA: use the user-provided portrait shuttle capture.
          Path('projects/koreatechGongjiAgent/assets/images/web-shuttle-live.webp').write_bytes(base64.b64decode(''))
          replace_exact(
              'projects/koreatechGongjiAgent/index.html',
              '<img src="assets/images/web-shuttle-live.webp" width="1200" height="833" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 셔틀 화면" />',
              '<img src="assets/images/web-shuttle-live.webp" width="1054" height="1440" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 셔틀 화면" />',
          )

          # Meal queue: pin the rendered box to the actual 720x1280 video ratio.
          replace_exact(
              'projects/meal_queue_signal_counter/index.html',
              '<video class="detail-video" width="1080" height="1920" controls preload="metadata" playsinline muted poster="assets/images/green-signal-demo.webp">',
              '<video class="detail-video" width="720" height="1280" style="aspect-ratio: 9 / 16; object-fit: cover" controls preload="metadata" playsinline muted poster="assets/images/green-signal-demo.webp">',
          )

          # Wall_Sina: correct all three HTML dimensions and keep the box stable before/after playback.
          replace_exact(
              'projects/Wall_Sina/index.html',
              '<video class="detail-video" width="1920" height="1080" controls preload="metadata" playsinline poster="assets/images/prototype-1.webp">',
              '<video class="detail-video" width="1080" height="1920" style="aspect-ratio: 9 / 16; object-fit: cover" controls preload="metadata" playsinline poster="assets/images/prototype-1.webp">',
          )
          replace_exact(
              'projects/Wall_Sina/index.html',
              '<video class="detail-video" width="1280" height="720" controls preload="metadata" playsinline muted poster="assets/images/final-model-overview.webp">',
              '<video class="detail-video" width="456" height="720" style="aspect-ratio: 19 / 30; object-fit: cover" controls preload="metadata" playsinline muted poster="assets/images/final-model-overview.webp">',
          )
          replace_exact(
              'projects/Wall_Sina/index.html',
              '<video class="detail-video" width="1920" height="1080" controls preload="metadata" playsinline muted poster="assets/images/final-barrier-front.webp">',
              '<video class="detail-video" width="406" height="720" style="aspect-ratio: 203 / 360; object-fit: cover" controls preload="metadata" playsinline muted poster="assets/images/final-barrier-front.webp">',
          )

          # Extend the browser regression suite with the final KGA portrait-asset contract.
          p = Path('.github/qa252_browser.py')
          text = p.read_text(encoding='utf-8')
          anchor = "    # Video ratio regression: playing must not change the rendered box size.\n"
          block = """    # KGA: the user-selected portrait shuttle screenshot must be the rendered source.
    driver.get(BASE + 'projects/koreatechGongjiAgent/index.html')
    shuttle = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, 'img[src=\"assets/images/web-shuttle-live.webp\"]'))
    dims = driver.execute_script('return [arguments[0].naturalWidth, arguments[0].naturalHeight];', shuttle)
    assert dims == [1054, 1440], ('KGA shuttle image dimensions', dims)
    no_overflow('KGA desktop')

"""
          if block not in text:
              if anchor not in text:
                  raise SystemExit('missing QA browser insertion anchor')
              text = text.replace(anchor, block + anchor, 1)
              p.write_text(text, encoding='utf-8')
          PYCODE

          node --check assets/project-demos.js
          node tools/verify-build.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/koreatechGongjiAgent/assets/images/web-shuttle-live.webp \
                  projects/koreatechGongjiAgent/index.html \
                  projects/meal_queue_signal_counter/index.html \
                  projects/Wall_Sina/index.html \
                  .github/qa252_browser.py
          git commit -m "fix: finish #252 media regression fixes"
          git push origin HEAD:chatgpt/qa252-regression-fix
