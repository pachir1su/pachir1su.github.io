name: qa252-apply-regression-fixes

on:
  push:
    branches:
      - chatgpt/qa252-regression-fix
    paths:
      - .github/workflows/qa252-apply-regression-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa252-regression-fix
          fetch-depth: 0
      - name: Apply remaining media patch
        run: python3 .github/qa252_patch.py
      - name: Static checks
        run: |
          set -euo pipefail
          node --check assets/project-demos.js
          node tools/verify-build.js
          git diff --check
          grep -Fq 'width="600" height="820"' projects/koreatechGongjiAgent/index.html
          grep -Fq 'width="720" height="1280" style="aspect-ratio: 9 / 16; object-fit: cover"' projects/meal_queue_signal_counter/index.html
          grep -Fq 'width="1080" height="1920" style="aspect-ratio: 9 / 16; object-fit: cover"' projects/Wall_Sina/index.html
          grep -Fq 'width="456" height="720" style="aspect-ratio: 19 / 30; object-fit: cover"' projects/Wall_Sina/index.html
          grep -Fq 'width="406" height="720" style="aspect-ratio: 203 / 360; object-fit: cover"' projects/Wall_Sina/index.html
          grep -Fq '장벽 방수 테스트' projects/Wall_Sina/index.html
          grep -Fq '팀 건영아잘하자' projects/2026_U-CAST/index.html
          grep -Fq 'U-CAST 우수 운영 멘토' projects/2026_U-CAST/index.html
          ! grep -Fq '(이슈 #6)' projects/2026_U-CAST/index.html
          ! grep -Fq '(issue #6)' projects/2026_U-CAST/index.html
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            projects/koreatechGongjiAgent/index.html \
            projects/meal_queue_signal_counter/index.html \
            projects/Wall_Sina/index.html
          git commit -m 'fix: stabilize #252 media layouts'
          git push origin HEAD:chatgpt/qa252-regression-fix
