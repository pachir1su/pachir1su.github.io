name: qa252-apply-regression-fixes

on:
  push:
    branches:
      - chatgpt/qa252-regression-fix
    paths:
      - .github/workflows/qa252-apply-regression-fixes.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa252-regression-fix
          fetch-depth: 0

      - name: Apply exact #252 fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Shared CSS regressions + HOME + U-CAST + PlantClock + doorlock.
          style = Path('style.css')
          css = style.read_text(encoding='utf-8')
          bad_video = '.detail-video { width:100%; height:auto !important; aspect-ratio:auto !important; object-fit:contain !important; }\n\n'
          if css.count(bad_video) != 1:
              raise SystemExit('style.css: #251 video override not found exactly once')
          css = css.replace(bad_video, '', 1)

          replacements = {
              '.hero-email-capybara { width: 88px; bottom: 28px; }': '.hero-email-capybara { width: 84px; bottom: 24px; }',
              '.hero-email-capybara { width: 84px; bottom: 27px; }': '.hero-email-capybara { width: 80px; bottom: 23px; }',
              '.hero-email-capybara { width: 90px; bottom: 28px; }': '.hero-email-capybara { width: 86px; bottom: 24px; }',
              '.hero-email-capybara { display: block; width: 80px; bottom: 27px; }': '.hero-email-capybara { display: block; width: 76px; bottom: 23px; }',
              '.doorlock-keypad { display: grid; grid-template-columns: repeat(4, minmax(42px, 1fr)); gap: 7px; }': '.doorlock-keypad { display: grid; grid-template-columns: repeat(3, minmax(42px, 1fr)); gap: 7px; }',
              'position: relative; min-height: 170px; border: 7px solid #6a4d35;': 'position: relative; height: 170px; min-height: 170px; box-sizing: border-box; border: 7px solid #6a4d35;',
              '.doorlock-keypad { grid-template-columns: repeat(4, minmax(36px, 1fr)); }': '.doorlock-keypad { grid-template-columns: repeat(3, minmax(36px, 1fr)); }',
              '.ucast-channel.is-reverse.is-entering .ucast-pedestrian { left:calc(100% - 88px) !important; transition:none !important; }': '.ucast-channel.is-reverse.is-entering .ucast-pedestrian { left:50% !important; transition:left .95s linear !important; }',
              '.ucast-channel.is-reverse.is-exiting .ucast-pedestrian { left:76px !important; transition:left .68s linear !important; }': '.ucast-channel.is-reverse.is-exiting .ucast-pedestrian { left:76px !important; transition:left .95s linear !important; }',
          }
          for old, new in replacements.items():
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'style.css: expected one target, got {count}: {old!r}')
              css = css.replace(old, new, 1)

          # Replace only the tomato styling; leave the already-approved FND/fan/other PlantClock CSS alone.
          tomato_old = '''.plant-tomato { position:absolute; z-index:3; width:17px; height:17px; border-radius:50%; background:#d94737; border:2px solid #9d2b25; box-shadow:inset -2px -2px 0 rgba(0,0,0,.12); }
.plant-tomato::before { content:""; position:absolute; left:4px; top:-5px; width:6px; height:6px; background:#39743b; clip-path:polygon(50% 0,65% 34%,100% 28%,72% 53%,84% 88%,50% 67%,16% 88%,28% 53%,0 28%,35% 34%); }
.plant-tomato-a { left:31px; top:5px; }
.plant-tomato-b { right:29px; top:21px; width:15px; height:15px; }'''
          tomato_new = '''.plant-tomato { position:absolute; z-index:4; width:20px; height:18px; border-radius:48% 52% 52% 48%; background:radial-gradient(circle at 34% 28%,#ff8a73 0 14%,#e94b39 34%,#bd2e28 78%,#99231f 100%); border:1px solid #81231f; box-shadow:0 2px 3px rgba(70,25,18,.28),inset -3px -3px 3px rgba(105,20,16,.18); }
.plant-tomato::before { content:""; position:absolute; left:50%; top:-6px; width:13px; height:9px; transform:translateX(-50%); background:#35733b; clip-path:polygon(50% 0,61% 35%,100% 20%,72% 52%,88% 88%,52% 66%,18% 92%,30% 55%,0 28%,39% 36%); }
.plant-tomato-a { left:25px; top:34px; }
.plant-tomato-b { right:20px; top:48px; width:18px; height:17px; }
.plant-tomato-c { left:48px; top:61px; width:16px; height:15px; }'''
          if css.count(tomato_old) != 1:
              raise SystemExit('style.css: old tomato block not found exactly once')
          css = css.replace(tomato_old, tomato_new, 1)
          css = css.replace(
              '@media (max-width:640px) { .plant-stem { left:36px !important; bottom:72px !important; height:45px !important; } .plant-leaf { bottom:91px !important; width:30px !important; height:18px !important; } .plant-leaf-left { left:12px !important; } .plant-leaf-right { right:12px !important; } .plant-tomato-a { left:21px; top:5px; width:14px; height:14px; } .plant-tomato-b { right:20px; top:18px; width:13px; height:13px; } }',
              '@media (max-width:640px) { .plant-stem { left:36px !important; bottom:72px !important; height:45px !important; } .plant-leaf { bottom:91px !important; width:30px !important; height:18px !important; } .plant-leaf-left { left:12px !important; } .plant-leaf-right { right:12px !important; } .plant-tomato-a { left:16px; top:28px; width:15px; height:14px; } .plant-tomato-b { right:12px; top:40px; width:14px; height:13px; } .plant-tomato-c { left:33px; top:52px; width:13px; height:12px; } }',
              1,
          )
          style.write_text(css, encoding='utf-8')

          # 2) Hardware demo logic.
          demos = Path('assets/project-demos.js')
          js = demos.read_text(encoding='utf-8')
          wall_waits = [
              ('setText(status, \'해수면 상승 감지\', \'Rising sea detected\');\n      await wait(900);', 'setText(status, \'해수면 상승 감지\', \'Rising sea detected\');\n      await wait(1100);'),
              ("setText(status, '장벽 상승 · 도시 방향 유입 차단', 'Barrier rising · protecting the city side');\n      await wait(900);", "setText(status, '장벽 상승 · 도시 방향 유입 차단', 'Barrier rising · protecting the city side');\n      await wait(1100);"),
              ("setText(status, '주의 단계 · 장벽 유지', 'Caution · barrier remains raised');\n      await wait(750);", "setText(status, '주의 단계 · 장벽 유지', 'Caution · barrier remains raised');\n      await wait(900);"),
              ("setText(status, '위험 단계 · 장벽 유지 · 배수 대기', 'Danger · barrier held · waiting to drain');\n      await wait(750);", "setText(status, '위험 단계 · 장벽 유지 · 배수 대기', 'Danger · barrier held · waiting to drain');\n      await wait(900);"),
              ("setText(status, '배수 중 · 장벽은 계속 올라간 상태', 'Draining · barrier stays fully raised');\n      await wait(1450);", "setText(status, '배수 중 · 장벽은 계속 올라간 상태', 'Draining · barrier stays fully raised');\n      await wait(1700);"),
              ("setText(status, '배수 완료 · 장벽 하강', 'Drainage complete · lowering barrier');\n      await wait(900);", "setText(status, '배수 완료 · 장벽 하강', 'Drainage complete · lowering barrier');\n      await wait(1100);"),
          ]
          for old, new in wall_waits:
              if js.count(old) != 1:
                  raise SystemExit(f'project-demos.js: wall timing target missing: {old!r}')
              js = js.replace(old, new, 1)

          # Force a rendered right-side start state before reverse movement, then use the same .95s speed as forward.
          old_reverse_start = """      channel.lane.classList.toggle('is-reverse', reverse);
      channel.lane.classList.add('is-active', 'is-entering');"""
          new_reverse_start = """      channel.lane.classList.toggle('is-reverse', reverse);
      channel.lane.classList.remove('is-entering', 'is-exiting');
      if (reverse) void channel.pedestrian.offsetWidth;
      channel.lane.classList.add('is-active', 'is-entering');"""
          if js.count(old_reverse_start) != 1:
              raise SystemExit('project-demos.js: reverse start block not found')
          js = js.replace(old_reverse_start, new_reverse_start, 1)
          old_reverse_wait = """      setText(status, `CH-${index + 1} 반대편 센서 접근`, `CH-${index + 1} approaching opposite sensor`);
      await wait(700);"""
          new_reverse_wait = """      setText(status, `CH-${index + 1} 반대편 센서 접근`, `CH-${index + 1} approaching opposite sensor`);
      await wait(reverse ? 1000 : 700);"""
          if js.count(old_reverse_wait) != 1:
              raise SystemExit('project-demos.js: reverse wait block not found')
          js = js.replace(old_reverse_wait, new_reverse_wait, 1)

          old_tomato = "plant.append(create('span', 'plant-tomato plant-tomato-a'), create('span', 'plant-tomato plant-tomato-b'));"
          new_tomato = "plant.append(create('span', 'plant-tomato plant-tomato-a'), create('span', 'plant-tomato plant-tomato-b'), create('span', 'plant-tomato plant-tomato-c'));"
          if js.count(old_tomato) != 1:
              raise SystemExit('project-demos.js: tomato nodes not found')
          js = js.replace(old_tomato, new_tomato, 1)

          # Doorlock: numeric 3-column keypad, reset and <- keys, separate Input and Close buttons.
          js = js.replace(
              "'원본 코드의 4×4 키패드·6자리 비밀번호(123456)·LCD·서보 잠금·성공/실패 신호를 로컬 데모로 재현합니다.',\n      'A local demo of the source 4×4 keypad, six-digit password (123456), LCD, servo lock and success/failure signals.'",
              "'6자리 비밀번호(123456)·LCD·서보 잠금·성공/실패 신호를 숫자 키패드로 재현합니다.',\n      'A numeric-keypad demo of the six-digit password (123456), LCD, servo lock and success/failure signals.'",
              1,
          )
          js = js.replace("setText(controlTitle, '4×4 키패드', '4×4 keypad');", "setText(controlTitle, '숫자 키패드', 'Numeric keypad');", 1)
          old_controls = """    const keypad = create('div', 'doorlock-keypad');
    const status = createStatus('비밀번호를 입력하세요.', 'Enter the password.');
    const closeButton = createButton('닫힘', 'Close / Lock', 'demo-action demo-action-secondary doorlock-close-action');
    controls.append(controlTitle, keypad, closeButton, status);"""
          new_controls = """    const keypad = create('div', 'doorlock-keypad');
    const inputButton = createButton('입력', 'Input', 'demo-action doorlock-input-action');
    const closeButton = createButton('닫힘', 'Close / Lock', 'demo-action demo-action-secondary doorlock-close-action');
    const status = createStatus('비밀번호를 입력하세요.', 'Enter the password.');
    controls.append(controlTitle, keypad, inputButton, closeButton, status);"""
          if js.count(old_controls) != 1:
              raise SystemExit('project-demos.js: door controls block not found')
          js = js.replace(old_controls, new_controls, 1)

          old_keypad = """    [['1','2','3','A'],['4','5','6','B'],['7','8','9','C'],['*','0','#','D']].flat().forEach((key) => {
      const button = create('button', 'doorlock-key');
      button.type = 'button';
      button.textContent = key === '*' ? translate('초기화', 'Reset') : key === '#' ? translate('입력', 'Input') : key;
      button.setAttribute('aria-label', key === '*' ? translate('입력 초기화', 'Reset input') : key === '#' ? translate('비밀번호 입력', 'Submit password') : key);
      button.addEventListener('click', () => {
        if (key === '#') {
          if (input === password) unlock(); else alarm();
          return;
        }
        if (key === '*') { clearInput(); return; }
        input += key;
        render('키 입력 · 입력 버튼으로 확인', 'Key entered · press Input to confirm');
      });
      keypad.append(button);
    });
    closeButton.addEventListener('click', () => {"""
          new_keypad = """    ['1','2','3','4','5','6','7','8','9','*','0','<-'].forEach((key) => {
      const button = create('button', 'doorlock-key');
      button.type = 'button';
      button.textContent = key === '*' ? translate('초기화', 'Reset') : key;
      button.setAttribute('aria-label', key === '*' ? translate('입력 초기화', 'Reset input') : key === '<-' ? translate('한 글자 지우기', 'Delete one character') : key);
      button.addEventListener('click', () => {
        if (key === '*') { clearInput(); return; }
        if (key === '<-') {
          if (input) input = input.slice(0, -1);
          render(input ? '마지막 한 글자를 지웠습니다.' : '입력값이 없습니다.', input ? 'Deleted the last character.' : 'No input to delete.');
          return;
        }
        if (input.length >= password.length) {
          render('비밀번호는 6자리입니다.', 'The password is six digits.');
          return;
        }
        input += key;
        render('키 입력 · 입력 버튼으로 확인', 'Key entered · press Input to confirm');
      });
      keypad.append(button);
    });
    inputButton.addEventListener('click', () => {
      if (input === password) unlock(); else alarm();
    });
    closeButton.addEventListener('click', () => {"""
          if js.count(old_keypad) != 1:
              raise SystemExit('project-demos.js: old 4x4 keypad block not found')
          js = js.replace(old_keypad, new_keypad, 1)
          demos.write_text(js, encoding='utf-8')

          # 3) Meal video: use actual MP4 dimensions so poster and playing state keep one box ratio.
          replace_once(
              'projects/meal_queue_signal_counter/index.html',
              '<video class="detail-video" controls preload="metadata" playsinline muted poster="assets/images/green-signal-demo.webp">',
              '<video class="detail-video" width="1080" height="1920" controls preload="metadata" playsinline muted poster="assets/images/green-signal-demo.webp">',
          )

          # 4) Wall_Sina: exact owner wording, actual video dimensions, caption, and no Korean commas in overview.
          wall = Path('projects/Wall_Sina/index.html')
          w = wall.read_text(encoding='utf-8')
          w = w.replace(
              '2024 지속 가능한 발전 프로젝트로, 기후 위기로 인한 해수면 상승에\n                대비한 해안 장벽 MVP입니다. 수조 안에 가상의 도시와 바다를\n                만들고, 이를 분리하는 장벽을 설계하여 해수면 상승 시나리오를\n                시뮬레이션하는 프로젝트입니다.',
              '2024 지속 가능한 발전 프로젝트로 기후 위기로 인한 해수면 상승에\n                대비한 해안 장벽 MVP입니다. 수조 안에 가상의 도시와 바다를\n                만들고 이를 분리하는 장벽을 설계하여 해수면 상승 시나리오를\n                시뮬레이션하는 프로젝트입니다.',
              1,
          )
          wall_videos = [
              ('<video class="detail-video" controls preload="metadata" playsinline poster="assets/images/prototype-1.webp">', '<video class="detail-video" width="1920" height="1080" controls preload="metadata" playsinline poster="assets/images/prototype-1.webp">'),
              ('<video class="detail-video" controls preload="metadata" playsinline muted poster="assets/images/final-model-overview.webp">', '<video class="detail-video" width="1280" height="720" controls preload="metadata" playsinline muted poster="assets/images/final-model-overview.webp">'),
              ('<video class="detail-video" controls preload="metadata" playsinline muted poster="assets/images/final-barrier-front.webp">', '<video class="detail-video" width="1920" height="1080" controls preload="metadata" playsinline muted poster="assets/images/final-barrier-front.webp">'),
          ]
          for old, new in wall_videos:
              if w.count(old) != 1:
                  raise SystemExit(f'Wall_Sina: video target missing: {old}')
              w = w.replace(old, new, 1)
          if w.count('data-ko="장벽 수조 테스트">장벽 수조 테스트') != 1:
              raise SystemExit('Wall_Sina: old water-test caption missing')
          w = w.replace('data-ko="장벽 수조 테스트">장벽 수조 테스트', 'data-ko="장벽 방수 테스트">장벽 방수 테스트', 1)
          wall.write_text(w, encoding='utf-8')

          # 5) U-CAST: owner-authored text exactly; no issue #6 reference; add operations-mentor record.
          ucast = Path('projects/2026_U-CAST/index.html')
          u = ucast.read_text(encoding='utf-8')
          u = u.replace('data-en="Team Mentor" data-ko="팀 멘토">팀 멘토', 'data-en="Team Mentor" data-ko="팀 건영아잘하자">팀 건영아잘하자', 1)
          u = u.replace('data-en="Team Mentor" data-ko="5팀 멘토">5팀 멘토', 'data-en="Team Mentor" data-ko="팀 건영아잘하자">팀 건영아잘하자', 1)
          old_overview_attr = 'A hardware prototype named &quot;Stop!&quot;, built by Team 5 for the Cheonan Youth Urban Regeneration Challenge (U-CAST). Each curb section pairs a start/end IR sensor with its own NeoPixel strip as one independent channel: when a pedestrian steps toward the road, that channel\'s strip blinks red, a shared driver-facing LED blinks, and a passive buzzer sounds a rising/falling siren, all continuing until that same channel\'s end IR confirms the pedestrian has cleared it. It is a secondary-accident-prevention device — it does not physically block jaywalking, but warns drivers and pedestrians faster once someone has already entered the road (issue #6).'
          new_overview_attr = 'A hardware prototype named &quot;Stop!&quot;, built by Team 5 for the Cheonan Youth Urban Regeneration Challenge (U-CAST). Each curb section pairs a start/end IR sensor with its own NeoPixel strip as one independent channel: when a pedestrian steps toward the road, that channel\'s strip blinks red, a shared driver-facing LED blinks, and a passive buzzer sounds a rising/falling siren, all continuing until that same channel\'s end IR confirms the pedestrian has cleared it. It is a secondary-accident-prevention device — it does not physically block jaywalking, but warns drivers and pedestrians faster once someone has already entered the road.'
          u = u.replace(old_overview_attr, new_overview_attr, 1)
          old_ko_attr = '천안시 청소년 도시재생 챌린지(U-CAST) 5팀이 만든 하드웨어형 시제품 「멈춰 !」입니다. 구간마다 시작·끝 IR 센서와 네오픽셀 스트립을 하나로 묶어 독립 채널로 삼습니다. 보행자가 도로 쪽으로 들어서면 그 채널의 스트립이 빨간색으로 점멸하고, 공용 운전자 경고 LED가 점멸하며, 수동 부저가 사이렌을 내고, 같은 채널의 끝 IR이 보행자의 통과를 확인할 때까지 유지됩니다. 무단횡단을 물리적으로 막지는 않지만 이미 도로에 진입한 보행자를 운전자·보행자에게 더 빨리 알리는 2차 사고 예방 장치입니다(이슈 #6).'
          new_ko_attr = '천안시 청소년 도시재생 챌린지(U-CAST) 5팀이 만든 하드웨어형 시제품 「멈춰 !」입니다. 구간마다 시작·끝 IR 센서와 네오픽셀 스트립을 하나로 묶어 독립 채널로 삼습니다. 보행자가 도로 쪽으로 들어서면 그 채널의 스트립이 빨간색으로 점멸하고 공용 운전자 경고 LED가 점멸하며 수동 부저가 사이렌을 내고 같은 채널의 끝 IR이 보행자의 통과를 확인할 때까지 유지됩니다. 무단횡단을 물리적으로 막지는 않지만 이미 도로에 진입한 보행자를 운전자·보행자에게 더 빨리 알리는 2차 사고 예방 장치입니다.'
          u = u.replace(old_ko_attr, new_ko_attr, 1)
          old_visible = '''                천안시 청소년 도시재생 챌린지(U-CAST) 5팀이 만든 하드웨어형
                시제품 「멈춰 !」입니다. 구간마다 시작 · 끝 IR 센서와 네오픽셀
                스트립을 하나로 묶었습니다. 보행자가 도로
                쪽으로 들어서면 그 채널의 LED 스트립이 빨간색으로 점멸하고 공용
                운전자 경고 LED가 점멸하며 수동 부저가 사이렌을 내고 같은
                채널의 끝 IR이 보행자의 통과를 확인할 때까지 시스템 작동이 유지됩니다.
                무단횡단을 물리적으로 막지는 않지만 이미 도로에 진입한
                보행자를 운전자 · 보행자에게 더 빨리 알리는 2차 사고 예방
                장치입니다.'''
          new_visible = '''                천안시 청소년 도시재생 챌린지(U-CAST) 5팀이 만든 하드웨어형 시제품 「멈춰 !」입니다.
                구간마다 시작·끝 IR 센서와 네오픽셀 스트립을 하나로 묶어 독립 채널로 삼습니다.
                보행자가 도로 쪽으로 들어서면 그 채널의 스트립이 빨간색으로 점멸하고 공용 운전자 경고 LED가 점멸하며
                수동 부저가 사이렌을 내고 같은 채널의 끝 IR이 보행자의 통과를 확인할 때까지 유지됩니다.
                무단횡단을 물리적으로 막지는 않지만 이미 도로에 진입한 보행자를 운전자·보행자에게 더 빨리 알리는
                2차 사고 예방 장치입니다.'''
          if u.count(old_visible) != 1:
              raise SystemExit('U-CAST: visible overview target missing')
          u = u.replace(old_visible, new_visible, 1)

          mentor_anchor = '''              <ul>
                <li data-en="Refined the problem statement, final naming (&quot;Stop!&quot;) and MVP scope">문제 정의, 최종 명칭(「멈춰 !」)과 MVP 범위 구체화</li>
                <li data-en="Guided the redesign from a merged bidirectional state to independent per-channel state machines">병합된 양방향 상태에서 채널별 독립 상태 머신으로의 재설계 지도</li>
                <li data-en="Supported wiring review, debugging and safer configuration boundaries">배선 검토 · 디버깅 · 안전한 설계 지원</li>
                <li data-en="Prepared assembly, troubleshooting and presentation materials with the team">조립 · 문제 해결 · 발표 시연 자료 준비 지원</li>
              </ul>
            </div>'''
          mentor_replacement = mentor_anchor + '''
            <div class="detail-section" data-aos="fade-up" data-aos-delay="110">
              <h2 data-en="U-CAST Outstanding Operations Mentor" data-ko="U-CAST 우수 운영 멘토">U-CAST 우수 운영 멘토</h2>
              <ul>
                <li data-en="One mentor recognized by organizers for high on-site contribution" data-ko="운영진 평가 기준 현장 기여도가 높은 멘토 1인">운영진 평가 기준 현장 기여도가 높은 멘토 1인</li>
                <li data-en="Supported student mentoring and completion, photo/video records, team atmosphere, and overall field operations" data-ko="학생 멘토링 및 완주 독려, 사진 및 영상 기록, 팀 분위기 관리 등 전체 현장 운영 협조">학생 멘토링 및 완주 독려, 사진 및 영상 기록, 팀 분위기 관리 등 전체 현장 운영 협조</li>
                <li data-en="Recognition for a mentor who actively contributed to program operations and student support independently of award results" data-ko="수상 결과와 별개로 프로그램 운영과 학생 지원에 적극적으로 기여한 멘토 격려">수상 결과와 별개로 프로그램 운영과 학생 지원에 적극적으로 기여한 멘토 격려</li>
              </ul>
            </div>'''
          if u.count(mentor_anchor) != 1:
              raise SystemExit('U-CAST: role anchor missing')
          u = u.replace(mentor_anchor, mentor_replacement, 1)
          ucast.write_text(u, encoding='utf-8')

      - name: Static and build regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check detail.js
          node --check assets/project-demos.js
          node tools/verify-build.js
          cp projects.json /tmp/projects.before.json
          node build.js
          cmp -s projects.json /tmp/projects.before.json
          git diff --check

          # No stale #251 regression CSS.
          ! grep -Fq 'aspect-ratio:auto !important' style.css
          ! grep -Fq 'transition:none !important' style.css
          ! grep -Fq 'transition:left .68s linear' style.css

          # Video intrinsic dimensions are explicit.
          grep -Fq 'width="1080" height="1920" controls' projects/meal_queue_signal_counter/index.html
          grep -Fq 'width="1920" height="1080" controls' projects/Wall_Sina/index.html
          grep -Fq 'width="1280" height="720" controls' projects/Wall_Sina/index.html

          # Exact user wording and exclusions.
          grep -Fq '장벽 방수 테스트' projects/Wall_Sina/index.html
          ! grep -Fq '장벽 수조 테스트' projects/Wall_Sina/index.html
          grep -Fq '팀 건영아잘하자' projects/2026_U-CAST/index.html
          grep -Fq 'U-CAST 우수 운영 멘토' projects/2026_U-CAST/index.html
          grep -Fq '운영진 평가 기준 현장 기여도가 높은 멘토 1인' projects/2026_U-CAST/index.html
          grep -Fq '학생 멘토링 및 완주 독려, 사진 및 영상 기록, 팀 분위기 관리 등 전체 현장 운영 협조' projects/2026_U-CAST/index.html
          grep -Fq '수상 결과와 별개로 프로그램 운영과 학생 지원에 적극적으로 기여한 멘토 격려' projects/2026_U-CAST/index.html
          ! grep -Fq '(이슈 #6)' projects/2026_U-CAST/index.html
          ! grep -Fq '(issue #6)' projects/2026_U-CAST/index.html

          # Doorlock and PlantClock contracts.
          ! grep -Fq "['1','2','3','A']" assets/project-demos.js
          grep -Fq "'1','2','3','4','5','6','7','8','9','*','0','<-'" assets/project-demos.js
          grep -Fq "createButton('입력', 'Input'" assets/project-demos.js
          grep -Fq 'plant-tomato-c' assets/project-demos.js

          # Passing #252 areas are untouched on this branch.
          git diff --name-only origin/main...HEAD -- projects/koreatechGongjiAgent projects/HEALTH_CHECK_PROJECT projects/nonofire | grep -q '^$' || {
            echo 'A #252-passing project was unexpectedly changed'; exit 1;
          }

      - name: Browser regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 -m http.server 8000 >/tmp/qa252-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > /tmp/qa252_browser.py <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--autoplay-policy=no-user-gesture-required')
          opts.add_argument('--window-size=1440,1000')
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 10)
          base = 'http://127.0.0.1:8000/'

          def rect(el):
              return driver.execute_script('const r=arguments[0].getBoundingClientRect(); return {x:r.x,y:r.y,w:r.width,h:r.height};', el)

          def close(a,b,tol=1.5):
              return abs(a['w']-b['w']) <= tol and abs(a['h']-b['h']) <= tol

          # HOME: overlap behind the email control, without an oversized capybara.
          driver.get(base + 'index.html')
          cap = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '.hero-email-capybara'))
          email = driver.find_element(By.CSS_SELECTOR, '.hero-email-wrap .hero-email')
          cr, er = rect(cap), rect(email)
          overlap = min(cr['y']+cr['h'], er['y']+er['h']) - max(cr['y'], er['y'])
          assert 4 <= overlap <= 34, (cr, er, overlap)
          assert cr['w'] <= 86, cr
          assert driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')

          # Video box must not change when playback starts.
          video_pages = [
              ('projects/meal_queue_signal_counter/index.html', 1),
              ('projects/Wall_Sina/index.html', 3),
          ]
          for page, expected in video_pages:
              driver.get(base + page)
              vids = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, 'video.detail-video'))
              assert len(vids) == expected, (page, len(vids))
              for v in vids:
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'});", v)
                  before = rect(v)
                  driver.execute_script('arguments[0].muted=true; arguments[0].play();', v)
                  time.sleep(.7)
                  after = rect(v)
                  driver.execute_script('arguments[0].pause();', v)
                  assert close(before, after), (page, before, after)

          # U-CAST reverse: no 1s stall + fast jump; movement must be progressive and finish right->left.
          driver.get(base + 'projects/2026_U-CAST/index.html#live-demo')
          buttons = wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, '.ucast-device-demo .hardware-control-panel .demo-action'))
          reverse = next(b for b in buttons if 'CH-1 역방향' in b.text)
          ped = driver.find_elements(By.CSS_SELECTOR, '.ucast-channel .ucast-pedestrian')[0]
          reverse.click()
          x0 = rect(ped)['x']
          time.sleep(.42); x1 = rect(ped)['x']
          time.sleep(.62); x2 = rect(ped)['x']
          time.sleep(.45); x3 = rect(ped)['x']
          time.sleep(.58); x4 = rect(ped)['x']
          assert x0 > x1 > x2 > x3 > x4, (x0,x1,x2,x3,x4)
          assert (x0-x1) > 8 and (x2-x3) > 8, (x0,x1,x2,x3,x4)

          # Wall_Sina: complete three longer cycles; each should be well over six seconds.
          driver.get(base + 'projects/Wall_Sina/index.html#live-demo')
          power = wait.until(lambda d: d.find_element(By.XPATH, "//div[contains(@class,'wall-device-demo')]//button[contains(.,'시스템 켜기')]"))
          power.click()
          for _ in range(3):
              detect = wait.until(lambda d: d.find_element(By.XPATH, "//div[contains(@class,'wall-device-demo')]//button[contains(.,'해수면 상승 감지')]"))
              t0 = time.monotonic(); detect.click()
              wait.until(lambda d: '장벽 복귀 완료' in d.find_element(By.CSS_SELECTOR, '.wall-device-demo .demo-live-status').text)
              elapsed = time.monotonic() - t0
              assert elapsed >= 6.4, elapsed

          # PlantClock smoke: only tomato changed; approved controls still work.
          driver.get(base + 'projects/PlantClock/index.html#live-demo')
          wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '.plant-tomato')) == 3)
          pbuttons = driver.find_elements(By.CSS_SELECTOR, '.plant-device-demo .hardware-control-panel .demo-action')
          next(b for b in pbuttons if '시간 +10분' in b.text).click()
          assert '10분' in driver.find_element(By.CSS_SELECTOR, '.plant-device-demo .demo-live-status').text
          next(b for b in pbuttons if '급수 버튼' in b.text).click()
          assert '급수 시각' in driver.find_element(By.CSS_SELECTOR, '.plant-device-demo .demo-live-status').text
          next(b for b in pbuttons if '팬 레버' in b.text).click()
          assert driver.find_element(By.CSS_SELECTOR, '.plantclock-device').get_attribute('class').find('fan-on') >= 0

          # Doorlock: no ABCD, one-char delete, 123456 unlock, close relock, stable door box.
          driver.get(base + 'projects/doorlock/index.html#live-demo')
          wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, '.doorlock-key'))
          keys = driver.find_elements(By.CSS_SELECTOR, '.doorlock-key')
          texts = [k.text for k in keys]
          assert all(x not in texts for x in ['A','B','C','D','#']), texts
          assert '<-' in texts and '초기화' in texts, texts
          door = driver.find_element(By.CSS_SELECTOR, '.doorlock-door')
          locked_rect = rect(door)
          def key(text):
              next(k for k in driver.find_elements(By.CSS_SELECTOR, '.doorlock-key') if k.text == text).click()
          for n in '12345': key(n)
          key('<-')
          assert 'Password: 1234' in driver.find_element(By.CSS_SELECTOR, '.doorlock-lcd').text
          key('5'); key('6')
          next(b for b in driver.find_elements(By.CSS_SELECTOR, '.doorlock-device-demo .demo-action') if b.text == '입력').click()
          assert 'OPEN' in driver.find_element(By.CSS_SELECTOR, '.doorlock-lcd').text
          open_rect = rect(door)
          assert close(locked_rect, open_rect), (locked_rect, open_rect)
          next(b for b in driver.find_elements(By.CSS_SELECTOR, '.doorlock-device-demo .demo-action') if b.text == '닫힘').click()
          assert 'LOCKED' in driver.find_element(By.CSS_SELECTOR, '.doorlock-lcd').text

          # Mobile smoke and horizontal overflow for all changed pages.
          driver.set_window_size(390, 844)
          for page in ['index.html','projects/meal_queue_signal_counter/index.html','projects/Wall_Sina/index.html','projects/2026_U-CAST/index.html','projects/PlantClock/index.html','projects/doorlock/index.html']:
              driver.get(base + page)
              assert driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1'), page

          driver.quit()
          PY
          python3 /tmp/qa252_browser.py

      - name: Commit only after all regression checks pass
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/qa252-inspect-media.yml .github/workflows/qa252-apply-regression-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/project-demos.js style.css \
            projects/meal_queue_signal_counter/index.html \
            projects/Wall_Sina/index.html \
            projects/2026_U-CAST/index.html
          git commit -m 'fix: resolve #252 post-merge regressions'
          git push origin HEAD:chatgpt/qa252-regression-fix
