name: qa249-shuttle-asset

on:
  push:
    branches:
      - chatgpt/qa249-final-acceptance
    paths:
      - .github/workflows/qa249-shuttle-asset.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa249-final-acceptance
      - name: Rebuild user-provided shuttle screenshot
        shell: bash
        run: |
          set -euo pipefail
          cat .qa249/shuttle.part1 .qa249/shuttle.part2 .qa249/shuttle.part3 | base64 --decode > /tmp/web-shuttle-live.webp
          echo '9fc893eaf701d84324e08ecc16172bf072ccb97c4505305df0b65e2fba61bbea  /tmp/web-shuttle-live.webp' | sha256sum -c -
          file /tmp/web-shuttle-live.webp
          cp /tmp/web-shuttle-live.webp projects/koreatechGongjiAgent/assets/images/web-shuttle-live.webp
          rm -rf .qa249
      - name: Commit rebuilt asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/koreatechGongjiAgent/assets/images/web-shuttle-live.webp .qa249
          git diff --cached --exit-code && exit 0
          git commit -m 'fix: replace KGA shuttle capture from #249'
          git push origin HEAD:chatgpt/qa249-final-acceptance
