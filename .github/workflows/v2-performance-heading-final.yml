name: v2 performance heading final

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-and-push:
    if: github.head_ref == 'agent/v2-performance-final-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          ref: agent/v2-performance-final-runner
          path: runner
          fetch-depth: 1

      - name: Checkout stacked v2 target
        uses: actions/checkout@v4
        with:
          ref: agent/v2-performance-final
          path: final
          fetch-depth: 120
          token: ${{ github.token }}

      - name: Apply final live-detail pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('final')
          project_root = root / 'projects'
          live = []
          archives = []
          font_pat = re.compile(r'<link\s+href="(https://fonts\.googleapis\.com/css2\?[^\"]+)"\s+rel="stylesheet"\s*/>', re.S)
          fa_pat = re.compile(r'<link\s+rel="stylesheet"\s+href="(https://cdnjs\.cloudflare\.com/ajax/libs/font-awesome/6\.4\.0/css/all\.min\.css)"\s*/>', re.S)

          def add_aria(text, pattern, label, what):
              m = re.search(pattern, text, re.S)
              if not m:
                  raise SystemExit(f'{what} opening tag missing')
              tag = m.group(0)
              if 'aria-label=' in tag:
                  return text
              return text[:m.start()] + tag[:-1] + f' aria-label="{label}">' + text[m.end():]

          for p in sorted(project_root.rglob('*.html')):
              s = p.read_text(encoding='utf-8')
              if 'class="detail-body"' not in s:
                  continue
              rel = str(p.relative_to(root))
              if p.name == '_archive.html':
                  archives.append(rel)
                  continue
              live.append(rel)
              before = s

              s = re.sub(r'\n\s*<link href="https://unpkg\.com/aos@2\.3\.1/dist/aos\.css" rel="stylesheet" />', '', s)
              s = re.sub(r'\n\s*<script src="https://unpkg\.com/aos@2\.3\.1/dist/aos\.js"></script>', '', s)
              s = re.sub(r'\n\s*<script src="https://cdnjs\.cloudflare\.com/ajax/libs/vanilla-tilt/1\.8\.0/vanilla-tilt\.min\.js"></script>', '', s)
              s = s.replace('<script src="../../script.js"></script>', '<script src="../../detail.js"></script>')

              fm = font_pat.search(s)
              if not fm:
                  raise SystemExit(f'Google Fonts stylesheet missing in {rel}')
              font_url = fm.group(1).replace('display=swap', 'display=optional')
              font_block = f'<link href="{font_url}" rel="stylesheet" media="print" onload="this.media=\'all\'" />\n    <noscript><link href="{font_url}" rel="stylesheet" /></noscript>'
              s = s[:fm.start()] + font_block + s[fm.end():]

              fam = fa_pat.search(s)
              if not fam:
                  raise SystemExit(f'Font Awesome stylesheet missing in {rel}')
              fa_url = fam.group(1)
              fa_block = f'<link rel="stylesheet" href="{fa_url}" media="print" onload="this.media=\'all\'" />\n    <noscript><link rel="stylesheet" href="{fa_url}" /></noscript>'
              s = s[:fam.start()] + fa_block + s[fam.end():]

              s = s.replace('<button type="button" id="btn-back-to-top">', '<button type="button" id="btn-back-to-top" aria-label="맨 위로">', 1)
              s = add_aria(s, r'<a\b(?=[^>]*class="nav-github")[^>]*>', 'GitHub 프로필', f'{rel} nav GitHub')
              social_match = re.search(r'<div class="social-links">.*?</div>', s, re.S)
              if not social_match:
                  raise SystemExit(f'social links missing in {rel}')
              social = social_match.group(0)
              social = add_aria(social, r'<a\b(?=[^>]*href="https://github\.com/pachir1su")[^>]*>', 'GitHub 프로필', f'{rel} footer GitHub')
              social = add_aria(social, r'<a\b(?=[^>]*href="mailto:capybara@koreatech\.ac\.kr")[^>]*>', '이메일 보내기', f'{rel} footer email')
              s = s[:social_match.start()] + social + s[social_match.end():]

              if '<main id="main-content">' not in s:
                  hero = '    <section class="detail-hero">'
                  footer = '    <footer>'
                  if hero not in s or footer not in s:
                      raise SystemExit(f'main markers missing in {rel}')
                  s = s.replace(hero, '    <main id="main-content">\n' + hero, 1)
                  s = s.replace(footer, '    </main>\n\n' + footer, 1)

              # Preserve h4 visuals while exposing the correct accessible heading level.
              s = re.sub(r'<h4(?![^>]*aria-level=)', '<h4 role="heading" aria-level="3"', s)

              if s == before:
                  raise SystemExit(f'expected mutation missing in {rel}')
              p.write_text(s.rstrip() + '\n', encoding='utf-8')

          if len(live) != 28:
              raise SystemExit(f'expected 28 live detail pages, got {len(live)}')
          if archives != ['projects/Sibal_Life_Smoking/_archive.html']:
              raise SystemExit(f'unexpected archive set: {archives}')

          p = root / 'detail.js'
          s = p.read_text(encoding='utf-8')
          old = """    if (langDesktop) langDesktop.title = lang === 'ko' ? 'English' : '한국어';\n    applyTheme(document.documentElement.dataset.theme || 'light');\n"""
          new = """    if (langDesktop) {\n      langDesktop.title = lang === 'ko' ? 'English' : '한국어';\n      langDesktop.setAttribute('aria-label', lang === 'ko' ? 'EN · English' : 'KO · 한국어');\n    }\n    if (langMobile) langMobile.setAttribute('aria-label', lang === 'ko' ? 'English · 언어 전환' : '한국어 · Switch language');\n    applyTheme(document.documentElement.dataset.theme || 'light');\n"""
          if old not in s:
              raise SystemExit('detail.js insertion point missing')
          p.write_text(s.replace(old, new, 1).rstrip() + '\n', encoding='utf-8')

          for rel in live:
              s = (root / rel).read_text(encoding='utf-8')
              bad = []
              if 'unpkg.com/aos@' in s: bad.append('AOS')
              if 'VanillaTilt' in s or 'vanilla-tilt' in s: bad.append('VanillaTilt')
              if 'src="../../script.js"' in s: bad.append('root-script')
              if 'src="../../detail.js"' not in s: bad.append('missing-detail-js')
              if '<main id="main-content">' not in s: bad.append('missing-main')
              if 'id="btn-back-to-top" aria-label=' not in s: bad.append('unnamed-back-to-top')
              if 'media="print"' not in s or 'display=optional' not in s: bad.append('blocking-external-css')
              if '<h4' in s and 'aria-level="3"' not in s: bad.append('heading-level')
              if bad:
                  raise SystemExit(f'{rel}: {bad}')
          print(f'optimized live details={len(live)}, preserved archives={archives}')
          PY
          node --check final/detail.js
          node --check final/script.js
          node final/tools/verify-build.js
          git -C final diff --check
          test "$(git -C final status --porcelain=v1 --untracked-files=all | wc -l)" -eq 29

      - name: Install browser and Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-perf-heading-node
          cd /tmp/v2-perf-heading-node
          npm init -y >/dev/null
          npm install playwright@1.55.0 lighthouse >/dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=/tmp/v2-perf-heading-node/node_modules" >> "$GITHUB_ENV"

      - name: Serve target
        shell: bash
        run: |
          python3 -m http.server 4179 --directory final >/tmp/v2-perf-heading-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4179/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/v2-perf-heading-http.log
          exit 1

      - name: Run all-live-detail regression
        env:
          BASE_URL: http://127.0.0.1:4179
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2-performance-heading-evidence
          NODE_PATH="$NODE_PATH" CHROME_PATH="$CHROME_PATH" node <<'NODE'
          const { chromium }=require('playwright'); const fs=require('fs'); const path=require('path');
          const root=path.resolve('final/projects');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)])}
          const pages=walk(root).filter(p=>p.endsWith('.html')&&path.basename(p)!=='_archive.html'&&fs.readFileSync(p,'utf8').includes('class="detail-body"')).map(p=>'/' + path.relative(path.resolve('final'),p).split(path.sep).join('/'));
          if(pages.length!==28)throw new Error(`expected 28 pages, got ${pages.length}`);
          (async()=>{const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']}); const failures=[]; let cases=0;
            for(const width of [390,1280])for(const theme of ['light','dark'])for(const url of pages){cases++; const page=await browser.newPage({viewport:{width,height:900}}); const errs=[]; const bad=[]; page.on('pageerror',e=>errs.push(e.message)); page.on('request',r=>{if(/aos|vanilla-tilt|devicon/i.test(r.url()))bad.push(r.url())}); await page.addInitScript(t=>localStorage.setItem('theme',t),theme);
              try{await page.goto(process.env.BASE_URL+url,{waitUntil:'networkidle',timeout:60000}); const st=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,broken:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src),detail:[...document.scripts].some(s=>/\/detail\.js(?:$|\?)/.test(s.src)),root:[...document.scripts].some(s=>/\/script\.js(?:$|\?)/.test(s.src)),main:document.querySelectorAll('main').length,lang:document.querySelector('#langToggle')?.getAttribute('aria-label')||'',badHeading:[...document.querySelectorAll('.detail-sidebar h4')].filter(h=>h.getAttribute('aria-level')!=='3').length})); if(st.overflow)throw new Error('overflow'); if(st.broken.length)throw new Error('broken images'); if(!st.detail||st.root)throw new Error('wrong runtime'); if(st.main!==1)throw new Error(`main ${st.main}`); if(!st.lang.includes('EN'))throw new Error('lang name'); if(st.badHeading)throw new Error('heading level'); if(errs.length)throw new Error(errs.join('|')); if(bad.length)throw new Error(bad.join('|'));}catch(e){failures.push(`${width}-${theme}-${url}: ${e.message}`)} await page.close();}
            const p=await browser.newPage({viewport:{width:390,height:900}}); await p.goto(process.env.BASE_URL+'/projects/swordmaster/media_swordmaster.html',{waitUntil:'networkidle'}); await p.locator('#langToggle').click(); const switched=await p.locator('#langToggle').getAttribute('aria-label'); if(!switched?.includes('KO'))failures.push(`switch name ${switched}`); await p.close(); await browser.close(); const out={pages:pages.length,cases,failures}; fs.writeFileSync('v2-performance-heading-evidence/detail-regression.json',JSON.stringify(out,null,2)); console.log(out); if(failures.length)process.exit(1);})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Lighthouse final gate
        shell: bash
        run: |
          set -euo pipefail
          LH=/tmp/v2-perf-heading-node/node_modules/.bin/lighthouse
          mkdir -p v2-performance-heading-evidence/lighthouse
          "$LH" http://127.0.0.1:4179/ --chrome-path="$CHROME_PATH" --output=json --output-path=v2-performance-heading-evidence/lighthouse/root-mobile.json --quiet --chrome-flags="--headless --no-sandbox"
          "$LH" http://127.0.0.1:4179/ --chrome-path="$CHROME_PATH" --preset=desktop --output=json --output-path=v2-performance-heading-evidence/lighthouse/root-desktop.json --quiet --chrome-flags="--headless --no-sandbox"
          "$LH" http://127.0.0.1:4179/projects/swordmaster/media_swordmaster.html --chrome-path="$CHROME_PATH" --output=json --output-path=v2-performance-heading-evidence/lighthouse/media-mobile.json --quiet --chrome-flags="--headless --no-sandbox"
          "$LH" http://127.0.0.1:4179/projects/swordmaster/media_swordmaster.html --chrome-path="$CHROME_PATH" --preset=desktop --output=json --output-path=v2-performance-heading-evidence/lighthouse/media-desktop.json --quiet --chrome-flags="--headless --no-sandbox"
          node <<'NODE'
          const fs=require('fs'); const out={}; for(const k of ['root-mobile','root-desktop','media-mobile','media-desktop']){const j=JSON.parse(fs.readFileSync(`v2-performance-heading-evidence/lighthouse/${k}.json`)); const failed=j.categories.accessibility.auditRefs.map(r=>({id:r.id,w:r.weight,a:j.audits[r.id]})).filter(x=>x.w>0&&x.a&&x.a.score!==1).map(x=>x.id); out[k]={performance:Math.round(j.categories.performance.score*100),accessibility:Math.round(j.categories.accessibility.score*100),bestPractices:Math.round(j.categories['best-practices'].score*100),seo:Math.round(j.categories.seo.score*100),fcp:j.audits['first-contentful-paint'].displayValue,lcp:j.audits['largest-contentful-paint'].displayValue,tbt:j.audits['total-blocking-time'].displayValue,cls:j.audits['cumulative-layout-shift'].displayValue,bytes:j.audits['total-byte-weight'].displayValue,failedA11y:failed};}
          fs.writeFileSync('v2-performance-heading-evidence/lighthouse-summary.json',JSON.stringify(out,null,2)); console.log(out);
          if(out['root-mobile'].performance<85)throw new Error('root mobile perf'); if(out['root-desktop'].performance<95)throw new Error('root desktop perf'); if(out['media-mobile'].performance<80)throw new Error('media mobile perf'); if(out['media-desktop'].performance<90)throw new Error('media desktop perf'); for(const k of Object.keys(out))if(out[k].accessibility<100)throw new Error(`${k} a11y ${out[k].failedA11y.join(',')}`);
          NODE

      - name: Commit 29 files atomically and push
        shell: bash
        run: |
          set -euo pipefail
          cd final
          BASE="ddf43af200509c3ec3527001a86751e7b1be4fa4"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t files < <(git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 29
          printf '%s\n' "${files[@]}" | grep -qx 'detail.js'
          test "$(printf '%s\n' "${files[@]}" | grep -c '^projects/.*\.html$')" -eq 28
          git config user.name "v2 performance runner"
          git config user.email "actions@users.noreply.github.com"
          for file in "${files[@]}"; do git add -- "$file"; git commit -m "perf: finalize v2 detail ${file}" -- "$file"; done
          changed="$(git diff --name-only "$BASE"...HEAD | wc -l)"; commits="$(git rev-list --count "$BASE"..HEAD)"; echo "changed=$changed commits=$commits"; test "$changed" -eq 29; test "$commits" -eq 29; test "$changed" -eq "$commits"
          EXPECTED="$(git ls-remote origin refs/heads/agent/v2-performance-final | cut -f1)"; test "$EXPECTED" = "$BASE"
          git push --force-with-lease=refs/heads/agent/v2-performance-final:"$EXPECTED" origin HEAD:agent/v2-performance-final

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-performance-heading-final-evidence
          path: v2-performance-heading-evidence
