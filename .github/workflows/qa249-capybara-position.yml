# trigger: 2
name: qa249-capybara-position

on:
  push:
    branches:
      - chatgpt/qa249-final-acceptance
    paths:
      - .github/workflows/qa249-capybara-position.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa249-final-acceptance
      - name: Fine-tune capybara overlap from #249
        shell: python
        run: |
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '.hero-email-capybara { width: 88px; bottom: 38px; }': '.hero-email-capybara { width: 88px; bottom: 28px; }',
              '.hero-email-capybara { width: 84px; bottom: 36px; }': '.hero-email-capybara { width: 84px; bottom: 27px; }',
              '.hero-email-capybara { width: 90px; bottom: 36px; }': '.hero-email-capybara { width: 90px; bottom: 28px; }',
              '.hero-email-capybara { display: block; width: 80px; bottom: 36px; }': '.hero-email-capybara { display: block; width: 80px; bottom: 27px; }',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {count}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit capybara position
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git commit -m 'fix: reconnect home capybara to email button'
          git push origin HEAD:chatgpt/qa249-final-acceptance
