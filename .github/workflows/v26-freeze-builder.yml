name: v2.6.x freeze builder

on:
  push:
    branches:
      - agent/v26-freeze-refactor
    paths:
      - .github/workflows/v26-freeze-builder.yml

permissions:
  contents: write

jobs:
  build-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26-freeze-refactor
          fetch-depth: 0

      - name: Apply v2.6.x static freeze
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, got {count}")
              return text.replace(old, new, 1)

          def remove_between(text, start_marker, end_marker, label, keep_end=True):
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(f"{label}: markers not found")
              return text[:start] + (end_marker if keep_end else '') + text[end + (len(end_marker) if keep_end else 0):]

          # -----------------------------------------------------------------
          # projects.json — keep the existing formatting and restore only the
          # two descriptions that the v2.6 runtime compatibility layer fixes.
          # -----------------------------------------------------------------
          projects_path = Path('projects.json')
          projects = projects_path.read_text(encoding='utf-8')
          projects = replace_once(
              projects,
              '"desc": { "en": "Online core course guide, assignment criteria, and an FAQ collection", "ko": "온라인중점강좌 안내 · 과제 평가 기준 · FAQ 모음" }',
              '"desc": { "en": "A Notion site for KOREATECH class of \'26 freshmen", "ko": "한기대 26학번 신입생을 위한 노션 사이트" }',
              'freshman guide description',
          )
          projects = replace_once(
              projects,
              '"desc": { "en": "Coins, gambling, transfers, shop and leaderboard on SQLite", "ko": "주화 · 도박 · 송금 · 상점 · 순위표를 SQLite로 관리" }',
              '"desc": { "en": "Discord economy game bot", "ko": "디스코드 경제 게임 봇" }',
              'MZ bot description',
          )
          projects_path.write_text(projects, encoding='utf-8')

          # -----------------------------------------------------------------
          # index.html — turn the current user-facing runtime result into the
          # actual static source. BUILD:PROJECTS is regenerated later.
          # -----------------------------------------------------------------
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          html = replace_once(html, '"alumniOf": {', '"affiliation": {', 'Person affiliation')

          # Simplified navigation, with translations stored in markup.
          html = replace_once(html, '          <li><a href="#home">홈</a></li>\n', '', 'desktop Home nav')
          for old, new, label in [
              ('<li><a href="#projects">프로젝트</a></li>', '<li><a href="#projects" data-ko="프로젝트" data-en="Projects">프로젝트</a></li>', 'desktop Projects nav'),
              ('<li><a href="#skills">역량</a></li>', '<li><a href="#skills" data-ko="역량" data-en="Skills">역량</a></li>', 'desktop Skills nav'),
              ('<li><a href="#awards">수상</a></li>', '<li><a href="#awards" data-ko="수상" data-en="Awards">수상</a></li>', 'desktop Awards nav'),
              ('<li><a href="#about">비전</a></li>', '<li><a href="#about" data-ko="비전" data-en="Vision">비전</a></li>', 'desktop Vision nav'),
          ]:
              html = replace_once(html, old, new, label)

          html = replace_once(html, '      <a href="#home" onclick="closeMobile()"><i class="fas fa-home"></i> 홈</a>\n', '', 'mobile Home nav')
          for old, new, label in [
              ('<a href="#projects" onclick="closeMobile()"><i class="fas fa-folder-open"></i> 프로젝트</a>', '<a href="#projects" onclick="closeMobile()" data-ko="프로젝트" data-en="Projects"><i class="fas fa-folder-open"></i> 프로젝트</a>', 'mobile Projects nav'),
              ('<a href="#skills" onclick="closeMobile()"><i class="fas fa-code"></i> 역량</a>', '<a href="#skills" onclick="closeMobile()" data-ko="역량" data-en="Skills"><i class="fas fa-code"></i> 역량</a>', 'mobile Skills nav'),
              ('<a href="#awards" onclick="closeMobile()"><i class="fas fa-trophy"></i> 수상</a>', '<a href="#awards" onclick="closeMobile()" data-ko="수상" data-en="Awards"><i class="fas fa-trophy"></i> 수상</a>', 'mobile Awards nav'),
              ('<a href="#about" onclick="closeMobile()"><i class="fas fa-user"></i> 비전</a>', '<a href="#about" onclick="closeMobile()" data-ko="비전" data-en="Vision"><i class="fas fa-user"></i> 비전</a>', 'mobile Vision nav'),
          ]:
              html = replace_once(html, old, new, label)

          floating_pattern = re.compile(r'\n      <div class="floating-icons" aria-hidden="true">.*?\n      </div>\n', re.S)
          html, n = floating_pattern.subn('\n', html, count=1)
          if n != 1:
              raise SystemExit(f'floating icons markup: expected 1 match, got {n}')

          html = html.replace(
              '         배경: 노트 줄 + 빨간 마진선 / 부유 아이콘 5개 / 타이핑 효과\n'
              '         통계(stat-item): 스크롤 진입 시 카운트업 애니메이션 (script.js #9)\n'
              '         부유 아이콘(.fi): JS rAF로 float 및 드래그 가능 (script.js #8)\n',
              '         배경: 노트 줄 + 빨간 마진선 / 타이핑 효과\n'
              '         통계(stat-item): 스크롤 진입 시 카운트업 애니메이션\n',
              1,
          )

          hero_copy_pattern = re.compile(r'        <div class="hero-role">.*?        </div>\n        <p class="hero-desc">.*?        </p>', re.S)
          hero_copy = '''        <div class="hero-role">
          혁신의 기업가 &amp;
          <span class="typing-wrap"><span id="typing-text"></span><span class="typing-cursor"></span></span>
        </div>
        <p class="hero-desc">
          이윤을 넘어 <strong>혁신</strong>을 추구하는 기업가를 꿈꿉니다.<br />
          <strong>월 100만 명</strong>이 사용하는 서비스를 만드는 것이 목표입니다.
        </p>'''
          html, n = hero_copy_pattern.subn(hero_copy, html, count=1)
          if n != 1:
              raise SystemExit(f'hero user copy: expected 1 match, got {n}')

          hero_buttons_pattern = re.compile(r'        <div class="hero-btns" data-aos="fade-up" data-aos-delay="80">.*?        </div>', re.S)
          hero_buttons = '''        <div class="hero-btns" data-aos="fade-up" data-aos-delay="80">
          <a href="#projects" class="btn btn-primary"><i class="fas fa-folder-open"></i> 프로젝트 보기</a>
          <a href="https://github.com/pachir1su" target="_blank" rel="noopener noreferrer" class="btn btn-ghost"><i class="fab fa-github"></i> GitHub</a>
          <button type="button" class="btn btn-ghost contact-email hero-email" title="클릭하면 복사됩니다">
            <i class="fas fa-envelope"></i><span class="email-addr">capybara@koreatech.ac.kr</span><span class="copy-hint sr-only">복사</span>
          </button>
        </div>'''
          html, n = hero_buttons_pattern.subn(hero_buttons, html, count=1)
          if n != 1:
              raise SystemExit(f'hero buttons: expected 1 match, got {n}')

          # Featured projects: preserve the current runtime rollback result as source.
          featured_start = html.find('        <div class="featured-grid">')
          featured_end_marker = '        <!-- ===== 전체 프로젝트 + 카테고리 필터 (#28) ===== -->'
