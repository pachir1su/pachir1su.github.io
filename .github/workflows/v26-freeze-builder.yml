              <li data-en="Extensive Team Leading" data-ko="팀 리딩 경험 다수"><i class="fas fa-user-friends"></i> 팀 리딩 경험 다수</li>
              <li data-en="Proficient Presentation Skills" data-ko="능숙한 발표 능력"><i class="fas fa-microphone-alt"></i> 능숙한 발표 능력</li>
