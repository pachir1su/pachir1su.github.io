name: qa253-final-browser

on:
  pull_request:
    types: [synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa252-regression-fix

      - name: Syntax checks
        run: |
          node --check assets/project-demos.js
          node --check detail.js
          node --check script.js

      - name: Build browser QA runner
        run: |
          cat > qa253-runner.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>QA253</title>
          <style>body{font-family:monospace}iframe{border:0}#log{white-space:pre-wrap}</style>
          <div id="log">RUNNING</div><iframe id="f"></iframe>
          <script>
          const logEl=document.getElementById('log'),f=document.getElementById('f'),results=[];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const out=(name,ok,detail='')=>{results.push({name,ok,detail});logEl.textContent+=`\n${ok?'PASS':'FAIL'} ${name}${detail?' :: '+detail:''}`};
          const rect=e=>e.getBoundingClientRect();
          const overlap=(a,b)=>!(a.right<=b.left||a.left>=b.right||a.bottom<=b.top||a.top>=b.bottom);
          async function load(path,w=1200,h=900,lang='ko'){
            localStorage.setItem('lang',lang);f.style.width=w+'px';f.style.height=h+'px';f.src=path+'?qa='+Date.now();
            const until=Date.now()+7000;
            while(Date.now()<until){
              try{const d=f.contentDocument;if(d&&d.body&&d.readyState!=='loading'){await sleep(500);return d}}catch(e){}
              await sleep(100);
            }
            throw new Error('DOM timeout '+path);
          }
          async function testHome(){for(const w of [1200,390]){const d=await load('/index.html',w,850);const cap=d.querySelector('.hero-email-capybara'),btn=d.querySelector('.hero-email'),text=d.querySelector('.hero-email .email-addr');out(`HOME ${w} capybara`,!!cap);if(cap&&btn&&text){const cr=rect(cap),br=rect(btn),tr=rect(text);out(`HOME ${w} attached`,cr.bottom>=br.top-8&&cr.top<br.bottom,`capBottom=${cr.bottom.toFixed(1)} btnTop=${br.top.toFixed(1)}`);out(`HOME ${w} text clear`,!overlap(cr,tr),`cap=${cr.left.toFixed(0)}-${cr.right.toFixed(0)} text=${tr.left.toFixed(0)}-${tr.right.toFixed(0)}`)}out(`HOME ${w} overflow`,d.documentElement.scrollWidth<=d.documentElement.clientWidth+2,`${d.documentElement.scrollWidth}/${d.documentElement.clientWidth}`)}}
          async function testKGA(){const d=await load('/projects/koreatechGongjiAgent/index.html',1000,900);const img=[...d.images].find(x=>x.src.includes('web-shuttle-live.webp'));await img.decode().catch(()=>{});out('KGA decode',img.complete&&img.naturalWidth>0,`${img.naturalWidth}x${img.naturalHeight}`);out('KGA portrait',img.naturalHeight>img.naturalWidth,`${img.naturalWidth}x${img.naturalHeight}`)}
          async function videoStable(path,label){const d=await load(path,1000,900);const videos=[...d.querySelectorAll('video.detail-video')];out(`${label} videos`,videos.length>0,`count=${videos.length}`);for(let i=0;i<videos.length;i++){const v=videos[i];const until=Date.now()+3000;while(v.readyState<1&&Date.now()<until)await sleep(100);const before=rect(v),fit=getComputedStyle(v).objectFit;let played=false;try{await v.play();played=true;await sleep(300)}catch(e){}const after=rect(v);v.pause();const delta=Math.max(Math.abs(before.width-after.width),Math.abs(before.height-after.height));out(`${label} video ${i+1} stable`,delta<1.5,`${before.width.toFixed(1)}x${before.height.toFixed(1)} -> ${after.width.toFixed(1)}x${after.height.toFixed(1)} played=${played}`);out(`${label} video ${i+1} no crop`,fit!=='cover',`fit=${fit}`)}}
          async function testWall(){const d=await load('/projects/Wall_Sina/index.html',1000,900);const root=d.querySelector('[data-project-demo="wall"]'),buttons=[...root.querySelectorAll('button')],power=buttons.find(b=>b.textContent.includes('시스템 켜기')),detect=buttons.find(b=>b.textContent.includes('해수면 상승 감지')),rig=root.querySelector('.wall-rig'),status=root.querySelector('.demo-live-status'),sensor=root.querySelector('.wall-water-sensor'),tank=root.querySelector('.wall-tank');power.click();detect.click();await sleep(150);out('Wall status',status.textContent.trim()==='해수면 상승 감지',status.textContent.trim());out('Wall threshold lowered',parseFloat(getComputedStyle(sensor).bottom)<rect(tank).height*.3+1,getComputedStyle(sensor).bottom);await sleep(1200);out('Wall early barrier',rig.classList.contains('barrier-raised'),rig.className);await sleep(6100);out('Wall complete',status.textContent.includes('장벽 복귀 완료'),status.textContent.trim())}
          async function testUcast(){const d=await load('/projects/2026_U-CAST/index.html',1000,900),root=d.querySelector('[data-project-demo="ucast"]'),lane=root.querySelector('.ucast-channel'),p=lane.querySelector('.ucast-pedestrian'),rev=[...root.querySelectorAll('button')].find(b=>b.textContent.includes('CH-1 역방향')),fwd=[...root.querySelectorAll('button')].find(b=>b.textContent.includes('CH-1 정방향')),x=()=>rect(p).left;const start=x();rev.click();await sleep(80);const r0=x();await sleep(450);const r1=x();await sleep(520);const r2=x();await sleep(450);const r3=x();await sleep(600);const r4=x();out('UCAST reverse starts right',r0>start+80,`${start.toFixed(0)} -> ${r0.toFixed(0)}`);out('UCAST reverse continuous',r1<r0-10&&r2<r1-10,`${r0.toFixed(0)},${r1.toFixed(0)},${r2.toFixed(0)}`);out('UCAST reverse reaches left',r4<r2-50,`${r2.toFixed(0)} -> ${r4.toFixed(0)}`);await sleep(350);fwd.click();await sleep(1050);const f0=x();await sleep(600);const f1=x();await sleep(180);const f2=x();out('UCAST forward no early reset',f2>=f1-5,`${f0.toFixed(0)},${f1.toFixed(0)},${f2.toFixed(0)}`);out('UCAST KO text',d.body.textContent.includes('팀 건영아잘하자')&&d.body.textContent.includes('U-CAST 우수 운영 멘토'));const en=await load('/projects/2026_U-CAST/index.html',1000,900,'en');out('UCAST EN text',en.body.textContent.includes('Team Geonyeongajalhaja')&&en.body.textContent.includes('U-CAST Outstanding Operations Mentor'))}
          async function testPlant(){const d=await load('/projects/PlantClock/index.html',1000,900),root=d.querySelector('[data-project-demo="plant"]');out('Plant tomatoes',root.querySelectorAll('.plant-tomato').length===3,`count=${root.querySelectorAll('.plant-tomato').length}`);const bs=[...root.querySelectorAll('button')],time=bs.find(b=>b.textContent.includes('+10')),water=bs.find(b=>b.textContent.includes('급수')),fan=bs.find(b=>b.textContent.includes('팬 레버'));time.click();time.click();time.click();out('Plant alert',root.querySelector('.plantclock-device').classList.contains('has-alert'));water.click();out('Plant watering',!root.querySelector('.plantclock-device').classList.contains('has-alert'));fan.click();out('Plant fan',root.querySelector('.plantclock-device').classList.contains('fan-on'))}
          async function testDoor(){const d=await load('/projects/Master_Creator_Challenge/index.html',1000,900),root=d.querySelector('[data-project-demo="doorlock"]'),rig=root.querySelector('.doorlock-rig'),door=root.querySelector('.doorlock-door'),s0=rect(door),keys=[...root.querySelectorAll('.doorlock-key')];for(const n of '123456')keys.find(b=>b.textContent===n).click();root.querySelector('.doorlock-input-action').click();await sleep(80);out('Door unlock',rig.classList.contains('is-unlocked'));const s1=rect(door);out('Door size stable',Math.abs(s0.height-s1.height)<1&&Math.abs(s0.width-s1.width)<1,`${s0.width.toFixed(0)}x${s0.height.toFixed(0)} -> ${s1.width.toFixed(0)}x${s1.height.toFixed(0)}`);root.querySelector('.doorlock-close-action').click();out('Door close',!rig.classList.contains('is-unlocked'));keys.find(b=>b.textContent==='1').click();keys.find(b=>b.textContent==='2').click();keys.find(b=>b.textContent==='<-').click();out('Door backspace',root.querySelector('.doorlock-lcd').textContent.includes('Password: 1'),root.querySelector('.doorlock-lcd').textContent.trim());keys.find(b=>b.textContent==='초기화').click();out('Door reset',root.querySelector('.doorlock-lcd').textContent.includes('Enter Password:'));const en=await load('/projects/Master_Creator_Challenge/index.html',1000,900,'en'),er=en.querySelector('[data-project-demo="doorlock"]');out('Door EN',er.textContent.includes('Reset')&&er.textContent.includes('Input')&&er.textContent.includes('Close / Lock'))}
          async function mobile(){for(const p of ['/projects/meal_queue_signal_counter/index.html','/projects/Wall_Sina/index.html','/projects/2026_U-CAST/index.html','/projects/PlantClock/index.html','/projects/Master_Creator_Challenge/index.html','/projects/koreatechGongjiAgent/index.html']){const d=await load(p,390,850);out(`390 overflow ${p}`,d.documentElement.scrollWidth<=d.documentElement.clientWidth+2,`${d.documentElement.scrollWidth}/${d.documentElement.clientWidth}`)}}
          (async()=>{try{await testHome();await testKGA();await videoStable('/projects/meal_queue_signal_counter/index.html','Meal');await videoStable('/projects/Wall_Sina/index.html','Wall');await testWall();await testUcast();await testPlant();await testDoor();await mobile()}catch(e){out('runner exception',false,e.stack||String(e))}const bad=results.filter(x=>!x.ok);logEl.textContent+=`\nDONE failures=${bad.length}`;document.body.dataset.done='1';document.body.dataset.failures=String(bad.length);document.title=bad.length?'QA_FAIL':'QA_PASS'})();
          </script>
          EOF

      - name: Run Chrome QA
        run: |
          python3 -m http.server 8000 >/tmp/qa253-http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'Chrome not found'; exit 1; }
          "$CHROME" --headless=new --no-sandbox --disable-gpu --autoplay-policy=no-user-gesture-required --host-resolver-rules="MAP * 0.0.0.0" --virtual-time-budget=55000 --window-size=1400,1000 --dump-dom http://127.0.0.1:8000/qa253-runner.html > /tmp/qa253-dom.txt
          cat /tmp/qa253-dom.txt
          grep -q 'data-done="1"' /tmp/qa253-dom.txt
          grep -q 'data-failures="0"' /tmp/qa253-dom.txt
