name: qa253-final-browser

on:
  pull_request:
    types: [synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa252-regression-fix
          fetch-depth: 0

      - name: Syntax and build checks
        run: |
          node --check assets/project-demos.js
          node --check detail.js
          node --check script.js
          node tools/verify-build.js
          cp index.html /tmp/index-before.html
          node build.js
          cmp -s index.html /tmp/index-before.html
          git diff --check

      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Run final Chromium QA
        run: |
          python3 -m http.server 8000 >/tmp/qa253-http.log 2>&1 &
          sleep 1
          cat > qa253.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-gpu','--autoplay-policy=no-user-gesture-required']});
          const base='http://127.0.0.1:8000',results=[];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const check=(name,ok,detail='')=>{results.push({name,ok,detail});console.log(`${ok?'PASS':'FAIL'} ${name}${detail?' :: '+detail:''}`)};
          async function open(path,w=1200,h=900,lang='ko'){
            const p=await browser.newPage(); await p.setViewport({width:w,height:h,deviceScaleFactor:1});
            await p.setRequestInterception(true); p.on('request',r=>{try{const u=new URL(r.url());(u.hostname==='127.0.0.1'||u.hostname==='localhost')?r.continue():r.abort()}catch{r.continue()}});
            await p.goto(base+'/index.html',{waitUntil:'domcontentloaded'}); await p.evaluate(l=>localStorage.setItem('lang',l),lang);
            await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:15000}); await sleep(350); return p;
          }
          async function home(){for(const w of [1200,390]){const p=await open('/index.html',w,850);const m=await p.evaluate(()=>{const c=document.querySelector('.hero-email-capybara')?.getBoundingClientRect(),b=document.querySelector('.hero-email')?.getBoundingClientRect(),t=document.querySelector('.hero-email .email-addr')?.getBoundingClientRect();if(!c||!b||!t)return null;return {c:[c.left,c.right,c.top,c.bottom],b:[b.left,b.right,b.top,b.bottom],t:[t.left,t.right,t.top,t.bottom],sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}});check(`HOME ${w} elements`,!!m);if(m){const [cl,cr,ct,cb]=m.c,[bl,br,bt,bb]=m.b,[tl,tr,tt,tb]=m.t;const overlap=!(cr<=tl||cl>=tr||cb<=tt||ct>=tb);check(`HOME ${w} attached`,cb>=bt-8&&ct<bb,JSON.stringify(m));check(`HOME ${w} text clear`,!overlap,JSON.stringify(m));check(`HOME ${w} overflow`,m.sw<=m.cw+2,`${m.sw}/${m.cw}`)}await p.close()}}
          async function kga(){const p=await open('/projects/koreatechGongjiAgent/index.html',1000,900);const m=await p.$eval('img[src*="web-shuttle-live.webp"]',async i=>{try{await i.decode()}catch{}return [i.complete,i.naturalWidth,i.naturalHeight]});check('KGA decode',m[0]&&m[1]>0,`${m[1]}x${m[2]}`);check('KGA portrait',m[2]>m[1],`${m[1]}x${m[2]}`);await p.close()}
          async function videos(path,label){const p=await open(path,1000,900);const count=await p.$$eval('video.detail-video',v=>v.length);check(`${label} videos exist`,count>0,String(count));for(let i=0;i<count;i++){const m=await p.evaluate(async i=>{const v=document.querySelectorAll('video.detail-video')[i],a=v.getBoundingClientRect(),fit=getComputedStyle(v).objectFit;await new Promise(res=>{if(v.readyState>=1)return res();let done=false;const f=()=>{if(!done){done=true;res()}};v.addEventListener('loadedmetadata',f,{once:true});v.addEventListener('error',f,{once:true});v.load();setTimeout(f,2500)});let played=false;try{await v.play();played=true;await new Promise(r=>setTimeout(r,250))}catch{}const b=v.getBoundingClientRect();v.pause();return {a:[a.width,a.height],b:[b.width,b.height],fit,played,vw:v.videoWidth,vh:v.videoHeight}},i);const d=Math.max(Math.abs(m.a[0]-m.b[0]),Math.abs(m.a[1]-m.b[1]));check(`${label} ${i+1} stable`,d<1.5,`${m.a.join('x')} -> ${m.b.join('x')} play=${m.played}`);check(`${label} ${i+1} no crop`,m.fit!=='cover',`fit=${m.fit} source=${m.vw}x${m.vh}`)}await p.close()}
          async function wall(){const p=await open('/projects/Wall_Sina/index.html',1000,900);await p.waitForSelector('[data-project-demo="wall"] button');const b=await p.$$('[data-project-demo="wall"] button');await b[0].click();await b[1].click();await sleep(150);let m=await p.evaluate(()=>{const r=document.querySelector('[data-project-demo="wall"]'),s=r.querySelector('.wall-water-sensor'),t=r.querySelector('.wall-tank');return {text:r.querySelector('.demo-live-status').textContent.trim(),bottom:parseFloat(getComputedStyle(s).bottom),h:t.getBoundingClientRect().height}});check('Wall status',m.text==='해수면 상승 감지',m.text);check('Wall threshold',m.bottom<m.h*.3+1,`${m.bottom}/${m.h}`);await sleep(1200);check('Wall early barrier',await p.$eval('.wall-rig',e=>e.classList.contains('barrier-raised')));await sleep(6200);m=await p.$eval('[data-project-demo="wall"] .demo-live-status',e=>e.textContent.trim());check('Wall cycle complete',m.includes('장벽 복귀 완료'),m);await p.close()}
          async function ucast(){const p=await open('/projects/2026_U-CAST/index.html',1000,900);await p.waitForSelector('[data-project-demo="ucast"] button');const bs=await p.$$('[data-project-demo="ucast"] button'),x=()=>p.$eval('[data-project-demo="ucast"] .ucast-channel .ucast-pedestrian',e=>e.getBoundingClientRect().left);const idle=await x();await bs[1].click();await sleep(80);const r0=await x();await sleep(450);const r1=await x();await sleep(520);const r2=await x();await sleep(450);const r3=await x();await sleep(500);const r4=await x();check('UCAST reverse starts right',r0>idle+80,`${idle},${r0}`);check('UCAST reverse continuous',r1<r0-10&&r2<r1-10&&r3<r2-10,`${r0},${r1},${r2},${r3}`);check('UCAST reverse reaches left',r4<r2-40,`${r2}->${r4}`);await sleep(500);await bs[0].click();await sleep(1100);const f0=await x();await sleep(500);const f1=await x();await sleep(300);const f2=await x();check('UCAST forward full exit',f1>f0+10&&f2>f1+5,`${f0},${f1},${f2}`);const ko=await p.evaluate(()=>document.body.innerText);check('UCAST KO content',ko.includes('팀 건영아잘하자')&&ko.includes('U-CAST 우수 운영 멘토'));await p.close();const en=await open('/projects/2026_U-CAST/index.html',1000,900,'en');const et=await en.evaluate(()=>document.body.innerText);check('UCAST EN content',et.includes('Team Geonyeongajalhaja')&&et.includes('U-CAST Outstanding Operations Mentor'));await en.close()}
          async function plant(){const p=await open('/projects/PlantClock/index.html',1000,900);await p.waitForSelector('[data-project-demo="plant"] button');check('Plant tomatoes 3',(await p.$$('[data-project-demo="plant"] .plant-tomato')).length===3);const bs=await p.$$('[data-project-demo="plant"] button');await bs[0].click();await bs[0].click();await bs[0].click();check('Plant alert 30m',await p.$eval('.plantclock-device',e=>e.classList.contains('has-alert')));await bs[1].click();check('Plant watering reset',!(await p.$eval('.plantclock-device',e=>e.classList.contains('has-alert'))));await bs[2].click();check('Plant fan',await p.$eval('.plantclock-device',e=>e.classList.contains('fan-on')));await p.close()}
          async function door(){const p=await open('/projects/Master_Creator_Challenge/index.html',1000,900);await p.waitForSelector('.doorlock-key');const s0=await p.$eval('.doorlock-door',e=>{const r=e.getBoundingClientRect();return [r.width,r.height]});for(const n of '123456')await p.evaluate(n=>[...document.querySelectorAll('.doorlock-key')].find(b=>b.textContent===n).click(),n);await p.click('.doorlock-input-action');await sleep(80);check('Door unlock 123456',await p.$eval('.doorlock-rig',e=>e.classList.contains('is-unlocked')));const s1=await p.$eval('.doorlock-door',e=>{const r=e.getBoundingClientRect();return [r.width,r.height]});check('Door size stable',Math.max(Math.abs(s0[0]-s1[0]),Math.abs(s0[1]-s1[1]))<1,`${s0}->${s1}`);await p.click('.doorlock-close-action');check('Door close',!(await p.$eval('.doorlock-rig',e=>e.classList.contains('is-unlocked'))));await p.evaluate(()=>{const k=[...document.querySelectorAll('.doorlock-key')];k.find(b=>b.textContent==='1').click();k.find(b=>b.textContent==='2').click();k.find(b=>b.textContent==='<-').click()});check('Door backspace',await p.$eval('.doorlock-lcd',e=>e.textContent.includes('Password: 1')));await p.evaluate(()=>[...document.querySelectorAll('.doorlock-key')].find(b=>b.textContent==='초기화').click());check('Door reset',await p.$eval('.doorlock-lcd',e=>e.textContent.includes('Enter Password:')));await p.close();const en=await open('/projects/Master_Creator_Challenge/index.html',1000,900,'en');const t=await en.$eval('[data-project-demo="doorlock"]',e=>e.innerText);check('Door EN controls',t.includes('Reset')&&t.includes('Input')&&t.includes('Close / Lock'));await en.close()}
          async function mobile(){for(const path of ['/projects/meal_queue_signal_counter/index.html','/projects/Wall_Sina/index.html','/projects/2026_U-CAST/index.html','/projects/PlantClock/index.html','/projects/Master_Creator_Challenge/index.html','/projects/koreatechGongjiAgent/index.html']){const p=await open(path,390,850);const m=await p.evaluate(()=>[document.documentElement.scrollWidth,document.documentElement.clientWidth]);check(`390 overflow ${path}`,m[0]<=m[1]+2,`${m[0]}/${m[1]}`);await p.close()}}
          try{await home();await kga();await videos('/projects/meal_queue_signal_counter/index.html','Meal');await videos('/projects/Wall_Sina/index.html','Wall');await wall();await ucast();await plant();await door();await mobile()}finally{await browser.close()}
          const bad=results.filter(x=>!x.ok);console.log(`TOTAL=${results.length} FAIL=${bad.length}`);if(bad.length){console.log(JSON.stringify(bad,null,2));process.exit(1)}
          EOF
          node qa253.mjs
