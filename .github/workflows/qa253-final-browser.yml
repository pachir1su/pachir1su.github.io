name: qa253-final-browser

on:
  pull_request:
    types: [synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa252-regression-fix
          fetch-depth: 0

      - name: Syntax and build checks
        run: |
          node --check assets/project-demos.js
          node --check detail.js
          node --check script.js
          node tools/verify-build.js
          cp index.html /tmp/index-before.html
          node build.js
          cmp -s index.html /tmp/index-before.html
          git diff --check

      - name: Install browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Run final Chromium QA
        run: |
          python3 -m http.server 8000 >/tmp/qa253-http.log 2>&1 &
          sleep 1
          cat > qa253.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-gpu', '--autoplay-policy=no-user-gesture-required']
          });
          const base = 'http://127.0.0.1:8000';
          const results = [];
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const check = (name, ok, detail = '') => {
            results.push({ name, ok, detail });
            console.log(`${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ' :: ' + detail : ''}`);
          };

          async function open(path, width = 1200, height = 900, lang = 'ko') {
            const page = await browser.newPage();
            await page.setViewport({ width, height, deviceScaleFactor: 1 });
            await page.setRequestInterception(true);
            page.on('request', (req) => {
              try {
                const url = new URL(req.url());
                if (url.hostname === '127.0.0.1' || url.hostname === 'localhost') req.continue();
                else req.abort();
              } catch {
                req.continue();
              }
            });
            await page.goto(base + '/index.html', { waitUntil: 'domcontentloaded' });
            await page.evaluate((next) => localStorage.setItem('lang', next), lang);
            await page.goto(base + path, { waitUntil: 'domcontentloaded', timeout: 15000 });
            await sleep(450);
            let actual = await page.evaluate(() => document.documentElement.lang);
            if (actual !== lang) {
              await page.evaluate((next) => localStorage.setItem('lang', next), lang);
              await page.reload({ waitUntil: 'domcontentloaded' });
              await sleep(450);
              actual = await page.evaluate(() => document.documentElement.lang);
            }
            check(`lang init ${path}=${lang}`, actual === lang, actual);
            return page;
          }

          async function switchEnglish(page, label) {
            const before = await page.evaluate(() => document.documentElement.lang);
            if (before !== 'en') {
              await page.click('#langToggle');
              await sleep(900);
            }
            const after = await page.evaluate(() => document.documentElement.lang);
            check(`${label} KO→EN`, after === 'en', `${before}->${after}`);
            return after === 'en';
          }

          async function testHome() {
            for (const width of [1200, 390]) {
              const page = await open('/index.html', width, 850, 'ko');
              const m = await page.evaluate(() => {
                const cap = document.querySelector('.hero-email-capybara')?.getBoundingClientRect();
                const btn = document.querySelector('.hero-email')?.getBoundingClientRect();
                const text = document.querySelector('.hero-email .email-addr')?.getBoundingClientRect();
                if (!cap || !btn || !text) return null;
                return {
                  c: [cap.left, cap.right, cap.top, cap.bottom],
                  b: [btn.left, btn.right, btn.top, btn.bottom],
                  t: [text.left, text.right, text.top, text.bottom],
                  sw: document.documentElement.scrollWidth,
                  cw: document.documentElement.clientWidth
                };
              });
              check(`HOME ${width} elements`, !!m);
              if (m) {
                const [cl, cr, ct, cb] = m.c;
                const [bl, br, bt, bb] = m.b;
                const [tl, tr, tt, tb] = m.t;
                const textOverlap = !(cr <= tl || cl >= tr || cb <= tt || ct >= tb);
                const buttonOverlap = !(cr <= bl || cl >= br || cb <= bt || ct >= bb);
                check(`HOME ${width} attached`, buttonOverlap, JSON.stringify(m));
                check(`HOME ${width} email text clear`, !textOverlap, JSON.stringify(m));
                check(`HOME ${width} no overflow`, m.sw <= m.cw + 2, `${m.sw}/${m.cw}`);
              }
              await page.close();
            }
          }

          async function testKGA() {
            const page = await open('/projects/koreatechGongjiAgent/index.html', 1000, 900);
            const m = await page.$eval('img[src*="web-shuttle-live.webp"]', async (img) => {
              try { await img.decode(); } catch {}
              return [img.complete, img.naturalWidth, img.naturalHeight, Number(img.getAttribute('width')), Number(img.getAttribute('height'))];
            });
            check('KGA shuttle decodes', m[0] && m[1] > 0, `${m[1]}x${m[2]}`);
            check('KGA shuttle portrait', m[2] > m[1], `${m[1]}x${m[2]}`);
            check('KGA metadata matches file', m[1] === m[3] && m[2] === m[4], `natural=${m[1]}x${m[2]} html=${m[3]}x${m[4]}`);
            await switchEnglish(page, 'KGA');
            await page.close();
          }

          async function testVideos(path, label) {
            const page = await open(path, 1000, 900);
            const count = await page.$$eval('video.detail-video', (videos) => videos.length);
            check(`${label} videos exist`, count > 0, String(count));
            for (let i = 0; i < count; i += 1) {
              const m = await page.evaluate(async (index) => {
                const v = document.querySelectorAll('video.detail-video')[index];
                const before = v.getBoundingClientRect();
                const fit = getComputedStyle(v).objectFit;
                await new Promise((resolve) => {
                  if (v.readyState >= 1) return resolve();
                  let done = false;
                  const finish = () => { if (!done) { done = true; resolve(); } };
                  v.addEventListener('loadedmetadata', finish, { once: true });
                  v.addEventListener('error', finish, { once: true });
                  v.load();
                  setTimeout(finish, 2500);
                });
                let played = false;
                try { await v.play(); played = true; await new Promise((r) => setTimeout(r, 250)); } catch {}
                const after = v.getBoundingClientRect();
                v.pause();
                return {
                  before: [before.width, before.height], after: [after.width, after.height],
                  fit, played, video: [v.videoWidth, v.videoHeight]
                };
              }, i);
              const delta = Math.max(Math.abs(m.before[0] - m.after[0]), Math.abs(m.before[1] - m.after[1]));
              check(`${label} ${i + 1} play size stable`, delta < 1.5, `${m.before.join('x')} -> ${m.after.join('x')} played=${m.played}`);
              check(`${label} ${i + 1} no crop`, m.fit !== 'cover', `fit=${m.fit} source=${m.video.join('x')}`);
            }
            await switchEnglish(page, label);
            await page.close();
          }

          async function testWallDemo() {
            const page = await open('/projects/Wall_Sina/index.html', 1000, 900);
            await page.waitForSelector('[data-project-demo="wall"] button');
            const initialButtons = await page.$$eval('[data-project-demo="wall"] button', (bs) => bs.map((b) => [b.textContent.trim(), b.disabled]));
            check('Wall controls present', initialButtons.some(([t]) => t === '시스템 켜기') && initialButtons.some(([t]) => t === '해수면 상승 감지'), JSON.stringify(initialButtons));
            await page.evaluate(() => [...document.querySelectorAll('[data-project-demo="wall"] button')].find((b) => b.textContent.trim() === '시스템 켜기').click());
            await sleep(120);
            const powered = await page.evaluate(() => {
              const root = document.querySelector('[data-project-demo="wall"]');
              const detect = [...root.querySelectorAll('button')].find((b) => b.textContent.trim() === '해수면 상승 감지');
              return { on: root.querySelector('.wall-rig').classList.contains('is-powered'), detectDisabled: detect.disabled, status: root.querySelector('.demo-live-status').textContent.trim() };
            });
            check('Wall powers on', powered.on && !powered.detectDisabled, JSON.stringify(powered));
            await page.evaluate(() => [...document.querySelectorAll('[data-project-demo="wall"] button')].find((b) => b.textContent.trim() === '해수면 상승 감지').click());
            await sleep(150);
            let m = await page.evaluate(() => {
              const root = document.querySelector('[data-project-demo="wall"]');
              const sensor = root.querySelector('.wall-water-sensor');
              const tank = root.querySelector('.wall-tank');
              return {
                text: root.querySelector('.demo-live-status').textContent.trim(),
                bottom: parseFloat(getComputedStyle(sensor).bottom),
                height: tank.getBoundingClientRect().height
              };
            });
            check('Wall status exact', m.text === '해수면 상승 감지', m.text);
            check('Wall threshold lowered', m.bottom < m.height * 0.3 + 1, `${m.bottom}/${m.height}`);
            await sleep(1200);
            check('Wall barrier rises before fill ends', await page.$eval('.wall-rig', (e) => e.classList.contains('barrier-raised')));
            await sleep(6200);
            m = await page.$eval('[data-project-demo="wall"] .demo-live-status', (e) => e.textContent.trim());
            check('Wall cycle completes', m.includes('장벽 복귀 완료'), m);
            await page.close();
          }

          async function testUCAST() {
            const page = await open('/projects/2026_U-CAST/index.html', 1000, 900);
            await page.waitForSelector('[data-project-demo="ucast"] button');
            const x = () => page.$eval('[data-project-demo="ucast"] .ucast-channel .ucast-pedestrian', (e) => e.getBoundingClientRect().left);
            const idle = await x();
            await page.evaluate(() => [...document.querySelectorAll('[data-project-demo="ucast"] button')].find((b) => b.textContent.trim() === 'CH-1 역방향').click());
            await sleep(80); const r0 = await x();
            await sleep(420); const r1 = await x();
            await sleep(480); const r2 = await x();
            await sleep(420); const r3 = await x();
            await sleep(580); const r4 = await x();
            check('U-CAST reverse starts at right', r0 > idle + 80, `${idle},${r0}`);
            check('U-CAST reverse moves continuously right→left', r0 > r1 + 5 && r1 > r2 + 5 && r2 > r3 + 5 && r3 > r4 + 5, `${r0},${r1},${r2},${r3},${r4}`);
            check('U-CAST reverse reaches left', Math.abs(r4 - idle) < 10, `${idle}->${r4}`);

            await sleep(350);
            await page.evaluate(() => [...document.querySelectorAll('[data-project-demo="ucast"] button')].find((b) => b.textContent.trim() === 'CH-1 정방향').click());
            await sleep(80); const f0 = await x();
            await sleep(420); const f1 = await x();
            await sleep(480); const f2 = await x();
            await sleep(420); const f3 = await x();
            await sleep(580); const f4 = await x();
            check('U-CAST forward moves continuously left→right', f0 < f1 - 5 && f1 < f2 - 5 && f2 < f3 - 5 && f3 < f4 - 5, `${f0},${f1},${f2},${f3},${f4}`);
            check('U-CAST forward reaches right', f4 > idle + 100, `${idle}->${f4}`);
            const ko = await page.evaluate(() => document.body.innerText);
            check('U-CAST KO content', ko.includes('팀 건영아잘하자') && ko.includes('U-CAST 우수 운영 멘토'));
            const english = await switchEnglish(page, 'U-CAST');
            await sleep(300);
            const en = await page.evaluate(() => ({ lang: document.documentElement.lang, text: document.body.innerText, team: document.querySelector('[data-ko="팀 건영아잘하자"]')?.textContent.trim() || '' }));
            check('U-CAST EN content', english && en.lang === 'en' && en.team === 'Team Geonyeongajalhaja' && en.text.includes('U-CAST Outstanding Operations Mentor'), JSON.stringify({ lang: en.lang, team: en.team }));
            await page.close();
          }

          async function testPlantClock() {
            const page = await open('/projects/PlantClock/index.html', 1000, 900);
            await page.waitForSelector('[data-project-demo="plant"] button');
            const tomatoes = await page.$$eval('[data-project-demo="plant"] .plant-tomato', (els) => els.map((e) => { const r = e.getBoundingClientRect(); return [r.width, r.height]; }));
            check('PlantClock has 3 visible tomatoes', tomatoes.length === 3 && tomatoes.every(([w, h]) => w > 8 && h > 8), JSON.stringify(tomatoes));
            const buttons = await page.$$('[data-project-demo="plant"] button');
            await buttons[0].click(); await buttons[0].click(); await buttons[0].click();
            check('PlantClock 30m alert', await page.$eval('.plantclock-device', (e) => e.classList.contains('has-alert')));
            await buttons[1].click();
            check('PlantClock watering clears alert', !(await page.$eval('.plantclock-device', (e) => e.classList.contains('has-alert'))));
            await buttons[2].click();
            check('PlantClock fan toggles', await page.$eval('.plantclock-device', (e) => e.classList.contains('fan-on')));
            await switchEnglish(page, 'PlantClock');
            await page.close();
          }

          async function testDoorlock() {
            const page = await open('/projects/Master_Creator_Challenge/index.html', 1000, 900);
            await page.waitForSelector('.doorlock-key');
            const initial = await page.$eval('.doorlock-door', (e) => { const r = e.getBoundingClientRect(); return [r.width, r.height]; });
            await page.evaluate(() => {
              const keys = [...document.querySelectorAll('.doorlock-key')];
              for (const n of '123456') keys.find((b) => b.textContent.trim() === n).click();
            });
            const entered = await page.$eval('.doorlock-lcd', (e) => e.textContent.trim());
            check('Doorlock entered 123456', entered.includes('Password: 123456'), entered);
            await page.evaluate(() => document.querySelector('.doorlock-input-action').click());
            await sleep(80);
            const unlocked = await page.$eval('.doorlock-rig', (e) => e.classList.contains('is-unlocked'));
            check('Doorlock 123456 opens', unlocked, await page.$eval('.demo-live-status', (e) => e.textContent.trim()));
            const opened = await page.$eval('.doorlock-door', (e) => { const r = e.getBoundingClientRect(); return [r.width, r.height]; });
            check('Doorlock box size stable', Math.max(Math.abs(initial[0] - opened[0]), Math.abs(initial[1] - opened[1])) < 1, `${initial}->${opened}`);
            await page.evaluate(() => document.querySelector('.doorlock-close-action').click());
            check('Doorlock closes', !(await page.$eval('.doorlock-rig', (e) => e.classList.contains('is-unlocked'))));
            await page.evaluate(() => {
              const keys = [...document.querySelectorAll('.doorlock-key')];
              keys.find((b) => b.textContent.trim() === '1').click();
              keys.find((b) => b.textContent.trim() === '2').click();
              keys.find((b) => b.textContent.trim() === '<-').click();
            });
            check('Doorlock backspace', await page.$eval('.doorlock-lcd', (e) => e.textContent.includes('Password: 1')));
            await page.evaluate(() => [...document.querySelectorAll('.doorlock-key')].find((b) => b.textContent.trim() === '초기화').click());
            check('Doorlock reset', await page.$eval('.doorlock-lcd', (e) => e.textContent.includes('Enter Password:')));
            const english = await switchEnglish(page, 'Doorlock');
            await sleep(300);
            const en = await page.evaluate(() => ({ lang: document.documentElement.lang, text: document.querySelector('[data-project-demo="doorlock"]')?.innerText || '' }));
            check('Doorlock EN controls', english && en.lang === 'en' && en.text.includes('Reset') && en.text.includes('Input') && en.text.includes('Close / Lock'), JSON.stringify({ lang: en.lang, excerpt: en.text.slice(0, 160) }));
            await page.close();
          }

          async function testMobileOverflow() {
            for (const path of [
              '/projects/meal_queue_signal_counter/index.html',
              '/projects/Wall_Sina/index.html',
              '/projects/2026_U-CAST/index.html',
              '/projects/PlantClock/index.html',
              '/projects/Master_Creator_Challenge/index.html',
              '/projects/koreatechGongjiAgent/index.html'
            ]) {
              const page = await open(path, 390, 850);
              const m = await page.evaluate(() => [document.documentElement.scrollWidth, document.documentElement.clientWidth]);
              check(`390px no overflow ${path}`, m[0] <= m[1] + 2, `${m[0]}/${m[1]}`);
              await page.close();
            }
          }

          try {
            await testHome();
            await testKGA();
            await testVideos('/projects/meal_queue_signal_counter/index.html', 'Meal');
            await testVideos('/projects/Wall_Sina/index.html', 'Wall');
            await testWallDemo();
            await testUCAST();
            await testPlantClock();
            await testDoorlock();
            await testMobileOverflow();
          } finally {
            await browser.close();
          }

          const failures = results.filter((x) => !x.ok);
          console.log(`TOTAL=${results.length} FAIL=${failures.length}`);
          if (failures.length) {
            console.log(JSON.stringify(failures, null, 2));
            process.exit(1);
          }
          EOF
          node qa253.mjs
