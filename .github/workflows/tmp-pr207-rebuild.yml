name: TEMP v2 regression media repair

on:
  push:
    branches:
      - tmp/pr207-rebuild-runner

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/tmp/pr207-rebuild-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v2-regression-media-fix
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "ChatGPT Runner"
          git config user.email "actions@users.noreply.github.com"

      - name: Add external YouTube links to project SSOT
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('projects.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          videos = {
              '데일리 리포트 AI': 'https://youtu.be/4xF9-N9jKvc',
              'MultiMind': 'https://youtu.be/CyX0PryfrRI',
              '산불 조기 감지 알림 시스템': 'https://www.youtube.com/watch?v=z0q6D7zNWyw',
          }
          found = set()
          for group in data['groups']:
              for card in group['cards']:
                  title = card.get('title')
                  ko = title if isinstance(title, str) else title.get('ko')
                  if ko not in videos:
                      continue
                  found.add(ko)
                  links = card.setdefault('links', [])
                  if not any('youtu' in link.get('href', '') for link in links):
                      links.append({
                          'href': videos[ko],
                          'title': 'YouTube',
                          'icon': 'fab fa-youtube',
                      })
          if found != set(videos):
              raise SystemExit(f'missing project cards: {set(videos) - found}')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add projects.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "feat: 프로젝트 카드에 실제 YouTube 링크 추가"
          git push origin HEAD:chatgpt/v2-regression-media-fix

      - name: Regenerate root project cards
        run: |
          node build.js
          grep -q 'https://youtu.be/4xF9-N9jKvc' index.html
          grep -q 'https://youtu.be/CyX0PryfrRI' index.html
          grep -q 'https://www.youtube.com/watch?v=z0q6D7zNWyw' index.html
          test "$(grep -o 'fab fa-youtube' index.html | wc -l)" -eq 3
          git add index.html
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "build: YouTube 외부 링크를 프로젝트 카드에 반영"
          git push origin HEAD:chatgpt/v2-regression-media-fix

      - name: Static regression checks
        run: |
          node --check script.js
          node --check detail.js
          node --check assets/project-demos.js
          node tools/verify-build.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('projects.json').read_text(encoding='utf-8'))
          cards = [card for group in data['groups'] for card in group['cards']]
          assert len(cards) == 31, len(cards)
          discontinued = next(group for group in data['groups'] if group['kind'] == 'discontinued')
          wip = next(group for group in data['groups'] if group['kind'] == 'wip')
          assert len(discontinued['cards']) == 6
          assert len(wip['cards']) == 1
          assert (wip['cards'][0]['title'].get('ko') if isinstance(wip['cards'][0]['title'], dict) else wip['cards'][0]['title']) == '한맵 (Koreatech Map)'
          print('31 cards / 1 WIP / 6 discontinued / YouTube links OK')
          PY
