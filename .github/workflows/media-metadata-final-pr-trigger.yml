name: Temporary PR trigger for final media audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: media-metadata-final-pr-trigger
  cancel-in-progress: true

jobs:
  sanitize-and-verify:
    if: github.event.pull_request.head.ref == 'chatgpt/media-metadata-final-trigger' && github.repository == 'pachir1su/pachir1su.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl ffmpeg

      - name: Prepare invariant probe
        shell: bash
        run: |
          cat > /tmp/media_probe.py <<'PY'
          from pathlib import Path
          import json, subprocess, sys

          root = Path('.')
          image_exts = {'.jpg', '.jpeg', '.png', '.webp', '.gif'}
          video_exts = {'.mp4', '.mov', '.m4v', '.3gp', '.webm', '.mkv', '.avi'}

          def run(cmd):
              p = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if p.returncode:
                  raise SystemExit(f"command failed ({p.returncode}): {' '.join(cmd)}\n{p.stderr.decode(errors='replace')}")
              return p.stdout

          def files():
              return sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and 'node_modules' not in p.parts and p.suffix.lower() in image_exts | video_exts)

          def fingerprint(p):
              rel = p.as_posix()
              if p.suffix.lower() in image_exts:
                  probe = json.loads(run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,pix_fmt','-of','json',rel]))
                  frame = run(['ffmpeg','-v','error','-i',rel,'-map','0:v:0','-f','framemd5','-']).decode()
                  return {'kind':'image','probe':probe,'decodedFrameMd5':frame}
              probe = json.loads(run(['ffprobe','-v','error','-show_entries','stream=index,codec_name,codec_type,width,height,sample_rate,channels,duration','-of','json',rel]))
              stream = run(['ffmpeg','-v','error','-i',rel,'-map','0','-c','copy','-f','streamhash','-hash','sha256','-']).decode()
              return {'kind':'video','probe':probe,'streamHash':stream}

          media = files()
          result = {'fingerprints': {p.as_posix(): fingerprint(p) for p in media}, 'pngChunks': {}, 'videoMetadata': {}}
          sig = b'\x89PNG\r\n\x1a\n'
          for p in media:
              rel = p.as_posix()
              if p.suffix.lower() == '.png':
                  data = p.read_bytes(); pos = 8; chunks = []
                  if not data.startswith(sig): raise SystemExit(f'invalid PNG: {rel}')
                  while pos + 12 <= len(data):
                      n = int.from_bytes(data[pos:pos+4], 'big'); typ = data[pos+4:pos+8].decode('ascii', errors='replace')
                      chunks.append(typ); pos += 12 + n
                      if typ == 'IEND': break
                  result['pngChunks'][rel] = chunks
              elif p.suffix.lower() in video_exts:
                  result['videoMetadata'][rel] = json.loads(run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',rel]))
          Path(sys.argv[1]).write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Audit, sanitize, and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          node tools/verify-media-metadata.js > evidence/media-before.json
          printf '%s\n' "$?" > evidence/media-before-exit.txt
          set -e
          python3 /tmp/media_probe.py evidence/media-probe-before.json
          python3 tools/sanitize-media-metadata.py --report evidence/media-sanitize-report.json
          node tools/verify-media-metadata.js > evidence/media-after.json
          python3 /tmp/media_probe.py evidence/media-probe-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('evidence/media-probe-before.json').read_text())['fingerprints']
          after=json.loads(Path('evidence/media-probe-after.json').read_text())['fingerprints']
          if before != after:
              bad=sorted(k for k in set(before)|set(after) if before.get(k)!=after.get(k))
              raise SystemExit('decoded/stream invariant changed: ' + ', '.join(bad))
          report=json.loads(Path('evidence/media-sanitize-report.json').read_text())
          if report['after'].get('offenders') != 0:
              raise SystemExit('metadata offenders remain')
          print('changed:', report.get('changed', []))
          print('final offenders: 0')
          PY
          node --check tools/verify-media-metadata.js
          python3 -m py_compile tools/sanitize-media-metadata.py
          node tools/verify-build.js
          node build.js
          git diff --check

      - name: Push sanitized media branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY' > /tmp/changed.txt
          import json
          from pathlib import Path
          for p in json.loads(Path('evidence/media-sanitize-report.json').read_text()).get('changed', []): print(p)
          PY
          git switch -C chatgpt/media-metadata-final
          if [[ -s /tmp/changed.txt ]]; then
            while IFS= read -r f; do git add -- "$f"; done < /tmp/changed.txt
            git commit -m 'chore: strip public media metadata'
          fi
          git push --force origin HEAD:refs/heads/chatgpt/media-metadata-final

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-metadata-final-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
