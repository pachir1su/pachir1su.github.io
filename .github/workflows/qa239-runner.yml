name: QA 239 live Pages verification

on:
  pull_request:
    paths:
      - '.github/workflows/qa239-runner.yml'

permissions:
  contents: read

jobs:
  live-pages:
    if: github.event.pull_request.head.ref == 'chatgpt/qa239-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for merged Pages assets
        shell: bash
        run: |
          set -euo pipefail
          marker='Theme — follows OS setting only (#240)'
          for i in $(seq 1 60); do
            url="https://pachir1su.github.io/script.js?qa=$(date +%s)-$i"
            if curl -fsSL --retry 2 "$url" | grep -Fq "$marker"; then
              echo "Live script.js contains #240 marker."
              exit 0
            fi
            echo "Waiting for Pages deployment ($i/60)..."
            sleep 5
          done
          echo 'Timed out waiting for GitHub Pages deployment.' >&2
          exit 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-pages-qa
          cd /tmp/live-pages-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/live-pages-qa
          cat > live.mjs <<'JS'
          import { chromium } from 'playwright';

          const base = 'https://pachir1su.github.io';
          const stamp = () => `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          const browser = await chromium.launch();
          const context = await browser.newContext({ colorScheme: 'dark' });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          await page.goto(`${base}/?qa=${stamp()}`, { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForFunction(() => document.documentElement.dataset.theme === 'dark');
          assert(await page.locator('#themeToggle, #themeToggleMobile').count() === 0, 'manual theme buttons still exist on home');
          console.log('PASS live home dark system theme + no manual buttons');

          await page.emulateMedia({ colorScheme: 'light' });
          await page.waitForFunction(() => document.documentElement.dataset.theme === 'light');
          await page.emulateMedia({ colorScheme: 'dark' });
          await page.waitForFunction(() => document.documentElement.dataset.theme === 'dark');
          console.log('PASS live home runtime system theme changes');

          await page.goto(`${base}/projects/PlantClock/?qa=${stamp()}`, { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForFunction(() => document.documentElement.dataset.theme === 'dark');
          assert(await page.locator('#themeToggle, #themeToggleMobile').count() === 0, 'manual theme buttons still exist on detail page');
          await page.emulateMedia({ colorScheme: 'light' });
          await page.waitForFunction(() => document.documentElement.dataset.theme === 'light');
          console.log('PASS live detail page system theme');

          await page.goto(`${base}/projects/meal_queue_signal_counter/?qa=${stamp()}`, { waitUntil: 'networkidle', timeout: 60000 });
          const venue = page.locator('img[src="assets/images/festival-venue.webp"]');
          await venue.waitFor({ state: 'visible' });
          const venueInfo = await venue.evaluate(img => ({
            naturalWidth: img.naturalWidth,
            naturalHeight: img.naturalHeight,
            figureClass: img.closest('figure')?.className || ''
          }));
          assert(venueInfo.naturalWidth === 892 && venueInfo.naturalHeight === 1400, `unexpected live venue dimensions: ${venueInfo.naturalWidth}x${venueInfo.naturalHeight}`);
          assert(!venueInfo.figureClass.includes('media-crop-right'), `double-crop class still deployed: ${venueInfo.figureClass}`);
          console.log('PASS live cafeteria privacy crop without double crop');

          await page.goto(`${base}/projects/Legend_SakSak_GongGam_AI/?qa=${stamp()}`, { waitUntil: 'networkidle', timeout: 60000 });
          for (const name of ['empathy-chat.webp', 'recipe-dark.webp', 'recipe-light.webp']) {
            const image = page.locator(`img[src="assets/images/${name}"]`);
            await image.waitFor({ state: 'attached' });
            const loaded = await image.evaluate(img => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
            assert(loaded, `${name} did not load on live Pages`);
          }
          console.log('PASS live GongGam / Recipe screenshots');

          assert(pageErrors.length === 0, `page errors: ${pageErrors.join(' | ')}`);
          console.log('passed=5');
          console.log('failed=0');
          await browser.close();
          JS
          node live.mjs
