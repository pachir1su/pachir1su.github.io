name: QA 239 implementation runner

on:
  pull_request:
    paths:
      - '.github/workflows/qa239-runner.yml'
      - '.github/scripts/qa239_browser.mjs'

permissions:
  contents: write

jobs:
  final-review-fix:
    if: github.event.pull_request.head.ref == 'chatgpt/qa239-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Checkout target implementation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/qa239-fixes-theme240
          path: target
          fetch-depth: 0

      - name: Remove duplicate CSS crop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('target/projects/meal_queue_signal_counter/index.html')
          css = Path('target/style.css')

          text = page.read_text(encoding='utf-8')
          text = text.replace('<figure class="detail-figure media-crop-right">', '<figure class="detail-figure">', 1)
          if 'media-crop-right' in text:
              raise SystemExit('meal page still contains media-crop-right')
          page.write_text(text, encoding='utf-8')

          styles = css.read_text(encoding='utf-8')
          styles = styles.replace('.detail-figure.media-crop-right { overflow: hidden; }\n.detail-figure.media-crop-right img { width: 124%; max-width: none; }\n', '')
          if 'media-crop-right' in styles:
              raise SystemExit('style.css still contains media-crop-right')
          css.write_text(styles, encoding='utf-8')
          PY

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          cd target
          node --check build.js
          node --check script.js
          node --check detail.js
          node --check assets/project-demos.js
          node tools/verify-build.js
          node tools/verify-media-metadata.js
          ! grep -R "media-crop-right" projects/meal_queue_signal_counter/index.html style.css

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa239-browser
          cd /tmp/qa239-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        shell: bash
        run: |
          cd target
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/qa239-http.log 2>&1 &
          echo $! >/tmp/qa239-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/qa239-http.log
          exit 1

      - name: Browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          cp runner/.github/scripts/qa239_browser.mjs /tmp/qa239-browser/qa239_browser.mjs
          cd /tmp/qa239-browser
          node qa239_browser.mjs
          cp -R qa-artifacts/* "$GITHUB_WORKSPACE/qa-artifacts/"

      - name: Commit and push review fix
        shell: bash
        run: |
          set -euo pipefail
          git -C target config user.name 'ChatGPT'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C target add style.css projects/meal_queue_signal_counter/index.html
          if ! git -C target diff --cached --quiet; then
            git -C target commit -m 'fix: avoid double cropping cafeteria venue photo'
            git -C target push origin HEAD:chatgpt/qa239-fixes-theme240
          fi

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa239-final-review
          path: qa-artifacts
          if-no-files-found: warn
