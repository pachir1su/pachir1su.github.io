name: QA 239 implementation runner

on:
  pull_request:
    paths:
      - '.github/workflows/qa239-runner.yml'

permissions:
  contents: read

jobs:
  crop-preview:
    if: github.event.pull_request.head.ref == 'chatgpt/qa239-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target implementation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/qa239-fixes-theme240
          path: target

      - name: Build crop candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('target/projects/meal_queue_signal_counter/assets/images/festival-venue.webp')
          out = Path('crop-preview')
          out.mkdir(exist_ok=True)
          im = Image.open(src).convert('RGB')
          im.save(out / 'original.webp', 'WEBP', quality=92)
          for keep in (0.85, 0.80, 0.75):
              crop = im.crop((0, 0, round(im.width * keep), im.height))
              crop.save(out / f'keep-{int(keep*100)}.webp', 'WEBP', quality=92)
          print('source', im.size)
          PY

      - name: Upload crop candidates
        uses: actions/upload-artifact@v4
        with:
          name: qa239-cafeteria-crop-preview
          path: crop-preview
