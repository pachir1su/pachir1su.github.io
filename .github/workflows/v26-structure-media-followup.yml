name: v2.6 structure media follow-up runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v26-structure-media-followup.yml
      - tools/v26_structure_media_followup.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26-structure-media-runner
          fetch-depth: 0

      - name: Preserve runner and switch to target branch
        shell: bash
        run: |
          set -euo pipefail
          cp tools/v26_structure_media_followup.py /tmp/v26_structure_media_followup.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/v26_structure_media_followup.py')
          s = p.read_text()
          s = s.replace(
              "    rels = [str(Path(p)) for p in paths]\n    run(['git', 'add', '-A', '--', *rels])",
              "    rels = [str(Path(p).relative_to(ROOT)) if Path(p).is_absolute() else str(Path(p)) for p in paths]\n    existing_rels = [rel for rel in rels if (ROOT / rel).exists()]\n    if existing_rels:\n        run(['git', 'add', '-A', '--', *existing_rels])",
          )
          p.write_text(s)
          PY
          python3 -m py_compile /tmp/v26_structure_media_followup.py
          git fetch origin agent/v26-structure-media-followup
          git switch -C agent/v26-structure-media-followup origin/agent/v26-structure-media-followup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet selenium flask python-dotenv google-generativeai
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Implement issues and remaining automatable media
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 /tmp/v26_structure_media_followup.py
