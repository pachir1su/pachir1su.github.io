name: qa249-source-restructure

on:
  push:
    branches:
      - chatgpt/qa249-final-acceptance
    paths:
      - .github/workflows/qa249-source-restructure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa249-final-acceptance
          fetch-depth: 0
      - name: Move #249 fixes to their source files
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          # 1) detail.js: remove project-specific runtime monkey patches.
          path = Path('detail.js')
          s = read(path)
          marker1 = '  /* #249 final acceptance — static page normalization before language/reveal init. */\n'
          next1 = "  if ($('.detail-photo-grid') && !$('#detail-photo-grid-style')) {"
          if marker1 not in s or next1 not in s:
              raise SystemExit('detail.js first #249 block markers not found')
          a = s.index(marker1)
          b = s.index(next1, a)
          s = s[:a] + s[b:]
          marker2 = '  /* #249 final acceptance — run after project-demos.js has built its controls. */\n'
          next2 = "  addEventListener('keydown', (event) => { if (event.key === 'Escape') closeMobile(); });"
          if marker2 not in s or next2 not in s:
              raise SystemExit('detail.js second #249 block markers not found')
          a = s.index(marker2)
          b = s.index(next2, a)
          s = s[:a] + s[b:]
          write(path, s)

          # 2) KGA: remove '실운영' / 'Live' from the actual media section source.
          path = Path('projects/koreatechGongjiAgent/index.html')
          s = read(path)
          start_marker = '<div class="detail-section" data-media-followup="v27-kga-audit">'
          start = s.index(start_marker)
          end = s.find('<div class="detail-section"', start + len(start_marker))
          if end == -1:
              raise SystemExit('KGA media section end not found')
          section = s[start:end]
          section = section.replace('실운영 ', '').replace('Live ', '')
          s = s[:start] + section + s[end:]
          write(path, s)

          # 3) Healthcare: use the same gallery classes as the other detail pages in source.
          path = Path('projects/HEALTH_CHECK_PROJECT/index.html')
          s = read(path)
          if s.count('detail-photo-grid') != 1 or s.count('detail-photo-card') != 5:
              raise SystemExit('Healthcare gallery shape changed unexpectedly')
          s = s.replace('detail-photo-grid', 'detail-gallery')
          s = s.replace('detail-photo-card', 'detail-figure')
          write(path, s)

          # 4) Wildfire: persist the requested first-two-media order in HTML.
          path = Path('projects/nonofire/index.html')
          s = read(path)
          section_start = s.index('<div class="detail-section" data-aos="fade-up" data-aos-delay="75" data-media-followup="v27-user">')
          gallery_start = s.index('<div class="detail-gallery detail-gallery-uniform">', section_start)
          gallery_end = s.index('</div>', gallery_start)
          gallery = s[gallery_start:gallery_end]
          figures = re.findall(r'\s*<figure class="detail-figure">.*?</figure>', gallery, flags=re.S)
          if len(figures) != 3:
              raise SystemExit(f'Wildfire expected 3 figures, got {len(figures)}')
          swapped = gallery.replace(figures[0] + figures[1], figures[1] + figures[0], 1)
          s = s[:gallery_start] + swapped + s[gallery_end:]
          write(path, s)

          # 5) Project demo behavior belongs in assets/project-demos.js.
          path = Path('assets/project-demos.js')
          s = read(path)

          s = replace_once(
              s,
              """      setText(status, '해수면 상승 감지 · 왼쪽 수위 상승 중', 'Rising sea detected · water level increasing on the left');\n      await wait(1450);""",
              """      setText(status, '해수면 상승 감지 · 낮춘 위험 역치로 접근 중', 'Rising sea detected · approaching the lowered danger threshold');\n      await wait(900);""",
              'Wall_Sina threshold timing'
          )

          s = replace_once(
              s,
              """    plant.innerHTML = '<span class="plant-stem"></span><span class="plant-leaf plant-leaf-left"></span><span class="plant-leaf plant-leaf-right"></span>';""",
              """    plant.innerHTML = '<span class="plant-stem"></span><span class="plant-leaf plant-leaf-left"></span><span class="plant-leaf plant-leaf-right"></span>';\n    plant.append(create('span', 'plant-tomato plant-tomato-a'), create('span', 'plant-tomato plant-tomato-b'));""",
              'PlantClock tomato DOM'
          )
          s = replace_once(
              s,
              """    fanRotor.textContent = '✣';""",
              """    fanRotor.textContent = '';\n    fanRotor.setAttribute('aria-hidden', 'true');""",
              'PlantClock fan rotor'
          )

          old_red = """      const steps = [10, 5, 0];\n      for (const remaining of steps) {\n        if (runId !== currentRun) return;\n        setText(status, `20명 도달 · 빨간불 · ${remaining}초 남음`, `20 reached · red light · ${remaining}s remaining`);\n        await wait(650);\n      }"""
          new_red = """      setText(status, '20명 도달 · 빨간불 · 실기 기준 약 10초 대기', '20 reached · red light · about 10s on hardware');\n      await wait(1950);"""
          s = replace_once(s, old_red, new_red, 'meal counter compressed wait wording')

          old_door_controls = """    const status = createStatus('비밀번호를 입력하세요.', 'Enter the password.');\n    controls.append(controlTitle, keypad, status);"""
          new_door_controls = """    const status = createStatus('비밀번호를 입력하세요.', 'Enter the password.');\n    const closeButton = createButton('닫힘', 'Close / Lock', 'demo-action demo-action-secondary doorlock-close-action');\n    controls.append(controlTitle, keypad, closeButton, status);"""
          s = replace_once(s, old_door_controls, new_door_controls, 'doorlock explicit close control')

          s = replace_once(
              s,
              """      button.textContent = key;""",
              """      button.textContent = key === '*' ? translate('초기화', 'Reset') : key === '#' ? translate('입력', 'Input') : key;\n      button.setAttribute('aria-label', key === '*' ? translate('입력 초기화', 'Reset input') : key === '#' ? translate('비밀번호 입력', 'Submit password') : key);""",
              'doorlock keypad labels'
          )
          s = replace_once(
              s,
              """        if (key === 'C' && !locked) { lock(); return; }\n        input += key;\n        render('키 입력 · #으로 확인', 'Key entered · press # to confirm');""",
              """        input += key;\n        render('키 입력 · 입력 버튼으로 확인', 'Key entered · press Input to confirm');""",
              'doorlock C behavior'
          )
          s = replace_once(
              s,
              """    });\n    render();\n  }\n\n\n  const demos = {""",
              """    });\n    closeButton.addEventListener('click', () => {\n      if (locked) {\n        setText(status, '이미 잠긴 상태입니다.', 'The door is already locked.');\n        return;\n      }\n      lock();\n    });\n    render();\n  }\n\n\n  const demos = {""",
              'doorlock close handler'
          )
          write(path, s)

          # 6) CSS/UI changes live in style.css, not injected by detail.js.
          path = Path('style.css')
          s = read(path)
          marker = '/* #249 final acceptance — source-level fixes */'
          if marker in s:
              raise SystemExit('style #249 source block already exists')
          block = r'''

/* #249 final acceptance — source-level fixes */
.detail-video {
  width: 100%;
  height: auto !important;
  aspect-ratio: auto !important;
  object-fit: contain !important;
}

/* Wall_Sina: lower the visible threshold and let the water rise slowly enough to read the response. */
.wall-water-sensor { bottom: 22% !important; }
.wall-water-level { transition: height 2.8s ease !important; }

/* U-CAST: reverse starts at the right sensor and completes at the left sensor. */
.ucast-channel.is-reverse.is-entering .ucast-pedestrian {
  left: calc(100% - 88px) !important;
  transition: none !important;
}
.ucast-channel.is-reverse.is-exiting .ucast-pedestrian {
  left: 76px !important;
  transition: left .68s linear !important;
}

/* PlantClock: readable FND, compact tomato plant anchored at the pot, and a physical fan rotor. */
.plantclock-fnd { min-height: 78px; align-content: center; }
.plantclock-fnd small { color: #f3f3f3 !important; font-size: .68rem !important; opacity: 1 !important; }
.plantclock-fnd strong { color: #ff725f !important; font-size: clamp(1rem, 2.2vw, 1.3rem) !important; }
.plant-stem { left: 52px !important; bottom: 90px !important; height: 55px !important; width: 6px !important; }
.plant-leaf { bottom: 112px !important; width: 38px !important; height: 20px !important; }
.plant-leaf-left { left: 17px !important; transform: rotate(18deg) !important; }
.plant-leaf-right { right: 17px !important; transform: scaleX(-1) rotate(18deg) !important; }
.plant-tomato {
  position: absolute;
  z-index: 3;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #d94737;
  border: 2px solid #9d2b25;
  box-shadow: inset -2px -2px 0 rgba(0,0,0,.12);
}
.plant-tomato::before {
  content: "";
  position: absolute;
  left: 4px;
  top: -5px;
  width: 6px;
  height: 6px;
  background: #39743b;
  clip-path: polygon(50% 0,65% 34%,100% 28%,72% 53%,84% 88%,50% 67%,16% 88%,28% 53%,0 28%,35% 34%);
}
.plant-tomato-a { left: 31px; top: 5px; }
.plant-tomato-b { right: 29px; top: 21px; width: 15px; height: 15px; }
.plant-fan-rotor {
  font-size: 0 !important;
  overflow: hidden;
  border: 3px solid #555 !important;
  background: conic-gradient(#777 0 10%,#d7d4c9 10% 25%,#777 25% 35%,#d7d4c9 35% 50%,#777 50% 60%,#d7d4c9 60% 75%,#777 75% 85%,#d7d4c9 85% 100%) !important;
  box-shadow: inset 0 0 0 5px #bbb;
}
.plantclock-device.fan-on .plant-fan-rotor { animation: fan-spin 1.05s linear infinite !important; }

.doorlock-close-action { margin-top: 2px; }

@media (max-width: 640px) {
  .plant-stem { left: 36px !important; bottom: 72px !important; height: 45px !important; }
  .plant-leaf { bottom: 91px !important; width: 30px !important; height: 18px !important; }
  .plant-leaf-left { left: 12px !important; }
  .plant-leaf-right { right: 12px !important; }
  .plant-tomato-a { left: 21px; top: 5px; width: 14px; height: 14px; }
  .plant-tomato-b { right: 20px; top: 18px; width: 13px; height: 13px; }
}
@media (max-width: 390px) {
  .ucast-channel.is-reverse.is-exiting .ucast-pedestrian { left: 59px !important; }
}
@media (prefers-reduced-motion: reduce) {
  .plantclock-device.fan-on .plant-fan-rotor { animation: none !important; }
}
'''
          s = s.rstrip() + block + '\n'
          write(path, s)

      - name: Validate source-level rewrite
        shell: bash
        run: |
          set -euo pipefail
          node --check detail.js
          node --check assets/project-demos.js
          node tools/verify-build.js
          node build.js
          git diff --exit-code -- index.html
          git diff --check
          git diff --exit-code origin/main -- detail.js
          ! grep -q '초 남음' assets/project-demos.js
          grep -q "실기 기준 약 10초 대기" assets/project-demos.js
          grep -q "낮춘 위험 역치" assets/project-demos.js
          grep -q "plant-tomato" assets/project-demos.js
          grep -q "Close / Lock" assets/project-demos.js
          grep -q 'wall-water-sensor { bottom: 22%' style.css
          ! grep -q 'detail-photo-grid' projects/HEALTH_CHECK_PROJECT/index.html
          ! grep -q 'detail-photo-card' projects/HEALTH_CHECK_PROJECT/index.html
          ! sed -n '/data-media-followup="v27-kga-audit"/,/<div class="detail-section"/p' projects/koreatechGongjiAgent/index.html | grep -q '실운영 '
      - name: Commit source-level fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add detail.js style.css assets/project-demos.js projects/koreatechGongjiAgent/index.html projects/HEALTH_CHECK_PROJECT/index.html projects/nonofire/index.html
          git commit -m 'refactor: persist #249 fixes in project source'
          git push origin HEAD:chatgpt/qa249-final-acceptance
