name: KGA live shuttle capture

on:
  pull_request:
    paths:
      - '.github/workflows/kga-live-shuttle-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'chatgpt/kga-live-shuttle-capture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          mkdir -p /tmp/kga-capture
          cd /tmp/kga-capture
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture live shuttle
        shell: bash
        run: |
          cd /tmp/kga-capture
          cat > capture.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const url = 'https://que-tune-earnings-ahead.trycloudflare.com/web#/home';
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 1050 }, colorScheme: 'dark' });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(7000);
            const bodyHome = await page.locator('body').innerText();
            await page.screenshot({ path: 'home-live.png', fullPage: true });

            let clicked = false;
            const exact = page.getByText('셔틀', { exact: true });
            const count = await exact.count();
            for (let i = 0; i < count; i++) {
              const el = exact.nth(i);
              if (!(await el.isVisible().catch(() => false))) continue;
              try {
                await el.click({ timeout: 3000 });
                clicked = true;
                break;
              } catch {}
            }
            if (clicked) await page.waitForTimeout(4000);
            await page.screenshot({ path: 'shuttle-live.png', fullPage: true });
            const bodyShuttle = await page.locator('body').innerText();
            fs.writeFileSync('report.txt', [
              `url=${page.url()}`,
              `clickedShuttle=${clicked}`,
              `homeHasShuttle=${bodyHome.includes('셔틀')}`,
              `shuttleHasOperation=${/운행|잔여|좌석|출발|도착/.test(bodyShuttle)}`,
              `pageErrors=${errors.length}`,
              '',
              bodyShuttle.slice(0, 5000)
            ].join('\n'));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node capture.cjs
          mkdir -p "$GITHUB_WORKSPACE/kga-capture"
          cp home-live.png shuttle-live.png report.txt "$GITHUB_WORKSPACE/kga-capture/"
      - uses: actions/upload-artifact@v4
        with:
          name: kga-live-shuttle-capture
          path: kga-capture
