name: v2.6 freshman guide media repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v26-freshman-guide-quality.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26-structure-media-runner
          fetch-depth: 0

      - name: Switch to target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/v26-structure-media-followup
          git switch -C agent/v26-structure-media-followup origin/agent/v26-structure-media-followup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture public Notion with Korean font
        shell: bash
        run: |
          set -euo pipefail
          font_dir="$HOME/.local/share/fonts"
          mkdir -p "$font_dir"
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf \
            -o "$font_dir/NotoSansCJKkr-Regular.otf"
          fc-cache -f "$font_dir" >/dev/null
          fc-match 'Noto Sans CJK KR'
          python3 -m pip install --quiet selenium pillow
          python3 - <<'PY'
          from pathlib import Path
          import shutil, time
          from PIL import Image
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin=shutil.which('chromedriver') or shutil.which('chromium-driver')
          opts=Options(); opts.binary_location=chrome; opts.page_load_strategy='eager'
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars','--ignore-certificate-errors','--window-size=1440,1000','--lang=ko-KR']:
              opts.add_argument(arg)
          d=webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(),options=opts)
          d.set_window_size(1440,1000)
          d.set_page_load_timeout(45)
          url='https://capybaracute.notion.site/2026-2fca8de5ee5f806db9e9e64464a9ac78'
          try:
              d.get(url)
          except TimeoutException:
              pass
          deadline=time.time()+35
          while time.time()<deadline:
              if '2026' in d.page_source and d.execute_script('return document.body && document.body.innerText.length > 100'):
                  break
              time.sleep(1)
          else:
              raise SystemExit('public freshman guide did not load usable content')
          d.execute_script('''
            const s=document.createElement('style');
            s.textContent='html,body,body *{font-family:"Noto Sans CJK KR",sans-serif !important;}';
            document.head.appendChild(s);
          ''')
          if not d.execute_script('return document.fonts.check("16px \\\"Noto Sans CJK KR\\\"")'):
              raise SystemExit('Noto Sans CJK KR not available to Chrome')
          time.sleep(4)
          png=Path('/tmp/freshman-guide.png')
          d.save_screenshot(str(png)); d.quit()
          if png.stat().st_size<40000:
              raise SystemExit(f'guide screenshot unexpectedly small: {png.stat().st_size}')
          out=Path('/tmp/notion-guide.webp')
          with Image.open(png) as im:
              im=im.convert('RGB'); im.save(out,'WEBP',quality=84,method=6)
          print('CAPTURED', out, out.stat().st_size, flush=True)
          PY

      - name: Rebase captured media onto latest target, validate and push
        shell: bash
        run: |
          set -euo pipefail
          target=agent/v26-structure-media-followup
          git fetch origin "$target" main
          git reset --hard "origin/$target"
          mkdir -p projects/koreatech_noob_guide/assets/images
          cp /tmp/notion-guide.webp projects/koreatech_noob_guide/assets/images/notion-guide.webp
          git add -- projects/koreatech_noob_guide/assets/images/notion-guide.webp
          git commit -m "feat: refresh freshman guide screenshot"
          node --check script.js
          node build.js
          test -z "$(git status --porcelain index.html)"
          node tools/verify-build.js
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"
          git push origin HEAD:"$target"
