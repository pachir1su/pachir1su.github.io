name: v3 prototype integration apply

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v3-nebula-qa-fixes-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration target
        uses: actions/checkout@v4
        with:
          ref: agent/v3-prototype-integration
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard integration head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "361b6cb20d0cb6242f92ecc65ab5089c0eeb5121"
          test -f docs/v3-constellation-prototypes/assets/gateway/torn-portal-diagonal-v1.png
          test -f docs/v3-constellation-prototypes/assets/gateway/torn-portal-trail-v1.png
          test -f docs/v3-constellation-prototypes/assets/gateway/torn-portal-wide-v1.png

      - name: Integrate visual assets audio and handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          # Gateway HTML: Canvas remains the living sky; PNG is only the torn-paper material/frame.
          p = Path('docs/v3-constellation-prototypes/nebula-gateway.html')
          s = p.read_text(encoding='utf-8')
          s = once(s,
          '''          <button class="gate" type="button" data-gate aria-label="별자리 — 우주로 들어가기">\n            <canvas aria-hidden="true"></canvas>\n          </button>''',
          '''          <button class="gate" type="button" data-gate aria-label="별자리 — 우주로 들어가기">\n            <canvas aria-hidden="true"></canvas>\n            <img class="gate-art" data-gate-art alt="" decoding="async">\n          </button>''', 'gateway art markup')
          s = once(s,
          '''        <div class="note"><b>새로고침마다 조금 다릅니다</b><span>지표 아래의 안전 슬롯은 그대로 유지하되, 찢김의 폭·윤곽·미세한 기울기·정렬만 제한된 범위에서 바뀝니다. 기존 Hero 내용 위로 침범하지 않습니다.</span></div>''',
          '''        <div class="note"><b>새로고침마다 조금 다릅니다</b><span>지표 아래 안전 슬롯은 유지하면서 실제 찢긴 종이 자산 3종, 폭·비율·미세한 기울기·정렬이 제한된 범위에서 바뀝니다. PNG는 종이 섬유와 말린 가장자리만 맡고, 구멍 안의 별과 별자리 움직임은 Canvas가 계속 렌더합니다.</span></div>''', 'gateway integration note')
          p.write_text(s, encoding='utf-8', newline='\n')

          # CSS: clip only the live Canvas. The paper frame is intentionally not clipped so fibres and leaked light survive.
          p = Path('docs/v3-constellation-prototypes/nebula.css')
          s = p.read_text(encoding='utf-8')
          s = once(s,
          '''  cursor:pointer; isolation:isolate;\n  clip-path:var(--tear-clip, polygon(3% 8%,18% 3%,34% 6%,51% 2%,69% 5%,84% 3%,97% 9%,96% 31%,99% 51%,96% 72%,97% 92%,82% 97%,65% 94%,49% 98%,31% 95%,14% 98%,3% 91%,5% 70%,2% 50%,5% 29%));\n  transform:rotate(var(--gate-rot,0deg));''',
          '''  cursor:pointer; isolation:isolate; overflow:visible;\n  transform:rotate(var(--gate-rot,0deg));''', 'gateway parent clip')
          s = once(s,
          '''.gate canvas { display:block; width:100%; height:100%; }''',
          '''.gate canvas {\n  position:relative; z-index:0; display:block; width:100%; height:100%;\n  clip-path:var(--tear-clip, polygon(3% 8%,18% 3%,34% 6%,51% 2%,69% 5%,84% 3%,97% 9%,96% 31%,99% 51%,96% 72%,97% 92%,82% 97%,65% 94%,49% 98%,31% 95%,14% 98%,3% 91%,5% 70%,2% 50%,5% 29%));\n}\n.gate-art {\n  position:absolute; z-index:2; inset:-8%; width:116%; height:116%; object-fit:contain;\n  pointer-events:none; opacity:.86; transform:scale(var(--gate-art-scale,1));\n  filter:drop-shadow(0 9px 10px rgba(36,31,24,.16));\n  transition:filter .45s ease, transform .5s cubic-bezier(.2,.8,.2,1);\n}\n.gate:hover .gate-art, .gate:focus-visible .gate-art {\n  filter:drop-shadow(0 12px 13px rgba(36,31,24,.21)) saturate(1.04);\n  transform:scale(calc(var(--gate-art-scale,1) * 1.012));\n}''', 'gateway art css')
          s = once(s,
          '''  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.24), inset 0 2px 11px rgba(0,0,0,.38);''',
          '''  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;\n  clip-path:var(--tear-clip, polygon(3% 8%,18% 3%,34% 6%,51% 2%,69% 5%,84% 3%,97% 9%,96% 31%,99% 51%,96% 72%,97% 92%,82% 97%,65% 94%,49% 98%,31% 95%,14% 98%,3% 91%,5% 70%,2% 50%,5% 29%));\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.20), inset 0 2px 9px rgba(0,0,0,.34);''', 'gateway inset layer')
          s = once(s,
          '''@media (prefers-reduced-motion: reduce) {\n  .gate { transition:none; }''',
          '''@media (prefers-reduced-motion: reduce) {\n  .gate, .gate-art { transition:none; }''', 'gateway art reduced')
          p.write_text(s, encoding='utf-8', newline='\n')

          # JS: approved sound choices only, actual torn material variants, no autoplay.
          p = Path('docs/v3-constellation-prototypes/nebula.js')
          s = p.read_text(encoding='utf-8')
          s = once(s,
          '''  const prefersReduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n''',
          '''  const prefersReduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  /* #114에서 최종 판정이 끝난 세 동작만 런타임에 연결한다. 사용자 입력 뒤에만 생성한다. */\n  const APPROVED_SFX = {\n    year: 'assets/audio/sfx-04-year-a-wood.wav',\n    select: 'assets/audio/sfx-05-select-a-bell.wav',\n    enter: 'assets/audio/sfx-06-enter-b-three-notes.wav',\n  };\n  const activeSfx = new Map();\n  function playApprovedSfx(cue) {\n    const source = APPROVED_SFX[cue];\n    if (!source) return;\n    const previous = activeSfx.get(cue);\n    if (previous) { previous.pause(); previous.currentTime = 0; }\n    const audio = new Audio(source);\n    audio.preload = 'auto';\n    audio.volume = cue === 'year' ? .48 : .58;\n    activeSfx.set(cue, audio);\n    audio.addEventListener('ended', () => { if (activeSfx.get(cue) === audio) activeSfx.delete(cue); }, { once:true });\n    audio.play().catch(() => { if (activeSfx.get(cue) === audio) activeSfx.delete(cue); });\n  }\n''', 'approved audio helper')
          s = once(s,
          '''      hit.addEventListener('click', () => {\n        if (state.open === body && item.detail) { window.location.href = base + item.detail; return; }\n        toggle(body);\n      });''',
          '''      hit.addEventListener('click', () => {\n        if (state.open === body && item.detail) {\n          playApprovedSfx('enter');\n          window.setTimeout(() => { window.location.href = base + item.detail; }, 140);\n          return;\n        }\n        playApprovedSfx('select');\n        toggle(body);\n      });''', 'project audio')
          s = once(s,
          '''        btn.addEventListener('click', () => {\n          state.year = i;''',
          '''        btn.addEventListener('click', () => {\n          if (state.year !== i) playApprovedSfx('year');\n          state.year = i;''', 'year audio')
          s = once(s,
          '''    const gate = document.querySelector('[data-gate]');\n    const canvas = gate && gate.querySelector('canvas');\n    const wrap = gate && gate.closest('[data-gate-wrap]');\n    const mote = wrap && wrap.querySelector('[data-gate-mote]');\n    if (!gate || !canvas || !wrap) return;''',
          '''    const gate = document.querySelector('[data-gate]');\n    const canvas = gate && gate.querySelector('canvas');\n    const art = gate && gate.querySelector('[data-gate-art]');\n    const wrap = gate && gate.closest('[data-gate-wrap]');\n    const mote = wrap && wrap.querySelector('[data-gate-mote]');\n    if (!gate || !canvas || !art || !wrap) return;''', 'gateway art query')
          s = once(s,
          '''    const mobile = window.matchMedia('(max-width:768px)').matches;\n    const slotWidth = mobile ? 170 : 220;''',
          '''    const variants = [\n      { src:'assets/gateway/torn-portal-wide-v1.png', scale:1.00 },\n      { src:'assets/gateway/torn-portal-trail-v1.png', scale:1.03 },\n      { src:'assets/gateway/torn-portal-diagonal-v1.png', scale:1.02 },\n    ];\n    const variant = variants[Math.floor(random() * variants.length)];\n    art.src = variant.src;\n    art.dataset.variant = variant.src.split('/').pop();\n    art.style.setProperty('--gate-art-scale', String(variant.scale));\n\n    const mobile = window.matchMedia('(max-width:768px)').matches;\n    const slotWidth = mobile ? 170 : 220;''', 'gateway art variant')
          s = once(s,
          '''    gate.addEventListener('click', () => {\n      const box = gate.getBoundingClientRect();\n      veil.style.setProperty('--gx', `${box.left + box.width / 2}px`);''',
          '''    gate.addEventListener('click', () => {\n      const box = gate.getBoundingClientRect();\n      playApprovedSfx('enter');\n      veil.style.setProperty('--gx', `${box.left + box.width / 2}px`);''', 'gateway enter audio')
          p.write_text(s, encoding='utf-8', newline='\n')

          # Asset decision log: turn old capture findings into historical findings and record the integrated baseline.
          p = Path('docs/v3-constellation-prototypes/nebula-assets.md')
          s = p.read_text(encoding='utf-8')
          anchor = '관련: 이슈 #114, PR #168\n\n---\n'
          block = '''관련: 이슈 #114, PR #168\n\n## 0. 2026-08-21 통합 baseline\n\n- #174의 독립 정적/Chromium QA 수정과 #177의 모바일 관측 패널·안전 범위 랜덤 Gateway를 기준으로 삼는다.\n- #171의 실제 찢긴 종이 PNG 3종을 **재질 프레임**으로 채택한다. Canvas 우주는 그대로 유지해 정적인 이미지로 퇴행하지 않는다.\n- 새로고침마다 PNG 자산·폭·비율·미세 기울기·정렬이 바뀌지만 Hero의 안전 슬롯을 벗어나지 않는다.\n- 런타임 사운드는 판정이 끝난 `SFX-04 A`(연도), `SFX-05 A`(별 선택), `SFX-06 B`(상세/우주 진입)만 연결한다. 나머지는 견본 상태를 유지한다.\n- 모바일은 별 옆 설명 대신 하단 관측 패널을 사용하고, 키보드·reduced-motion·44px hit target·`← PORTFOLIO` 복귀 경로를 유지한다.\n- 아래의 “캡처에서 드러난 것”은 #168 당시의 **역사적 결함 기록**이다. 현재 통합본의 QA 결과는 별도 검증 결과를 우선한다.\n\n---\n'''
          s = once(s, anchor, block, 'asset integration block')
          p.write_text(s, encoding='utf-8', newline='\n')

          # Design doc: keep old exploration as history, but put the current architecture/handoff at the top for Codex.
          p = Path('docs/design-concept-v3.md')
          s = p.read_text(encoding='utf-8')
          anchor = '- 상태: **계획 문서**. 이 문서만으로는 사이트가 바뀌지 않는다.\n\n---\n'
          block = '''- 상태: **계획 문서**. 이 문서만으로는 사이트가 바뀌지 않는다.\n\n> [!IMPORTANT]\n> **2026-08-21 현재 기준** — 아래 초반의 “v3 미착수”와 후보 비교는 의사결정 이력이다.\n> 현재 제품 방향은 **v2 노트/정보 구조를 유지하고, 홈의 작은 찢김 Gateway를 통해 별도의 우주 공간으로 진입**하는 구조로 확정됐다.\n\n### 현재 v3 구현 계약 / Codex handoff\n\n- v2는 교체하지 않는다. 운영 Home/Projects/Skills/Awards/Vision의 정보 전달 역할을 유지한다.\n- 우주는 별도 탐험 공간이다. 연도별 프로젝트, 성장 별자리, 궤도를 잃은 별, 조건형 이스터에그를 담당한다.\n- Gateway는 기존 Hero 문구를 바꾸지 않고 최소 삽입한다. 새로고침마다 자연스럽게 변하되 기존 텍스트·버튼을 가리지 않는다.\n- `projects.json`은 프로젝트 데이터 SSOT다. 운영 제품에서 JS에 프로젝트 데이터를 이중 관리하지 않는다.\n- 상태 은유의 현재 기준은 완료=일반 별/별자리, 진행 예정·개발 중=원시성 계열, 실패=초신성 잔해, 지연=궤도 이탈이다. 초기 문서의 갈색왜성 매핑은 채택 전 탐색 기록이다.\n- 모바일은 데스크톱 축소본이 아니다. 별 선택 정보는 하단 관측 패널처럼 별 지도와 겹치지 않는 별도 읽기 흐름을 쓴다.\n- 키보드·터치·`prefers-reduced-motion`·44px hit target·우주→v2 복귀 경로를 필수 계약으로 둔다.\n- 런타임 사운드는 현재 확정된 SFX-04 A / SFX-05 A / SFX-06 B만 연결한다. 자동재생은 금지한다.\n- #59 성장 별자리, #119 이스터에그, #159 시뮬레이션, #16 성능, #137 배너를 v3.0.0 준비 범위에서 단계적으로 합친다. #173 은하수형 연도 메뉴와 #170 정리는 v3.0.0 이후 범위다.\n- #124는 저장소 소유자가 직접 수정하는 범위이므로 에이전트가 변경하지 않는다.\n\n---\n'''
          s = once(s, anchor, block, 'design current-state block')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Static and regression validation
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/v3-constellation-prototypes/nebula.js
          node --check build.js
          node --check script.js
          node tools/verify-build.js
          git diff --check
          grep -q 'torn-portal-wide-v1.png' docs/v3-constellation-prototypes/nebula.js
          grep -q 'sfx-04-year-a-wood.wav' docs/v3-constellation-prototypes/nebula.js
          grep -q '2026-08-21 현재 기준' docs/design-concept-v3.md

      - name: Commit each changed file atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit_one() {
            local file="$1" msg="$2"
            git add -- "$file"
            git diff --cached --quiet && return 0
            test "$(git diff --cached --name-only | wc -l)" -eq 1
            git commit -m "$msg"
          }
          commit_one docs/v3-constellation-prototypes/nebula-gateway.html 'feat: integrate torn gateway material layer'
          commit_one docs/v3-constellation-prototypes/nebula.css 'feat: layer torn gateway assets over live sky'
          commit_one docs/v3-constellation-prototypes/nebula.js 'feat: integrate approved nebula audio and tear variants'
          commit_one docs/v3-constellation-prototypes/nebula-assets.md 'docs: record integrated nebula baseline'
          commit_one docs/design-concept-v3.md 'docs: sync v3 architecture and codex handoff'
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/v3-prototype-integration
