name: v2.6 KGA live media refresh

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26-structure-media-runner
          fetch-depth: 0

      - name: Capture deployed KGA shuttle and update target
        shell: bash
        run: |
          set -euo pipefail
          target='agent/v26-structure-media-followup'
          live='https://herbal-miscellaneous-phrases-environmental.trycloudflare.com/web#/shuttle'

          git fetch origin main "$target"
          old_target=$(git rev-parse "origin/$target")
          git switch -C "$target" "origin/$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          font_dir="$HOME/.local/share/fonts"
          mkdir -p "$font_dir"
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf \
            -o "$font_dir/NotoSansCJKkr-Regular.otf"
          fc-cache -f "$font_dir" >/dev/null
          python3 -m pip install --quiet selenium pillow

          LIVE_URL="$live" python3 - <<'PY'
          import os, shutil, time
          from pathlib import Path
          from PIL import Image
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          url = os.environ['LIVE_URL']
          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin = shutil.which('chromedriver') or shutil.which('chromium-driver')
          if not chrome:
              raise SystemExit('Chrome/Chromium unavailable')

          opts = Options()
          opts.binary_location = chrome
          opts.page_load_strategy = 'eager'
          for arg in [
              '--headless=new', '--no-sandbox', '--disable-dev-shm-usage',
              '--hide-scrollbars', '--ignore-certificate-errors',
              '--window-size=1440,1100', '--lang=ko-KR', '--force-device-scale-factor=1'
          ]:
              opts.add_argument(arg)

          d = webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(), options=opts)
          d.set_window_size(1440, 1100)
          d.set_page_load_timeout(45)
          try:
              d.get(url)
          except TimeoutException:
              pass

          deadline = time.time() + 40
          text = ''
          while time.time() < deadline:
              try:
                  text = d.execute_script('return document.body ? document.body.innerText : ""') or ''
                  ready = d.execute_script('return document.readyState') in ('interactive', 'complete')
                  if ready and len(text.strip()) > 250 and any(k in text for k in ('셔틀', 'Shuttle', '노선', '시간표')):
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit(f'KGA shuttle did not become usable: {text[:600]!r}')

          time.sleep(8)
          text = d.execute_script('return document.body ? document.body.innerText : ""') or ''
          lower = text.lower()
          if any(x in lower for x in ('bad gateway', 'cloudflare tunnel error', 'application error', 'internal server error')):
              raise SystemExit(f'KGA shuttle rendered an error page: {text[:600]!r}')

          png = Path('/tmp/web-shuttle.png')
          if not d.save_screenshot(str(png)) or png.stat().st_size < 60000:
              raise SystemExit('KGA shuttle screenshot unexpectedly small')
          d.quit()

          out = Path('/tmp/web-shuttle.webp')
          with Image.open(png) as im:
              im = im.convert('RGB')
              im.save(out, 'WEBP', quality=84, method=6)
          print('CAPTURED', out.stat().st_size, text[:400].replace('\n', ' | '), flush=True)
          PY

          mkdir -p projects/koreatechGongjiAgent/assets/images
          cp /tmp/web-shuttle.webp projects/koreatechGongjiAgent/assets/images/web-shuttle.webp
          git add -- projects/koreatechGongjiAgent/assets/images/web-shuttle.webp
          git commit -m 'feat: add deployed KGA shuttle media'

          base=$(git merge-base origin/main HEAD)
          index_commit=$(git rev-list "$base"..HEAD -- projects/koreatechGongjiAgent/index.html | tail -1)
          test -n "$index_commit"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/koreatechGongjiAgent/index.html')
          s = p.read_text(encoding='utf-8')
          if 'assets/images/web-shuttle.webp' not in s:
              needle = '''                <figure class="detail-figure">\n                  <img src="assets/images/web-admin.webp" width="1440" height="1100" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 관리자 일정 관리 화면" />\n                  <figcaption data-en="Admin schedule management" data-ko="관리자 일정 관리">관리자 일정 관리</figcaption>\n                </figure>'''
              shuttle = '''                <figure class="detail-figure">\n                  <img src="assets/images/web-shuttle.webp" width="1440" height="1100" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 실운영 셔틀 조회 화면" />\n                  <figcaption data-en="Live shuttle dashboard" data-ko="실운영 셔틀 조회 화면">실운영 셔틀 조회 화면</figcaption>\n                </figure>\n'''
              if needle not in s:
                  raise SystemExit('KGA gallery insertion anchor not found')
              p.write_text(s.replace(needle, shuttle + needle, 1), encoding='utf-8')
          PY
          git add -- projects/koreatechGongjiAgent/index.html
          git commit --fixup="$index_commit"
          GIT_SEQUENCE_EDITOR=: git rebase -i --autosquash "$base"

          set +e
          GIT_EDITOR=true git rebase origin/main
          rc=$?
          set -e
          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicts" ]; then
              set +e
              GIT_EDITOR=true git rebase --continue
              rc=$?
              set -e
              continue
            fi
            while IFS= read -r f; do
              case "$f" in
                docs/v3-constellation-prototypes/index.html|docs/v3-constellation-prototypes/home-a-story.html|docs/v3-constellation-prototypes/home-b-atlas.html|docs/v3-constellation-prototypes/wall-sina.html)
                  git checkout --ours -- "$f"
                  FILE="$f" python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ['FILE'])
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<link\s+rel=["\']icon["\'][^>]*>\s*', '\n', s, flags=re.I)
          line = '  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />\n'
          if '/assets/favicon.svg' not in s:
              m = re.search(r'(^\s*<title>.*?</title>\s*\n)', s, flags=re.M)
              if not m:
                  m = re.search(r'(^\s*<meta\s+name="color-scheme"[^>]*>\s*\n)', s, flags=re.M)
              if not m:
                  raise SystemExit(f'cannot place favicon in {p}')
              s = s[:m.end()] + line + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
                  git add -- "$f"
                  ;;
                *)
                  echo "Unexpected rebase conflict: $f" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
            set +e
            GIT_EDITOR=true git rebase --continue
            rc=$?
            set -e
          done
          test "$rc" -eq 0

          FILE='docs/v3-constellation-prototypes/home-c-celestial.html' python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ['FILE'])
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<link\s+rel=["\']icon["\'][^>]*>\s*', '\n', s, flags=re.I)
          line = '  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />\n'
          if '/assets/favicon.svg' not in s:
              m = re.search(r'(^\s*<title>.*?</title>\s*\n)', s, flags=re.M)
              if not m:
                  raise SystemExit(f'cannot place favicon in {p}')
              s = s[:m.end()] + line + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
          git add -- docs/v3-constellation-prototypes/home-c-celestial.html
          git commit -m 'fix: use shared favicon in docs/v3-constellation-prototypes/home-c-celestial.html'

          node --check script.js
          node build.js
          test -z "$(git status --porcelain index.html)"
          node tools/verify-build.js
          git diff --check origin/main...HEAD
          test -s projects/koreatechGongjiAgent/assets/images/web-shuttle.webp
          grep -q 'assets/images/web-shuttle.webp' projects/koreatechGongjiAgent/index.html

          records=$(git diff --name-status -M origin/main...HEAD | wc -l)
          commits=$(git rev-list --count origin/main..HEAD)
          echo "ATOMIC records=$records commits=$commits"
          test "$records" -eq "$commits"
          test "$records" -eq 94

          while read -r sha; do
            test "$(git diff-tree --no-commit-id --name-status -r -M "$sha^" "$sha" | wc -l)" -eq 1
          done < <(git rev-list --reverse origin/main..HEAD)

          test -z "$(git status --porcelain)"
          git push --force-with-lease="refs/heads/$target:$old_target" origin HEAD:"$target"

      - name: Upload KGA shuttle capture
        uses: actions/upload-artifact@v4
        with:
          name: kga-live-shuttle
          path: projects/koreatechGongjiAgent/assets/images/web-shuttle.webp
          retention-days: 2
