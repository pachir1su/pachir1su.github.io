name: portfolio release candidate integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build-and-qa:
    if: github.head_ref == 'agent/v2-media-demos-performance-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          ref: agent/v2-media-demos-performance-runner
          path: runner
          fetch-depth: 1

      - name: Checkout clean main snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: final
          fetch-depth: 80
          token: ${{ github.token }}

      - name: Checkout verified v2 snapshot
        uses: actions/checkout@v4
        with:
          ref: agent/v2-media-demos-performance
          path: v2
          fetch-depth: 80

      - name: Checkout latest v3 production direction
        uses: actions/checkout@v4
        with:
          ref: Codex/fix-nebula-regressions-11
          path: v3
          fetch-depth: 80

      - name: Verify expected bases
        shell: bash
        run: |
          set -euo pipefail
          BASE="4791c0b828b6382f26b74af7ca121e41e23904ec"
          test "$(git -C final rev-parse HEAD)" = "$BASE"
          test "$(git -C v2 merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C v3 merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C v2 diff --name-only "$BASE"...HEAD | wc -l)" -eq 35
          test "$(git -C v3 diff --name-only "$BASE"...HEAD | wc -l)" -eq 9

      - name: Compose v2 and v3 snapshots without history stacking
        shell: bash
        run: |
          set -euo pipefail
          BASE="4791c0b828b6382f26b74af7ca121e41e23904ec"
          git -C v2 diff --name-only "$BASE"...HEAD > /tmp/v2-files
          while IFS= read -r f; do
            mkdir -p "final/$(dirname "$f")"
            cp -a "v2/$f" "final/$f"
          done < /tmp/v2-files

          git -C v3 diff --name-only "$BASE"...HEAD > /tmp/v3-files
          while IFS= read -r f; do
            case "$f" in
              index.html|script.js|style.css) continue ;;
            esac
            mkdir -p "final/$(dirname "$f")"
            cp -a "v3/$f" "final/$f"
          done < /tmp/v3-files

          for f in index.html script.js style.css; do
            git -C final show "$BASE:$f" > "/tmp/base-${f}"
            set +e
            git merge-file -p "v2/$f" "/tmp/base-${f}" "v3/$f" > "final/$f.merged"
            rc=$?
            set -e
            test "$rc" -eq 0
            mv "final/$f.merged" "final/$f"
          done
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' final/index.html final/script.js final/style.css

      - name: Apply return-state, performance, and accessibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 runner/tools/release-candidate-patch.py
          git -C final diff --check
          node --check final/script.js
          node --check final/detail.js
          node --check final/assets/project-demos.js
          node --check final/docs/v3-constellation-prototypes/nebula.js
          node final/tools/verify-build.js
          ! grep -q 'stamp-pop' final/script.js
          ! grep -q 'stamp-pop' final/style.css
          ! grep -q 'Stamp feedback' final/script.js
          ! grep -R -E 'unpkg.com/aos@|vanilla-tilt/1.8.0' final/projects/*/index.html
          ! grep -q 'devicons/devicon' final/index.html
          grep -q 'function resetV3Gateway' final/script.js
          grep -q 'function resetGate' final/docs/v3-constellation-prototypes/nebula.js
          grep -q '<main id="main-content">' final/index.html

      - name: Install temporary browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-rc-node
          cd /tmp/portfolio-rc-node
          npm init -y >/dev/null
          npm install playwright@1.55.0 lighthouse >/dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=/tmp/portfolio-rc-node/node_modules" >> "$GITHUB_ENV"

      - name: Serve release candidate
        shell: bash
        run: |
          python3 -m http.server 4176 --directory final >/tmp/portfolio-rc-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-rc-http.log
          exit 1

      - name: Run full v2 regression and live-demo QA
        shell: bash
        env:
          QA_BASE: http://127.0.0.1:4176
          TARGET_DIR: ${{ github.workspace }}/final
          QA_OUT: ${{ github.workspace }}/rc-v2-qa
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" CHROME_PATH="$CHROME_PATH" node runner/tools/v2-phase-qa.cjs

      - name: Run production gateway and universe QA
        shell: bash
        env:
          QA_BASE: http://127.0.0.1:4176
          QA_OUT: ${{ github.workspace }}/rc-v3-qa
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" CHROME_PATH="$CHROME_PATH" node runner/tools/v3-release-qa.cjs

      - name: Measure and gate Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-rc
          /tmp/portfolio-rc-node/node_modules/.bin/lighthouse http://127.0.0.1:4176/ \
            --chrome-path="$CHROME_PATH" --output=json --output-path=lighthouse-rc/mobile.json \
            --quiet --chrome-flags="--headless --no-sandbox"
          /tmp/portfolio-rc-node/node_modules/.bin/lighthouse http://127.0.0.1:4176/ \
            --chrome-path="$CHROME_PATH" --preset=desktop --output=json --output-path=lighthouse-rc/desktop.json \
            --quiet --chrome-flags="--headless --no-sandbox"
          node - <<'NODE'
          const fs=require('fs'); const out={};
          for(const mode of ['mobile','desktop']) {
            const j=JSON.parse(fs.readFileSync(`lighthouse-rc/${mode}.json`));
            out[mode]={performance:Math.round(j.categories.performance.score*100),accessibility:Math.round(j.categories.accessibility.score*100),bestPractices:Math.round(j.categories['best-practices'].score*100),seo:Math.round(j.categories.seo.score*100),fcp:j.audits['first-contentful-paint'].displayValue,lcp:j.audits['largest-contentful-paint'].displayValue,tbt:j.audits['total-blocking-time'].displayValue,cls:j.audits['cumulative-layout-shift'].displayValue};
          }
          fs.writeFileSync('lighthouse-rc/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(out.mobile.performance < 74) throw new Error(`mobile performance regressed: ${out.mobile.performance}`);
          if(out.desktop.performance < 80) throw new Error(`desktop performance regressed: ${out.desktop.performance}`);
          if(out.mobile.accessibility < 100 || out.desktop.accessibility < 100) throw new Error('accessibility must return to 100');
          NODE

      - name: Commit clean release candidate atomically
        shell: bash
        run: |
          set -euo pipefail
          cd final
          git config user.name "portfolio release runner"
          git config user.email "actions@users.noreply.github.com"
          BASE="4791c0b828b6382f26b74af7ca121e41e23904ec"
          mapfile -d '' FILES < <(git status --porcelain=v1 -z --untracked-files=all | sed -z 's/^...//')
          test "${#FILES[@]}" -ge 40
          for f in "${FILES[@]}"; do
            git add -- "$f"
            case "$f" in
              index.html) msg="feat: integrate optimized home with v3 gateway" ;;
              script.js) msg="fix: harden home interactions and gateway return" ;;
              style.css) msg="perf: stabilize responsive home rendering" ;;
              detail.js) msg="perf: add lightweight detail runtime" ;;
              assets/project-demos.js) msg="feat: add interactive project demos" ;;
              projects.json) msg="feat: link verified project sources" ;;
              assets/images/nebula-gateway/*) msg="feat: add v3 gateway artwork" ;;
              docs/v3-constellation-prototypes/*) msg="fix: finalize v3 constellation runtime" ;;
              projects/*/assets/images/*) msg="feat: add verified project media" ;;
              projects/*/index.html) msg="feat: enhance project detail experience" ;;
              *) msg="chore: finalize portfolio release candidate" ;;
            esac
            git commit -m "$msg" -- "$f"
          done
          changed="$(git diff --name-only "$BASE"...HEAD | wc -l)"
          commits="$(git rev-list --count "$BASE"..HEAD)"
          echo "changed=$changed commits=$commits"
          test "$changed" -eq "$commits"
          test "$changed" -eq "${#FILES[@]}"
          git push origin HEAD:agent/portfolio-release-candidate

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-release-candidate-evidence
          path: |
            rc-v2-qa
            rc-v3-qa
            lighthouse-rc
          if-no-files-found: warn
