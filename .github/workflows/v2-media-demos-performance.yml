name: v2-only release candidate rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build-and-qa:
    if: github.head_ref == 'agent/v2-media-demos-performance-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          ref: agent/v2-media-demos-performance-runner
          path: runner
          fetch-depth: 1

      - name: Checkout clean main
        uses: actions/checkout@v4
        with:
          ref: main
          path: final
          fetch-depth: 80
          token: ${{ github.token }}

      - name: Checkout verified v2 source
        uses: actions/checkout@v4
        with:
          ref: d68843d40b2692d962720e0a012a8c17d0c014d3
          path: source
          fetch-depth: 80

      - name: Compose v2-only candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE="4791c0b828b6382f26b74af7ca121e41e23904ec"
          test "$(git -C final rev-parse HEAD)" = "$BASE"
          test "$(git -C source merge-base "$BASE" HEAD)" = "$BASE"
          git -C source diff --name-only "$BASE"...HEAD > /tmp/v2-files-all
          test "$(wc -l < /tmp/v2-files-all)" -eq 35

          grep -v -F -x \
            -e 'projects/koreatechGongjiAgent/assets/images/source-design-hub.webp' \
            -e 'projects/koreatechGongjiAgent/assets/images/source-mobile-proposal.webp' \
            -e 'projects/koreatechGongjiAgent/index.html' \
            /tmp/v2-files-all > /tmp/v2-files
          test "$(wc -l < /tmp/v2-files)" -eq 32

          while IFS= read -r f; do
            mkdir -p "final/$(dirname "$f")"
            cp -a "source/$f" "final/$f"
          done < /tmp/v2-files

          ! grep -R -n -E 'source-design-hub\.webp|source-mobile-proposal\.webp' final/projects/koreatechGongjiAgent || true
          test ! -e final/projects/koreatechGongjiAgent/assets/images/source-design-hub.webp
          test ! -e final/projects/koreatechGongjiAgent/assets/images/source-mobile-proposal.webp
          test ! -d final/assets/images/nebula-gateway
          git -C final diff --check
          node --check final/script.js
          node --check final/detail.js
          node --check final/assets/project-demos.js
          node final/tools/verify-build.js

      - name: Install browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-only-node
          cd /tmp/v2-only-node
          npm init -y >/dev/null
          npm install playwright@1.55.0 lighthouse >/dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=/tmp/v2-only-node/node_modules" >> "$GITHUB_ENV"

      - name: Serve candidate
        shell: bash
        run: |
          python3 -m http.server 4176 --directory final >/tmp/v2-only-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4176/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v2-only-http.log
          exit 1

      - name: Run full v2 browser QA
        env:
          QA_BASE: http://127.0.0.1:4176
          TARGET_DIR: ${{ github.workspace }}/final
          QA_OUT: ${{ github.workspace }}/v2-only-qa
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" CHROME_PATH="$CHROME_PATH" node runner/tools/v2-phase-qa.cjs

      - name: Lighthouse gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-v2-only
          /tmp/v2-only-node/node_modules/.bin/lighthouse http://127.0.0.1:4176/ --chrome-path="$CHROME_PATH" --output=json --output-path=lighthouse-v2-only/mobile.json --quiet --chrome-flags="--headless --no-sandbox"
          /tmp/v2-only-node/node_modules/.bin/lighthouse http://127.0.0.1:4176/ --chrome-path="$CHROME_PATH" --preset=desktop --output=json --output-path=lighthouse-v2-only/desktop.json --quiet --chrome-flags="--headless --no-sandbox"
          node - <<'NODE'
          const fs=require('fs'); const out={};
          for(const mode of ['mobile','desktop']) {
            const j=JSON.parse(fs.readFileSync(`lighthouse-v2-only/${mode}.json`));
            out[mode]={performance:Math.round(j.categories.performance.score*100),accessibility:Math.round(j.categories.accessibility.score*100),bestPractices:Math.round(j.categories['best-practices'].score*100),seo:Math.round(j.categories.seo.score*100),lcp:j.audits['largest-contentful-paint'].displayValue,tbt:j.audits['total-blocking-time'].displayValue,cls:j.audits['cumulative-layout-shift'].displayValue};
          }
          fs.writeFileSync('lighthouse-v2-only/summary.json',JSON.stringify(out,null,2)); console.log(out);
          if(out.mobile.performance < 80 || out.desktop.performance < 80) throw new Error('performance below 80');
          if(out.mobile.accessibility < 100 || out.desktop.accessibility < 100) throw new Error('accessibility below 100');
          NODE

      - name: Commit clean v2-only candidate atomically
        shell: bash
        run: |
          set -euo pipefail
          cd final
          git config user.name "v2 release runner"
          git config user.email "actions@users.noreply.github.com"
          BASE="4791c0b828b6382f26b74af7ca121e41e23904ec"
          mapfile -d '' FILES < <(git status --porcelain=v1 -z --untracked-files=all | sed -z 's/^...//')
          test "${#FILES[@]}" -eq 32
          for f in "${FILES[@]}"; do
            git add -- "$f"
            case "$f" in
              index.html) msg="perf: optimize v2 home loading" ;;
              script.js) msg="fix: simplify v2 home interactions" ;;
              style.css) msg="perf: stabilize v2 responsive styles" ;;
              detail.js) msg="perf: add lightweight detail runtime" ;;
              assets/project-demos.js) msg="feat: add interactive project demos" ;;
              projects.json) msg="feat: link verified project sources" ;;
              projects/*/assets/images/*) msg="feat: add verified project media" ;;
              projects/*/index.html) msg="feat: enhance project detail experience" ;;
              *) msg="chore: finalize v2 portfolio candidate" ;;
            esac
            git commit -m "$msg" -- "$f"
          done
          changed="$(git diff --name-only "$BASE"...HEAD | wc -l)"
          commits="$(git rev-list --count "$BASE"..HEAD)"
          echo "changed=$changed commits=$commits"
          test "$changed" -eq 32
          test "$commits" -eq 32
          test "$changed" -eq "$commits"
          EXPECTED="$(git ls-remote origin refs/heads/agent/portfolio-release-candidate | cut -f1)"
          test -n "$EXPECTED"
          git push --force-with-lease=refs/heads/agent/portfolio-release-candidate:"$EXPECTED" origin HEAD:agent/portfolio-release-candidate

      - name: Upload v2-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-only-release-evidence
          path: |
            v2-only-qa
            lighthouse-v2-only
