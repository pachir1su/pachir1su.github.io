name: v3 prototype baseline browser QA

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  qa:
    if: github.head_ref == 'agent/v3-nebula-qa-fixes-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          ref: agent/v3-nebula-qa-fixes-runner
          path: runner
          fetch-depth: 1

      - name: Checkout clean baseline
        uses: actions/checkout@v4
        with:
          ref: agent/v3-prototype-baseline
          path: target
          fetch-depth: 1

      - name: Verify atomic baseline and regressions
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-list --count origin/main..HEAD 2>/dev/null || git rev-list --count ec5e92b81991cb3c013010aeb90d3beb3c89a1e7..HEAD)" -eq 9
          node --check docs/v3-constellation-prototypes/nebula.js
          node --check build.js
          node --check script.js
          node tools/verify-build.js
          test -f docs/v3-constellation-prototypes/assets/gateway/torn-portal-wide-v1.png
          test -f docs/v3-constellation-prototypes/assets/gateway/torn-portal-trail-v1.png
          test -f docs/v3-constellation-prototypes/assets/gateway/torn-portal-diagonal-v1.png
          grep -q 'sfx-06-enter-b-three-notes.wav' docs/v3-constellation-prototypes/nebula.js
          grep -q 'Codex handoff' docs/design-concept-v3.md

      - name: Install temporary Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3-baseline-qa
          cd /tmp/v3-baseline-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=/tmp/v3-baseline-qa/node_modules" >> "$GITHUB_ENV"

      - name: Start clean baseline server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory target >/tmp/v3-baseline-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/docs/v3-constellation-prototypes/nebula-gateway.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-baseline-http.log
          exit 1

      - name: Run clean baseline browser QA
        shell: bash
        env:
          QA_OUT: v3-prototype-baseline-qa-artifacts
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" CHROME_PATH="$CHROME_PATH" node runner/tools/v3-prototype-integration-qa.cjs

      - name: Upload clean baseline QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-prototype-baseline-qa
          path: v3-prototype-baseline-qa-artifacts
          if-no-files-found: warn
