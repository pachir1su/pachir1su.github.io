name: v2.6 final media visual validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v26-final-visual-validation-v2.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26-structure-media-followup

      - name: Prepare validation copy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          python3 -m pip install --quiet selenium pillow
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages = [
              'projects/Wall_Sina/index.html',
              'projects/2026_U-CAST/index.html',
              'projects/koreatechGongjiAgent/index.html',
              'projects/Legend_SakSak_GongGam_AI/index.html',
              'projects/swordmaster/index.html',
              'projects/koreatech_noob_guide/index.html',
              'projects/github_rank_insight/index.html',
          ]
          for name in pages:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\s+data-aos(?:-delay)?="[^"]*"', '', s)
              s = s.replace('loading="lazy"', 'loading="eager"')
              p.write_text(s, encoding='utf-8')
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/v26-final-http.log 2>&1 &
          sleep 1

      - name: Validate responsive media layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v26-final-shots/media
          python3 - <<'PY'
          import json, shutil, time, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By

          base = 'http://127.0.0.1:8000/'
          pages = {
              'wall-sina': 'projects/Wall_Sina/',
              'ucast': 'projects/2026_U-CAST/',
              'kga': 'projects/koreatechGongjiAgent/',
              'gonggam': 'projects/Legend_SakSak_GongGam_AI/',
              'swordmaster': 'projects/swordmaster/',
              'freshman-guide': 'projects/koreatech_noob_guide/',
              'github-rank': 'projects/github_rank_insight/',
          }
          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin = shutil.which('chromedriver') or shutil.which('chromium-driver')
          if not chrome:
              raise SystemExit('Chrome/Chromium unavailable')
          opts = Options(); opts.binary_location = chrome
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars','--ignore-certificate-errors','--lang=ko-KR','--force-device-scale-factor=1']:
              opts.add_argument(arg)
          d = webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(), options=opts)
          results = []

          def settle(url, width, height=1000):
              d.set_window_size(width, height)
              d.get(url)
              deadline = time.time() + 18
              while time.time() < deadline:
                  ok = d.execute_script('''
                    return document.readyState === 'complete' &&
                      [...document.images].every(img => img.complete && img.naturalWidth > 0);
                  ''')
                  if ok: break
                  d.execute_script('window.scrollBy(0, 650)')
                  time.sleep(.25)
              d.execute_script('window.scrollTo(0,0)')
              time.sleep(.8)

          def check_page(name, path, width, screenshot=False):
              settle(base + path, width)
              metrics = d.execute_script('''
                const figures=[...document.querySelectorAll('.detail-gallery .detail-figure')];
                return {
                  width: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  broken: [...document.images].filter(x => !x.complete || x.naturalWidth === 0).length,
                  galleryFigures: figures.length,
                  stretched: figures.filter(f => {
                    const img=f.querySelector('img');
                    const cap=f.querySelector('figcaption');
                    if(!img || !cap) return false;
                    const cs=getComputedStyle(f);
                    const expected=img.getBoundingClientRect().height + cap.getBoundingClientRect().height +
                      parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+
                      parseFloat(cs.borderTopWidth)+parseFloat(cs.borderBottomWidth);
                    return f.getBoundingClientRect().height - expected > 4;
                  }).length,
                  favicon: document.querySelector('link[rel~="icon"]')?.getAttribute('href') || '',
                  mediaErrors: [...document.querySelectorAll('img')].filter(x => /error|configuration/i.test(x.alt || '')).length
                };
              ''')
              if metrics['scrollWidth'] > width + 1: raise SystemExit(f'overflow {name}@{width}: {metrics}')
              if metrics['broken']: raise SystemExit(f'broken images {name}@{width}: {metrics}')
              if metrics['stretched']: raise SystemExit(f'stretched cards {name}@{width}: {metrics}')
              if metrics['favicon'] != '/assets/favicon.svg': raise SystemExit(f'favicon mismatch {name}: {metrics}')
              results.append({'page':name, **metrics})
              if screenshot:
                  full_h=int(min(d.execute_script('return document.documentElement.scrollHeight'),9000))
                  d.set_window_size(width,max(1000,full_h)); time.sleep(.5)
                  d.save_screenshot(f'/tmp/v26-final-shots/{name}-{width}-light.png')

          for name,path in pages.items():
              for width in (390,768,1024,1280):
                  check_page(name,path,width,screenshot=width in (390,1280))

          for name in ('wall-sina','kga'):
              settle(base+pages[name],1280)
              toggle=d.find_elements(By.ID,'themeToggle')
              if toggle: toggle[0].click(); time.sleep(.8)
              full_h=int(min(d.execute_script('return document.documentElement.scrollHeight'),9000))
              d.set_window_size(1280,max(1000,full_h)); time.sleep(.5)
              d.save_screenshot(f'/tmp/v26-final-shots/{name}-1280-dark.png')
              if d.execute_script('return document.documentElement.scrollWidth')>1281:
                  raise SystemExit(f'dark overflow {name}')

          # Root and concurrently merged v3 pages must use the same chicken favicon.
          for path in ('','docs/v3-constellation-prototypes/index.html','docs/v3-mockups/index.html'):
              settle(base+path,1280,900)
              href=d.execute_script('return document.querySelector("link[rel~=icon]")?.getAttribute("href") || ""')
              if href != '/assets/favicon.svg': raise SystemExit(f'favicon mismatch: {path} -> {href}')

          d.quit()
          with urllib.request.urlopen(base+'assets/favicon.svg',timeout=5) as r:
              if r.status!=200: raise SystemExit('favicon HTTP failure')
          with urllib.request.urlopen(base+'projects/Wall_Sina/assets/video/prototype-demo.mp4',timeout=5) as r:
              if r.status!=200: raise SystemExit('video HTTP failure')
          Path('/tmp/v26-final-shots/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY

          # Include the key committed media themselves for direct visual inspection.
          cp projects/Legend_SakSak_GongGam_AI/assets/images/app-home.webp /tmp/v26-final-shots/media/gonggam.webp
          cp projects/swordmaster/assets/images/file-swordmaster.webp /tmp/v26-final-shots/media/file-swordmaster.webp
          cp projects/koreatechGongjiAgent/assets/images/web-home.webp /tmp/v26-final-shots/media/kga-home.webp
          cp projects/koreatechGongjiAgent/assets/images/web-notice.webp /tmp/v26-final-shots/media/kga-notice.webp
          cp projects/koreatechGongjiAgent/assets/images/web-admin.webp /tmp/v26-final-shots/media/kga-admin.webp
          cp projects/koreatech_noob_guide/assets/images/notion-guide.webp /tmp/v26-final-shots/media/freshman-guide.webp
          cp projects/github_rank_insight/assets/images/live-demo.webp /tmp/v26-final-shots/media/github-rank.webp

      - name: Upload final validation
        uses: actions/upload-artifact@v4
        with:
          name: v26-final-visual-validation-v2
          path: /tmp/v26-final-shots
          retention-days: 3
