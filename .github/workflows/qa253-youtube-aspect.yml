name: qa253-youtube-aspect

on:
  pull_request:
    types: [synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/qa252-regression-fix
      - name: Static validation
        run: |
          node tools/verify-build.js
          git diff --check
          grep -Fq 'class="detail-youtube-embed"' projects/computingSAGO/index.html
          grep -Fq 'class="detail-youtube-embed"' projects/MultiMind/index.html
          grep -Fq '.detail-youtube-embed > iframe.detail-video' style.css
      - name: Install Puppeteer
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Check rendered YouTube aspect ratios
        run: |
          python3 -m http.server 8000 >/tmp/qa-youtube-http.log 2>&1 &
          sleep 1
          cat > qa-youtube.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-gpu']});
          const base='http://127.0.0.1:8000';
          const pages=[
            ['/projects/computingSAGO/index.html','Daily Report AI'],
            ['/projects/MultiMind/index.html','MultiMind']
          ];
          let failed=0;
          for (const [path,label] of pages) {
            for (const width of [1000,390]) {
              const page=await browser.newPage();
              await page.setViewport({width,height:850,deviceScaleFactor:1});
              await page.setRequestInterception(true);
              page.on('request',req=>{try{const u=new URL(req.url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')req.continue();else req.abort();}catch{req.continue();}});
              await page.goto(base+path,{waitUntil:'domcontentloaded'});
              const m=await page.evaluate(()=>{
                const wrap=document.querySelector('.detail-youtube-embed');
                const frame=document.querySelector('.detail-youtube-embed > iframe.detail-video');
                if(!wrap||!frame)return null;
                const w=wrap.getBoundingClientRect(), f=frame.getBoundingClientRect();
                return {wrap:[w.width,w.height],frame:[f.width,f.height],sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth};
              });
              const ratio=m ? m.frame[0]/m.frame[1] : 0;
              const target=16/9;
              const ok=!!m && Math.abs(ratio-target)<0.02 && Math.abs(m.wrap[0]-m.frame[0])<1 && Math.abs(m.wrap[1]-m.frame[1])<1 && m.sw<=m.cw+2;
              console.log(`${ok?'PASS':'FAIL'} ${label} ${width}px :: ${m?`${m.frame[0].toFixed(1)}x${m.frame[1].toFixed(1)} ratio=${ratio.toFixed(4)} overflow=${m.sw}/${m.cw}`:'missing embed'}`);
              if(!ok) failed++;
              await page.close();
            }
          }
          await browser.close();
          if(failed) process.exit(1);
          EOF
          node qa-youtube.mjs
