name: v2.6.x committed media inspection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26-media-pass
      - name: Verify committed media inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/media -type f -name '*.webp' | wc -l)" -eq 21
          find assets/media -type f -name '*.webp' -size 0 -print -quit | grep -q . && exit 1 || true
      - name: Upload committed media
        uses: actions/upload-artifact@v4
        with:
          name: v26-media-committed-files
          path: assets/media
          retention-days: 3
