name: v2.6 finalization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v26-source-cleanup-bootstrap.yml

permissions:
  contents: write

jobs:
  finalize-v26:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build final v2.6 source
        run: |
          python tools/v26_finalize.py
          git diff --check

      - name: Commit index.html
        run: |
          git add index.html
          git diff --cached --quiet && { echo 'index.html did not change'; exit 1; }
          git commit -m 'fix: finalize v2.6 markup'

      - name: Commit style.css
        run: |
          git add style.css
          git diff --cached --quiet && { echo 'style.css did not change'; exit 1; }
          git commit -m 'refactor: finalize v2.6 styles'

      - name: Commit script.js
        run: |
          git add script.js
          git diff --cached --quiet && { echo 'script.js did not change'; exit 1; }
          git commit -m 'refactor: remove temporary v2.6 normalizer'

      - name: Validate final source
        run: |
          node --check script.js
          node build.js
          git diff --exit-code
          node tools/verify-build.js
          git diff --check

      - name: Remove temporary finalizer
        run: |
          git rm tools/v26_finalize.py
          git commit -m 'chore: remove v2.6 finalizer'

      - name: Remove finalization workflow and push
        run: |
          git rm .github/workflows/v26-source-cleanup-bootstrap.yml
          git commit -m 'chore: remove v2.6 finalization workflow'
          test "$(git rev-list --count "$GITHUB_SHA"..HEAD)" -eq 5
          test "$(git diff --name-only "$GITHUB_SHA"...HEAD | wc -l)" -eq 5
          git push origin HEAD:main
