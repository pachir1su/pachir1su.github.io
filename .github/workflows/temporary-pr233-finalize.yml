name: Temporary PR233 Finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'Codex/add-project-media-12'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: Codex/add-project-media-12
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified KGA live captures
        env:
          KGA_CAPTURE_ZIP_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-a60c-8206-91d6-05d8c0079bd8/raw?se=2026-08-24T12%3A55%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=76cd392b-37de-556a-b58f-fa201440ca01&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T23%3A26%3A13Z&ske=2026-08-24T23%3A26%3A13Z&sks=b&skv=2026-02-06&sig=bwA0eY%2BkjCqpAHSlhqorAd6mL3lCdW5LsaCCd2BXdbo%3D'
        run: |
          curl --fail --location --retry 2 "$KGA_CAPTURE_ZIP_URL" -o /tmp/kga-captures.zip
          mkdir -p /tmp/kga-captures
          unzip -q /tmp/kga-captures.zip -d /tmp/kga-captures
          ls -lh /tmp/kga-captures

      - name: Prepare live KGA portfolio media
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('/tmp/kga-captures')
          dst = Path('projects/koreatechGongjiAgent/assets/images')
          dst.mkdir(parents=True, exist_ok=True)
          specs = {
              'web-home-live.webp': ('home-1440.png', (0, 0, 1440, 1000), (1200, 833)),
              'web-shuttle-live.webp': ('shuttle-1440.png', (0, 0, 1440, 1000), (1200, 833)),
              'web-library-live.webp': ('library-1440.png', (0, 0, 1440, 1000), (1200, 833)),
              'web-calendar-live.webp': ('calendar-1440.png', (0, 0, 1440, 1000), (1200, 833)),
              'web-home-mobile-live.webp': ('home-mobile-390.png', (0, 0, 390, 844), (390, 844)),
          }
          for out_name, (in_name, crop, size) in specs.items():
              image = Image.open(src / in_name).convert('RGB').crop(crop)
              if image.size != size:
                  image = image.resize(size, Image.Resampling.LANCZOS)
              image.save(dst / out_name, 'WEBP', quality=78, method=6)
              print(out_name, image.size, (dst / out_name).stat().st_size)
          PY

      - name: Patch KGA gallery and BerryIno demo IDs
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/project-demos.js')
          js = js_path.read_text(encoding='utf-8')
          old = """    const input = create('input', 'berry-id-input');
              input.type = 'text';
              input.inputMode = 'numeric';
              input.maxLength = 10;
              input.placeholder = '2025-0004';
              input.setAttribute('aria-label', translate('가상 학생 번호', 'Fictional student ID'));
          """
          new = """    const input = create('input', 'berry-id-input');
              input.type = 'text';
              input.id = 'berry-fictional-id';
              input.inputMode = 'numeric';
              input.maxLength = 4;
              input.placeholder = '0004';
              input.setAttribute('aria-label', translate('가상 학생 번호 4자리', 'Four-digit fictional student ID'));
              label.htmlFor = input.id;
          """
          if old not in js:
              raise SystemExit('Berry input block not found')
          js = js.replace(old, new, 1)
          js = js.replace("const cardIds = ['2025-0001', '2025-0002', '2025-0003'];", "const cardIds = ['DEMO-0001', 'DEMO-0002', 'DEMO-0003'];", 1)
          old_norm = """    // Formats a typed number into the same harmless demo-ID shape.
              function normalizeId(value) {
                const digits = value.replace(/\\D/g, '').slice(0, 8);
                if (digits.length < 4) return '';
                return digits.length > 4 ? `${digits.slice(0, 4)}-${digits.slice(4)}` : digits;
              }
          """
          new_norm = """    // Converts exactly four typed digits into an explicit demo-only namespace.
              function normalizeId(value) {
                const digits = value.replace(/\\D/g, '').slice(-4);
                if (digits.length !== 4) return '';
                return `DEMO-${digits}`;
              }
          """
          if old_norm not in js:
              raise SystemExit('Berry normalize block not found')
          js = js.replace(old_norm, new_norm, 1)
          js = js.replace("setText(status, '가상 학생 번호를 네 자리 이상 입력하세요.', 'Enter at least four digits for a fictional ID.');", "setText(status, '가상 학생 번호 4자리를 입력하세요.', 'Enter four digits for a fictional ID.');", 1)
          js_path.write_text(js, encoding='utf-8')

          kga_path = Path('projects/koreatechGongjiAgent/index.html')
          html = kga_path.read_text(encoding='utf-8')
          pattern = re.compile(r'''            <div class="detail-section" data-media-followup="v27-kga-audit">.*?            </div>\n\n            <div class="detail-section" data-aos="fade-up" data-aos-delay="100">''', re.S)
          replacement = '''            <div class="detail-section" data-media-followup="v27-kga-audit">
              <h2 data-en="Verified Live Screens" data-ko="검증된 실운영 화면">검증된 실운영 화면</h2>
              <p data-en="Screens captured from the live read-only web dashboard through the current Cloudflare Quick Tunnel on August 24, 2026." data-ko="2026년 8월 24일 현재 Cloudflare Quick Tunnel로 공개 중인 읽기 전용 웹 대시보드를 실제 접속해 캡처했습니다.">2026년 8월 24일 현재 Cloudflare Quick Tunnel로 공개 중인 읽기 전용 웹 대시보드를 실제 접속해 캡처했습니다.</p>
              <div class="detail-gallery">
                <figure class="detail-figure">
                  <img src="assets/images/web-home-live.webp" width="1200" height="833" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 실운영 홈 화면" />
                  <figcaption data-en="Live home dashboard — search, shuttle, meal, library, calendar and notices" data-ko="실운영 홈 — 통합 검색·셔틀·학식·도서관·일정·공지">실운영 홈 — 통합 검색·셔틀·학식·도서관·일정·공지</figcaption>
                </figure>
                <figure class="detail-figure">
                  <img src="assets/images/web-shuttle-live.webp" width="1200" height="833" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 실운영 셔틀 화면" />
                  <figcaption data-en="Live shuttle dashboard — service status and timetable" data-ko="실운영 셔틀 — 운행 상태와 시간표">실운영 셔틀 — 운행 상태와 시간표</figcaption>
                </figure>
                <figure class="detail-figure">
                  <img src="assets/images/web-library-live.webp" width="1200" height="833" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 실운영 도서관 좌석 화면" />
                  <figcaption data-en="Live library-seat dashboard" data-ko="실운영 도서관 좌석 현황">실운영 도서관 좌석 현황</figcaption>
                </figure>
                <figure class="detail-figure">
                  <img src="assets/images/web-calendar-live.webp" width="1200" height="833" loading="lazy" decoding="async" alt="코리아텍 통합 알림 시스템 실운영 일정 화면" />
                  <figcaption data-en="Live campus calendar" data-ko="실운영 학사·교내 일정">실운영 학사·교내 일정</figcaption>
                </figure>
                <figure class="detail-figure">
                  <img src="assets/images/web-home-mobile-live.webp" width="390" height="844" loading="lazy" decoding="async" alt="390픽셀 모바일 화면에서 표시된 코리아텍 통합 알림 시스템 홈" />
                  <figcaption data-en="Live mobile home at 390 px" data-ko="390px 모바일 실운영 홈">390px 모바일 실운영 홈</figcaption>
                </figure>
              </div>
            </div>

            <div class="detail-section" data-aos="fade-up" data-aos-delay="100">'''
          html, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'KGA gallery replacement count={count}')
          kga_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify final branch
        run: |
          node --check build.js
          node --check script.js
          node --check detail.js
          node --check assets/project-demos.js
          node tools/verify-build.js
          node tools/verify-media-metadata.js
          grep -q 'DEMO-0001' assets/project-demos.js
          grep -q 'web-home-live.webp' projects/koreatechGongjiAgent/index.html
          grep -q 'CyX0PryfrRI' projects/MultiMind/index.html
          grep -q '4xF9-N9jKvc' projects/computingSAGO/index.html

      - name: Commit finalized changes and remove temporary workflow
        run: |
          rm -f .github/workflows/temporary-pr233-finalize.yml
          git config user.name 'ChatGPT workflow'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: add live KGA screens and harden BerryIno demo IDs'
          git push origin HEAD:Codex/add-project-media-12
