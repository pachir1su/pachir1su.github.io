name: Issues 234 235 236 Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/issues-234-236-runner
          fetch-depth: 0

      - name: Stage runner scripts and switch to target PR branch
        run: |
          cp .github/scripts/issues-234-236-apply.py /tmp/issues-234-236-apply.py
          cp .github/scripts/issues-236-index.py /tmp/issues-236-index.py
          git fetch origin Codex/add-project-media-12
          git checkout -B Codex/add-project-media-12 origin/Codex/add-project-media-12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure git
        run: |
          git config user.name 'ChatGPT workflow'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply issue patches
        run: python3 /tmp/issues-234-236-apply.py

      - name: Commit CLAUDE rule
        run: |
          git add CLAUDE.md
          git commit -m 'docs: disable unsolicited Claude auto check-ins'

      - name: Commit KGA Discord action data
        run: |
          git add projects.json
          git commit -m 'feat: add KGA Discord deployment notice'

      - name: Commit notice-button renderer
        run: |
          git add build.js
          git commit -m 'feat: render project notice link buttons'

      - name: Commit notice behavior
        run: |
          git add script.js
          git commit -m 'feat: show project link notice toast'

      - name: Commit notice and skill CSS
        run: |
          git add style.css
          git commit -m 'fix: style KGA notice and retire placeholder glyphs'

      - name: Regenerate cards and restore real skill logos
        run: |
          node build.js
          python3 /tmp/issues-236-index.py
          git add index.html
          git commit -m 'fix: restore Devicon logos in skills section'

      - name: Static verification
        run: |
          node --check build.js
          node --check script.js
          node --check detail.js
          node --check assets/project-demos.js
          node tools/verify-build.js
          node tools/verify-media-metadata.js
          node build.js
          git diff --exit-code
          grep -q 'class="plink plink-github plink-notice"' index.html
          grep -q 'data-notice-ko="배포 준비 중"' index.html
          grep -q 'devicon-python-plain colored' index.html
          if grep -q 'skill-glyph' index.html; then exit 1; fi

      - name: Browser verification
        run: |
          mkdir -p /tmp/browser-qa artifacts
          cd /tmp/browser-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 >/tmp/portfolio-http.log 2>&1 &
          echo $! >/tmp/portfolio-http.pid
          sleep 2
          NODE_PATH=/tmp/browser-qa/node_modules node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', err => errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });

            const glyphCount = await page.locator('#skills .skill-glyph').count();
            if (glyphCount !== 0) throw new Error(`skill-glyph placeholders remain: ${glyphCount}`);
            const icons = page.locator('#skills [class*="devicon-"]');
            const iconCount = await icons.count();
            if (iconCount < 13) throw new Error(`expected >=13 Devicon icons, got ${iconCount}`);
            await page.waitForFunction(() => {
              const icons = [...document.querySelectorAll('#skills [class*="devicon-"]')];
              return icons.length >= 13 && icons.every((el) => {
                const content = getComputedStyle(el, '::before').content;
                return content && content !== 'none' && content !== 'normal' && content !== '""';
              });
            }, null, { timeout: 12000 });
            await page.locator('#skills').screenshot({ path: 'artifacts/skills-1440.png' });

            const kga = page.locator('.project-card', { hasText: '코리아텍 통합 알림 시스템' }).first();
            const notice = kga.locator('.plink-notice');
            if (await notice.count() !== 1) throw new Error('KGA Discord notice button missing');
            const before = page.url();
            await notice.click();
            const toast = page.locator('.site-toast.show');
            await toast.waitFor({ state: 'visible' });
            if ((await toast.textContent()).trim() !== '배포 준비 중') throw new Error('Korean notice text mismatch');
            if (page.url() !== before) throw new Error('notice button unexpectedly navigated');
            await kga.screenshot({ path: 'artifacts/kga-card-1440.png' });

            await page.evaluate(() => localStorage.setItem('lang', 'en'));
            await page.reload({ waitUntil: 'networkidle' });
            const kgaEn = page.locator('.project-card', { hasText: 'KOREATECH Unified Alert System' }).first();
            await kgaEn.locator('.plink-notice').click();
            const toastEn = page.locator('.site-toast.show');
            await toastEn.waitFor({ state: 'visible' });
            if ((await toastEn.textContent()).trim() !== 'Deployment in preparation') throw new Error('English notice text mismatch');

            if (errors.length) throw new Error(`browser errors: ${errors.join(' | ')}`);
            fs.writeFileSync('artifacts/browser-report.txt', `devicons=${iconCount}\nnotice=ko/en ok\nconsoleErrors=0\n`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          kill $(cat /tmp/portfolio-http.pid) || true

      - name: Push verified commits to PR branch
        run: git push origin HEAD:Codex/add-project-media-12

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: issues-234-236-qa
          path: artifacts/
          if-no-files-found: error
          retention-days: 3
