name: TEMP PR211 regression media QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v2-regression-media-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Static verification
        run: |
          node --check script.js
          node --check build.js
          node tools/verify-build.js
          git diff --check
          git diff --exit-code
          test "$(git rev-list --count origin/main..HEAD)" -eq 9
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 9
          test "$(git diff --name-only origin/main...HEAD | grep -c '^__noop__\.tmp$' || true)" -eq 0

      - name: Browser QA
        run: |
          mkdir -p qa-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pr211-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > .tmp-pr211-qa.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const cases = [
            { width: 1440, height: 1000, lang: 'ko', theme: 'light' },
            { width: 390, height: 844, lang: 'en', theme: 'dark' },
          ];
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const waitImages = async (page, selector) => {
            const images = page.locator(selector);
            const count = await images.count();
            await images.evaluateAll((els) => Promise.all(els.map((img) => {
              if (img.complete) return Promise.resolve();
              return new Promise((resolve) => {
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
              });
            })));
            const bad = await images.evaluateAll((els) => els.map((img) => ({ src: img.getAttribute('src'), complete: img.complete, width: img.naturalWidth, height: img.naturalHeight })).filter((x) => !x.complete || x.width <= 0 || x.height <= 0));
            assert(bad.length === 0, `${selector}: broken images ${JSON.stringify(bad)}`);
            return count;
          };

          let passed = 0;
          for (const cfg of cases) {
            const context = await browser.newContext({ viewport: { width: cfg.width, height: cfg.height }, colorScheme: cfg.theme });
            await context.addInitScript(({lang, theme}) => {
              localStorage.setItem('lang', lang);
              localStorage.setItem('theme', theme);
            }, { lang: cfg.lang, theme: cfg.theme });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (e) => errors.push(String(e)));

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            assert(await page.locator('.project-card').count() === 31, `root ${cfg.width}: project cards != 31`);
            const expectedVideos = [
              'https://youtu.be/4xF9-N9jKvc',
              'https://youtu.be/CyX0PryfrRI',
              'https://www.youtube.com/watch?v=z0q6D7zNWyw',
            ];
            for (const href of expectedVideos) {
              assert(await page.locator(`.project-card a[href="${href}"]`).count() === 1, `root ${cfg.width}: video link missing ${href}`);
            }
            assert(await page.locator('.project-card a[title="YouTube"]').count() === 3, `root ${cfg.width}: YouTube card links != 3`);
            assert(await page.locator('.year-group-wip .project-card').count() === 1, `root ${cfg.width}: WIP count != 1`);
            assert(await page.locator('.year-group-discontinued .project-card').count() === 6, `root ${cfg.width}: discontinued count != 6`);
            const rootOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            assert(rootOverflow <= 1, `root ${cfg.width}: horizontal overflow ${rootOverflow}px`);
            assert(errors.length === 0, `root ${cfg.width}: ${errors.join(' | ')}`);
            await page.screenshot({ path: `qa-artifacts/root-${cfg.width}-${cfg.lang}-${cfg.theme}.png`, fullPage: false });

            errors.length = 0;
            await page.goto('http://127.0.0.1:4173/projects/HEALTH_CHECK_PROJECT/', { waitUntil: 'networkidle' });
            assert(await page.locator('.detail-photo-card').count() === 5, `health ${cfg.width}: photo cards != 5`);
            assert(await waitImages(page, '.detail-photo-card img') === 5, `health ${cfg.width}: photo img count != 5`);
            assert(await page.locator('a[href="https://pachir1su.notion.site/1b9f776d60dc8097ab51f6e8562c25e3"]').count() === 2, `health ${cfg.width}: current Notion links != 2`);
            assert(await page.locator('[data-project-demo="health"]').count() === 1, `health ${cfg.width}: demo root missing`);
            const healthOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            assert(healthOverflow <= 1, `health ${cfg.width}: horizontal overflow ${healthOverflow}px`);
            assert(errors.length === 0, `health ${cfg.width}: ${errors.join(' | ')}`);
            await page.locator('.detail-photo-grid').scrollIntoViewIfNeeded();
            await page.screenshot({ path: `qa-artifacts/health-${cfg.width}-${cfg.lang}-${cfg.theme}.png`, fullPage: false });

            errors.length = 0;
            await page.goto('http://127.0.0.1:4173/projects/swordmaster/', { waitUntil: 'networkidle' });
            assert(await page.locator('.detail-section[data-media-followup="v27-swordmaster-overview"] .detail-figure').count() === 2, `swordmaster ${cfg.width}: overview figures != 2`);
            assert(await waitImages(page, '.detail-section[data-media-followup="v27-swordmaster-overview"] img') === 2, `swordmaster ${cfg.width}: overview images != 2`);
            assert(await page.locator('img[src="assets/images/file-swordmaster.webp"]').count() === 1, `swordmaster ${cfg.width}: File screen missing`);
            assert(await page.locator('img[src="assets/images/media-swordmaster-live.webp"]').count() === 1, `swordmaster ${cfg.width}: Media screen missing`);
            const swordOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            assert(swordOverflow <= 1, `swordmaster ${cfg.width}: horizontal overflow ${swordOverflow}px`);
            assert(errors.length === 0, `swordmaster ${cfg.width}: ${errors.join(' | ')}`);
            await page.locator('[data-media-followup="v27-swordmaster-overview"]').scrollIntoViewIfNeeded();
            await page.screenshot({ path: `qa-artifacts/swordmaster-${cfg.width}-${cfg.lang}-${cfg.theme}.png`, fullPage: false });

            errors.length = 0;
            await page.goto('http://127.0.0.1:4173/projects/swordmaster/file_swordmaster.html', { waitUntil: 'networkidle' });
            assert(await page.locator('[data-media-source="file-swordmaster-local"] img[src="assets/images/file-swordmaster.webp"]').count() === 1, `file swordmaster ${cfg.width}: own screen missing`);
            assert(await waitImages(page, '[data-media-source="file-swordmaster-local"] img') === 1, `file swordmaster ${cfg.width}: own screen broken`);
            const fileOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            assert(fileOverflow <= 1, `file swordmaster ${cfg.width}: horizontal overflow ${fileOverflow}px`);
            assert(errors.length === 0, `file swordmaster ${cfg.width}: ${errors.join(' | ')}`);

            errors.length = 0;
            await page.goto('http://127.0.0.1:4173/projects/swordmaster/media_swordmaster.html', { waitUntil: 'networkidle' });
            assert(await page.locator('[data-media-source="media-swordmaster-local"] img[src="assets/images/media-swordmaster-live.webp"]').count() === 1, `media swordmaster ${cfg.width}: own screen missing`);
            assert(await waitImages(page, '[data-media-source="media-swordmaster-local"] img') === 1, `media swordmaster ${cfg.width}: own screen broken`);
            const mediaOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            assert(mediaOverflow <= 1, `media swordmaster ${cfg.width}: horizontal overflow ${mediaOverflow}px`);
            assert(errors.length === 0, `media swordmaster ${cfg.width}: ${errors.join(' | ')}`);

            console.log(`PASS ${cfg.width}px ${cfg.lang}/${cfg.theme}`);
            passed += 1;
            await context.close();
          }

          console.log(`PR211 regression media QA: ${passed}/${cases.length} viewport suites passed`);
          await browser.close();
          EOF
          node .tmp-pr211-qa.mjs
          rm -f .tmp-pr211-qa.mjs package.json package-lock.json

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr211-regression-media-qa
          path: qa-artifacts
          retention-days: 1
