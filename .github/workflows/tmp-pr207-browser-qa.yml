name: TEMP v2 card media preview implementation

on:
  push:
    branches: [tmp/pr207-browser-qa]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v2-card-media-preview
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add preview media metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('projects.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          previews = {
              'projects/github_rank_insight/': {'src': 'projects/github_rank_insight/assets/images/live-demo.webp', 'fit': 'contain'},
              'projects/koreatech_noob_guide/': {'src': 'projects/koreatech_noob_guide/assets/images/notion-guide.webp', 'fit': 'contain'},
              'projects/swordmaster/': {'src': 'projects/swordmaster/assets/images/media-swordmaster-live.webp', 'fit': 'contain'},
              'projects/koreatechGongjiAgent/': {'src': 'projects/koreatechGongjiAgent/assets/images/web-shuttle.webp', 'fit': 'contain'},
              'projects/2026_U-CAST/': {'src': 'projects/2026_U-CAST/assets/images/prototype.webp', 'fit': 'cover'},
              'projects/BerryIno/': {'src': 'projects/BerryIno/assets/images/nfc-photo-1.webp', 'fit': 'cover'},
              'projects/PlantClock/': {'src': 'projects/PlantClock/assets/images/plantclock.webp', 'fit': 'cover'},
              'projects/HEALTH_CHECK_PROJECT/': {'src': 'projects/HEALTH_CHECK_PROJECT/assets/images/prototype-front.webp', 'fit': 'cover'},
              'projects/Legend_SakSak_GongGam_AI/': {'src': 'projects/Legend_SakSak_GongGam_AI/assets/images/app-home.webp', 'fit': 'contain'},
              'projects/Master_Creator_Challenge/': {'src': 'projects/Master_Creator_Challenge/assets/images/doorlock-1.webp', 'fit': 'cover'},
              'projects/Wall_Sina/': {'src': 'projects/Wall_Sina/assets/images/prototype-1.webp', 'fit': 'cover'},
              'projects/2024_5th_CSRC/': {'src': 'projects/2024_5th_CSRC/assets/images/csrc-build-1.webp', 'fit': 'cover'},
          }

          for group in data['groups']:
              for card in group['cards']:
                  detail = card.get('detail')
                  if detail in previews:
                      card['preview'] = previews[detail]

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add projects.json
          git commit -m "feat: add project card preview media"

      - name: Render card preview markup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('build.js')
          text = path.read_text(encoding='utf-8')

          old = '''      : kind === "failed"\n      ? " project-failed"\n      : "";\n  const lines = [];'''
          new = '''      : kind === "failed"\n      ? " project-failed"\n      : "";\n  const previewClass = card.preview ? " project-card-previewable" : "";\n  const lines = [];'''
          if old not in text:
              raise SystemExit('build.js previewClass anchor not found')
          text = text.replace(old, new, 1)

          old = '''    `            <div class="project-card${extraClass}" data-category="${card.category}"${cardHref} data-tilt>`\n  );'''
          new = '''    `            <div class="project-card${extraClass}${previewClass}" data-category="${card.category}"${cardHref} data-tilt>`\n  );'''
          if old not in text:
              raise SystemExit('build.js card class anchor not found')
          text = text.replace(old, new, 1)

          old = '''  lines.push(`${I}</div>`);\n\n  if (card.badge) {'''
          new = '''  lines.push(`${I}</div>`);\n\n  /* 클릭 전 미디어 프리뷰 — projects.json에 실제 로컬 자산이 지정된 카드만 렌더한다.\n     장식적 미리보기이므로 중복 스크린리더 낭독을 피하고 카드 자체가 클릭 경로를 유지한다. */\n  if (card.preview?.src) {\n    const fitClass = card.preview.fit === "contain" ? " project-preview-contain" : "";\n    lines.push(`${I}<figure class="project-preview${fitClass}" aria-hidden="true">`);\n    lines.push(`                <img src="${esc(card.preview.src)}" alt="" loading="lazy" decoding="async" />`);\n    lines.push(`${I}</figure>`);\n  }\n\n  if (card.badge) {'''
          if old not in text:
              raise SystemExit('build.js preview markup anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git add build.js
          git commit -m "feat: render project card media previews"

      - name: Rebuild generated project region
        run: |
          node build.js
          git add index.html
          git commit -m "chore: rebuild project card previews"

      - name: Style compact polaroid previews
        run: |
          cat >> style.css <<'EOF'

          /* ===== #191 프로젝트 카드 클릭 전 미디어 프리뷰 =====
             실제 프로젝트 로컬 자산만 사용한다. 카드 내부에 항상 노출하고,
             hover/focus에서는 레이아웃 이동 없이 종이 사진이 살짝 들리는 정도만 연출한다. */
          .project-card-previewable .project-preview {
            flex: 0 0 auto;
            margin: 2px 0 4px;
            padding: 5px;
            background: var(--paper-2);
            border: 1px solid var(--line);
            border-radius: 3px;
            box-shadow: 2px 4px 10px rgba(31, 28, 20, 0.12);
            transform: rotate(-0.35deg);
            transform-origin: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            pointer-events: none;
          }
          .project-preview img {
            display: block;
            width: 100%;
            height: 104px;
            object-fit: cover;
            border-radius: 2px;
            background: var(--paper);
          }
          .project-preview.project-preview-contain img {
            object-fit: contain;
          }
          .project-card-previewable:hover .project-preview,
          .project-card-previewable:focus-within .project-preview {
            transform: translateY(-3px) rotate(0.25deg);
            box-shadow: 3px 7px 14px rgba(31, 28, 20, 0.16);
          }
          @media (max-width: 768px), (pointer: coarse) {
            .project-preview img {
              height: 128px;
            }
            .project-card-previewable:hover .project-preview,
            .project-card-previewable:focus-within .project-preview {
              transform: none;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .project-card-previewable .project-preview,
            .project-card-previewable:hover .project-preview,
            .project-card-previewable:focus-within .project-preview {
              transform: none;
              transition: none;
            }
          }
          EOF
          git add style.css
          git commit -m "feat: style project card media previews"

      - name: Push product branch
        run: git push origin HEAD:chatgpt/v2-card-media-preview
