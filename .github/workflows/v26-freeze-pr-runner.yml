name: v2.6.x freeze PR runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v26-freeze-pr-runner.yml
      - .github/workflows/v26-freeze-builder.yml

permissions:
  contents: write

jobs:
  run-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run freeze builder
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/v26-freeze-builder.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = raw.index(begin_marker) + len(begin_marker)
          end = raw.index(end_marker, start)
          payload_lines = []
          for line in raw[start:end].splitlines():
              payload_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v26-freeze-builder.py').write_text('\n'.join(payload_lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/v26-freeze-builder.py
          node build.js

      - name: Commit each changed file separately
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_one() {
            file="$1"
            message="$2"
            git add -- "$file"
            if ! git diff --cached --quiet; then
              git commit -m "$message"
            fi
          }

          commit_one projects.json "refactor: restore project card source copy"
          commit_one index.html "refactor: freeze normalized homepage markup"
          commit_one style.css "refactor: remove obsolete layout and easter egg css"
          commit_one script.js "refactor: remove v2.6 runtime compatibility layers"

          git push origin HEAD:${{ github.head_ref }}
