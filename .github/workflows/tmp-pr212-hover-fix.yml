name: TEMP health media runner

on:
  push:
    branches: [tmp/pr212-hover-fix]
    paths:
      - '.tmp-health/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temp payload
        uses: actions/checkout@v4

      - name: Rebuild uploaded WebP payloads
        run: |
          cat .tmp-health/sensor-*.part | base64 -d > /tmp/sensor.webp
          cat .tmp-health/gui-*.part | base64 -d > /tmp/gui.webp
          file /tmp/sensor.webp /tmp/gui.webp
          test "$(head -c 4 /tmp/sensor.webp)" = "RIFF"
          test "$(head -c 4 /tmp/gui.webp)" = "RIFF"

      - name: Commit one product file at a time
        run: |
          git fetch origin chatgpt/v2-healthcare-original-photos
          git checkout chatgpt/v2-healthcare-original-photos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp /tmp/sensor.webp projects/HEALTH_CHECK_PROJECT/assets/images/sensor.webp
          git add projects/HEALTH_CHECK_PROJECT/assets/images/sensor.webp
          git commit -m "fix: replace healthcare sensor photo"

          cp /tmp/gui.webp projects/HEALTH_CHECK_PROJECT/assets/images/gui.webp
          git add projects/HEALTH_CHECK_PROJECT/assets/images/gui.webp
          git commit -m "fix: replace healthcare GUI photo"

          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 6
          test "$(git rev-list --count origin/main..HEAD)" -eq 6
          git push origin HEAD:chatgpt/v2-healthcare-original-photos
