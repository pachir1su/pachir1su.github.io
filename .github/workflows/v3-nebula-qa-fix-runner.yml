name: v3 nebula browser QA

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  browser-qa:
    if: github.head_ref == 'agent/v3-nebula-qa-fixes-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          ref: agent/v3-nebula-qa-fixes-runner
          path: runner
          fetch-depth: 1

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/v3-nebula-qa-fixes
          path: target
          fetch-depth: 1

      - name: Verify target head
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "c003faaf0f41801f9562e7dad861a96112c9f34a"
          node --check docs/v3-constellation-prototypes/nebula.js
          node --check tools/render-nebula-audio.js
          node --check build.js
          node --check script.js
          node tools/verify-build.js

      - name: Install temporary Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nebula-qa
          cd /tmp/nebula-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=/tmp/nebula-qa/node_modules" >> "$GITHUB_ENV"

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory target >/tmp/nebula-http.log 2>&1 &
          echo $! >/tmp/nebula-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/docs/v3-constellation-prototypes/nebula-transit.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nebula-http.log
          exit 1

      - name: Run browser QA
        shell: bash
        env:
          QA_OUT: qa-artifacts
        run: |
          set -euo pipefail
          NODE_PATH="$NODE_PATH" CHROME_PATH="$CHROME_PATH" node runner/tools/v3-nebula-browser-qa.cjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-nebula-browser-qa
          path: qa-artifacts
          if-no-files-found: warn
