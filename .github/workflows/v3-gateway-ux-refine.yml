name: v3 gateway UX visual refine

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/v3-nebula-qa-fixes-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: agent/v3-gateway-ux
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "71b1dd528e1df5092f48331603d9b27449b96523"
          git fetch origin agent/v3-nebula-qa-fixes
          test "$(git rev-parse origin/agent/v3-nebula-qa-fixes)" = "6e5e681b057aaf60d8866b5337bda02919baffce"

      - name: Refine visual behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          p = Path('docs/v3-constellation-prototypes/nebula.css')
          s = p.read_text(encoding='utf-8')
          s = once(s,
          '''.gate-wrap {\n  position:relative; align-self:stretch; display:flex; flex-direction:column;\n  align-items:var(--gate-align,flex-start); min-width:0;\n}''',
          '''.gate-wrap {\n  position:relative; align-self:flex-start; display:flex; flex-direction:column;\n  width:var(--gate-slot-width,220px); max-width:100%;\n  align-items:var(--gate-align,flex-start); min-width:0;\n}''', 'safe slot width')
          s = once(s,
          '''.gate-mote {\n  position:absolute; left:var(--mote-left,72%); top:var(--mote-top,22%);''',
          '''.gate-mote {\n  position:absolute; left:var(--mote-left,110px); top:var(--mote-top,28px);''', 'mote pixel anchor')
          s = once(s,
          '''@media (prefers-reduced-motion: reduce) {\n  .gate { transition:none; }''',
          '''@media (max-width:768px) { .gate-wrap { --gate-slot-width:170px; } }\n\n/* v2의 전역 heading color가 시안 설명 셸의 어두운 테마를 덮지 않게 한다. */\n.gate-doc > .wrap h1, .gate-doc > .wrap h2, .gate-doc > .wrap h3 { color:var(--neb-ink); }\n\n@media (prefers-reduced-motion: reduce) {\n  .gate { transition:none; }''', 'gateway docs contrast')
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('docs/v3-constellation-prototypes/nebula.js')
          s = p.read_text(encoding='utf-8')
          old = '''    const mobile = window.matchMedia('(max-width:768px)').matches;\n    const width = Math.round((mobile ? 108 : 132) + random() * (mobile ? 42 : 50));\n    const ratio = 1.34 + random() * .28;\n    const rot = -1.4 + random() * 2.8;\n    const aligns = mobile ? ['flex-start','center'] : ['flex-start','center','flex-end'];\n    wrap.style.setProperty('--gate-align', aligns[Math.floor(random() * aligns.length)]);\n    wrap.style.marginTop = `${Math.round(8 + random() * 10)}px`;\n    gate.style.setProperty('--gate-width', `${width}px`);\n    gate.style.setProperty('--gate-ratio', ratio.toFixed(3));\n    gate.style.setProperty('--gate-rot', `${rot.toFixed(2)}deg`);\n\n    const top = [], right = [], bottom = [], left = [];\n    [3,18,34,51,69,84,97].forEach((x,i) => top.push(`${x}% ${Math.round(2 + random()*6)}%`));\n    [24,48,72,92].forEach((y) => right.push(`${Math.round(95 + random()*4)}% ${y}%`));\n    [82,65,49,31,14,3].forEach((x) => bottom.push(`${x}% ${Math.round(94 + random()*5)}%`));\n    [72,50,29,10].forEach((y) => left.push(`${Math.round(1 + random()*5)}% ${y}%`));\n    gate.style.setProperty('--tear-clip', `polygon(${[...top,...right,...bottom,...left].join(',')})`);\n\n    if (mote) {\n      const edge = Math.floor(random() * 3);\n      let left = 65 + random()*22, topPos = 18 + random()*48, dx = 8 + random()*9, dy = -(7 + random()*10);\n      if (edge === 1) { left = 86 + random()*8; topPos = 38 + random()*25; dx = 10 + random()*10; dy = -3 + random()*7; }\n      if (edge === 2) { left = 55 + random()*28; topPos = 83 + random()*8; dx = 5 + random()*9; dy = 8 + random()*10; }\n      mote.style.setProperty('--mote-left', `${left.toFixed(1)}%`);\n      mote.style.setProperty('--mote-top', `${topPos.toFixed(1)}%`);\n      mote.style.setProperty('--mote-x', `${dx.toFixed(1)}px`);\n      mote.style.setProperty('--mote-y', `${dy.toFixed(1)}px`);\n      mote.style.setProperty('--mote-duration', `${(9 + random()*5).toFixed(1)}s`);\n      mote.style.setProperty('--mote-delay', `${(1 + random()*4).toFixed(1)}s`);\n    }'''
          new = '''    const mobile = window.matchMedia('(max-width:768px)').matches;\n    const slotWidth = mobile ? 170 : 220;\n    const width = Math.round((mobile ? 106 : 128) + random() * (mobile ? 42 : 52));\n    const ratio = 1.18 + random() * .42;\n    const rot = -1.6 + random() * 3.2;\n    const aligns = mobile ? ['flex-start','center'] : ['flex-start','center','flex-end'];\n    const align = aligns[Math.floor(random() * aligns.length)];\n    wrap.style.setProperty('--gate-align', align);\n    wrap.style.setProperty('--gate-slot-width', `${slotWidth}px`);\n    wrap.style.marginTop = `${Math.round(8 + random() * 12)}px`;\n    gate.style.setProperty('--gate-width', `${width}px`);\n    gate.style.setProperty('--gate-ratio', ratio.toFixed(3));\n    gate.style.setProperty('--gate-rot', `${rot.toFixed(2)}deg`);\n\n    /* 평행한 사각 테두리가 되지 않도록 상하좌우 흔들림을 서로 다르게 준다. */\n    const top = [], right = [], bottom = [], left = [];\n    [2,14,29,46,63,80,97].forEach((x,i) => top.push(`${x}% ${Math.round(1 + random()*(i%2 ? 13 : 8))}%`));\n    [18,39,61,82,96].forEach((y,i) => right.push(`${Math.round(91 + random()*(i%2 ? 9 : 6))}% ${y}%`));\n    [86,70,53,36,19,3].forEach((x,i) => bottom.push(`${x}% ${Math.round(88 + random()*(i%2 ? 11 : 8))}%`));\n    [82,62,42,23,8].forEach((y,i) => left.push(`${Math.round(random()*(i%2 ? 10 : 6))}% ${y}%`));\n    gate.style.setProperty('--tear-clip', `polygon(${[...top,...right,...bottom,...left].join(',')})`);\n\n    if (mote) {\n      const baseX = align === 'flex-end' ? slotWidth - width : align === 'center' ? (slotWidth - width) / 2 : 0;\n      const height = width / ratio;\n      const edge = Math.floor(random() * 3);\n      let localX = .65 + random()*.22, localY = .18 + random()*.35, dx = 8 + random()*9, dy = -(7 + random()*10);\n      if (edge === 1) { localX = .88 + random()*.07; localY = .38 + random()*.25; dx = 10 + random()*10; dy = -3 + random()*7; }\n      if (edge === 2) { localX = .55 + random()*.28; localY = .88 + random()*.07; dx = 5 + random()*9; dy = 8 + random()*10; }\n      mote.style.setProperty('--mote-left', `${(baseX + width*localX).toFixed(1)}px`);\n      mote.style.setProperty('--mote-top', `${(height*localY).toFixed(1)}px`);\n      mote.style.setProperty('--mote-x', `${dx.toFixed(1)}px`);\n      mote.style.setProperty('--mote-y', `${dy.toFixed(1)}px`);\n      mote.style.setProperty('--mote-duration', `${(9 + random()*5).toFixed(1)}s`);\n      mote.style.setProperty('--mote-delay', `${(1 + random()*4).toFixed(1)}s`);\n    }'''
          s = once(s, old, new, 'random gateway refinement')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Rebuild stacked four-commit history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gateway-final/docs/v3-constellation-prototypes
          for f in nebula-gateway.html nebula-transit.html nebula.css nebula.js; do cp "docs/v3-constellation-prototypes/$f" "/tmp/gateway-final/docs/v3-constellation-prototypes/$f"; done
          git reset --hard origin/agent/v3-nebula-qa-fixes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          restore_commit() { f="$1"; m="$2"; cp "/tmp/gateway-final/$f" "$f"; git add -- "$f"; git commit -m "$m"; }
          restore_commit docs/v3-constellation-prototypes/nebula-gateway.html "feat: refine randomized constellation gateway"
          restore_commit docs/v3-constellation-prototypes/nebula-transit.html "feat: add mobile observation panel"
          restore_commit docs/v3-constellation-prototypes/nebula.css "feat: style gateway and mobile observation UX"
          restore_commit docs/v3-constellation-prototypes/nebula.js "feat: implement gateway and mobile observation behavior"
          test "$(git rev-list --count origin/agent/v3-nebula-qa-fixes..HEAD)" -eq 4
          test "$(git diff --name-only origin/agent/v3-nebula-qa-fixes...HEAD | wc -l)" -eq 4
          node --check docs/v3-constellation-prototypes/nebula.js
          node tools/verify-build.js
          git diff --check origin/agent/v3-nebula-qa-fixes...HEAD
          git push --force-with-lease origin HEAD:agent/v3-gateway-ux
