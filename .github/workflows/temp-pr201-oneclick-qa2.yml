name: TEMP PR201 one-click demo QA retry

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  qa:
    if: github.head_ref == 'tmp/pr201-oneclick-qa2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout product PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v2-one-click-demos

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static syntax check
        run: node --check assets/project-demos.js

      - name: Install Chromium runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run one-click browser QA
        run: |
          mkdir -p qa-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pr201-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > .tmp-pr201-qa.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const projects = [
            { path: 'Wall_Sina', ko: '장벽 상승 완료', en: 'Barrier raised' },
            { path: '2026_U-CAST', ko: '모든 구간 통과 완료', en: 'All channels cleared' },
            { path: 'HEALTH_CHECK_PROJECT', ko: '예시 기록 1건 저장 완료', en: 'Example log saved' },
            { path: 'BerryIno', ko: '3명 출석 처리 완료', en: '3 check-ins completed' },
            { path: 'PlantClock', ko: '급수 기록 완료', en: 'Watering logged' },
          ];
          const cases = [
            { width: 1440, height: 1000, lang: 'ko', theme: 'light', reduced: false },
            { width: 390, height: 844, lang: 'en', theme: 'dark', reduced: true },
          ];
          let passed = 0;
          const assert = (ok, message) => { if (!ok) throw new Error(message); };

          for (const project of projects) {
            for (const cfg of cases) {
              const context = await browser.newContext({
                viewport: { width: cfg.width, height: cfg.height },
                colorScheme: cfg.theme,
                reducedMotion: cfg.reduced ? 'reduce' : 'no-preference',
              });
              await context.addInitScript(({ lang, theme }) => {
                localStorage.setItem('lang', lang);
                localStorage.setItem('theme', theme);
              }, { lang: cfg.lang, theme: cfg.theme });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(String(error)));
              await page.goto(`http://127.0.0.1:4173/projects/${project.path}/#live-demo`, { waitUntil: 'networkidle' });

              const root = page.locator('[data-project-demo]');
              await root.waitFor({ state: 'visible' });
              assert(await root.locator('.demo-btn').count() === 1, `${project.path}: demo must have exactly one button`);
              assert(await root.locator('input, select, textarea').count() === 0, `${project.path}: detailed form controls remain`);
              assert(pageErrors.length === 0, `${project.path}: page error before click: ${pageErrors.join(' | ')}`);

              const expected = cfg.lang === 'en' ? project.en : project.ko;
              const button = root.locator('.demo-btn');
              await button.click();
              await page.waitForFunction(
                ({ expected }) => document.querySelector('[data-project-demo] .demo-status')?.textContent.includes(expected),
                { expected },
                { timeout: cfg.reduced ? 1500 : 5000 }
              );
              assert(!(await button.isDisabled()), `${project.path}: button stayed disabled after demo`);
              const replayLabel = cfg.lang === 'en' ? 'Run again' : '다시 실행';
              assert((await button.textContent()).includes(replayLabel), `${project.path}: replay label missing`);

              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              assert(overflow <= 1, `${project.path}: horizontal overflow ${overflow}px at ${cfg.width}`);
              const contextMenuPrevented = await page.evaluate(() => {
                const event = new MouseEvent('contextmenu', { bubbles: true, cancelable: true });
                document.body.dispatchEvent(event);
                return event.defaultPrevented;
              });
              assert(!contextMenuPrevented, `${project.path}: context menu blocked`);
              const selectable = await page.evaluate(() => {
                const target = document.querySelector('.detail-title') || document.querySelector('h1');
                if (!target) return false;
                const range = document.createRange();
                range.selectNodeContents(target);
                const selection = getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                const text = selection.toString();
                selection.removeAllRanges();
                return text.trim().length > 0;
              });
              assert(selectable, `${project.path}: text selection blocked`);

              await button.click();
              await page.waitForFunction(
                ({ expected }) => document.querySelector('[data-project-demo] .demo-status')?.textContent.includes(expected),
                { expected },
                { timeout: cfg.reduced ? 1500 : 5000 }
              );
              assert(pageErrors.length === 0, `${project.path}: page error after replay: ${pageErrors.join(' | ')}`);

              const suffix = `${project.path}-${cfg.width}-${cfg.lang}-${cfg.theme}${cfg.reduced ? '-reduced' : ''}`;
              await root.screenshot({ path: `qa-artifacts/${suffix}.png` });
              passed += 1;
              console.log(`PASS ${suffix}`);
              await context.close();
            }
          }

          console.log(`PR201 one-click demo QA: ${passed}/${projects.length * cases.length} cases passed`);
          await browser.close();
          EOF
          node .tmp-pr201-qa.mjs
          rm -f .tmp-pr201-qa.mjs package.json package-lock.json

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr201-oneclick-demo-qa-retry
          path: qa-artifacts
          retention-days: 1
