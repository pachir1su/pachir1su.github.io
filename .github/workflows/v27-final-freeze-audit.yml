name: v2.7.x Final Freeze blocker diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/v27-final-freeze-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Diagnose logo, 320px overflow, and Escape behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/koreatech-logo.png')
          print('FILE',p.exists(),p.stat().st_size if p.exists() else None)
          with Image.open(p) as im:
              print('PIL',im.format,im.size,im.mode)
              im.verify()
          with Image.open(p) as im:
              im.load()
              print('PIL_LOAD_OK',im.size)
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl -fsSI http://127.0.0.1:8000/assets/koreatech-logo.png
          python3 - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin=shutil.which('chromedriver') or shutil.which('chromium-driver')
          opts=Options(); opts.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars','--force-device-scale-factor=1']:
              opts.add_argument(a)
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(), options=opts)
          d.set_window_size(320,1000)
          base='http://127.0.0.1:8000/'

          d.get(base+'assets/koreatech-logo.png'); time.sleep(.5)
          direct=d.execute_script("const i=document.querySelector('img');return i?{complete:i.complete,w:i.naturalWidth,h:i.naturalHeight,src:i.currentSrc}:null")
          print('DIRECT_IMAGE',json.dumps(direct,ensure_ascii=False))
          print('DIRECT_LOGS',json.dumps(d.get_log('browser'),ensure_ascii=False))

          d.get(base); time.sleep(.5)
          # Force the lazy logo into view and wait.
          logo=d.find_element(By.CSS_SELECTOR,'.edu-logo')
          d.execute_script("arguments[0].scrollIntoView({block:'center'})",logo); time.sleep(1)
          logo_state=d.execute_script("const i=arguments[0],r=i.getBoundingClientRect();return {complete:i.complete,w:i.naturalWidth,h:i.naturalHeight,display:getComputedStyle(i).display,src:i.currentSrc,left:r.left,right:r.right,width:r.width}",logo)
          print('HOME_LOGO',json.dumps(logo_state,ensure_ascii=False))

          # Identify elements that really affect scrollWidth by temporarily hiding candidates.
          diag=d.execute_script('''
            window.scrollTo(0,0);
            const base=document.documentElement.scrollWidth, vw=innerWidth;
            const els=[...document.querySelectorAll('body *')];
            const describe=el=>{const r=el.getBoundingClientRect();return {tag:el.tagName.toLowerCase(),id:el.id||'',cls:typeof el.className==='string'?el.className:'',left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,100)}};
            const outside=els.filter(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return r.width>0&&r.height>0&&cs.position!=='fixed'&&(r.left<-1||r.right>vw+1)}).map(describe).slice(0,50);
            const causal=[];
            for(const el of els){
              const old=el.style.getPropertyValue('display'),pri=el.style.getPropertyPriority('display');
              el.style.setProperty('display','none','important');
              const after=document.documentElement.scrollWidth;
              if(after<base) causal.push({...describe(el),after,delta:base-after});
              if(old) el.style.setProperty('display',old,pri); else el.style.removeProperty('display');
            }
            causal.sort((a,b)=>b.delta-a.delta);
            return {vw,base,outside,causal:causal.slice(0,30)};
          ''')
          print('OVERFLOW',json.dumps(diag,ensure_ascii=False,indent=2))

          # Test Escape with a real WebDriver key, not a synthetic untrusted KeyboardEvent.
          d.execute_script('window.scrollTo(0,0)')
          hb=d.find_element(By.ID,'hamburger'); hb.click(); time.sleep(.2)
          before=d.execute_script("return {open:mobileMenu.classList.contains('open'),aria:hamburger.getAttribute('aria-expanded')} ")
          d.find_element(By.TAG_NAME,'body').send_keys(Keys.ESCAPE); time.sleep(.2)
          after=d.execute_script("return {open:mobileMenu.classList.contains('open'),aria:hamburger.getAttribute('aria-expanded')} ")
          print('ESCAPE',json.dumps({'before':before,'after':after},ensure_ascii=False))
          print('HOME_LOGS',json.dumps(d.get_log('browser'),ensure_ascii=False))
          d.quit()
          PY
