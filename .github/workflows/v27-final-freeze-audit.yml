name: v2.7.x Final Freeze independent validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/v27-final-freeze-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v27-final-freeze
          fetch-depth: 0

      - name: Static and build gates
        shell: bash
        run: |
          set -euo pipefail
          expected_base='306f1d9c1fc07c0f8f6035d0706d25cb495c0eec'
          test "$(git merge-base HEAD "$expected_base")" = "$expected_base"
          test "$(git rev-list --count "$expected_base"..HEAD)" -eq 4
          test "$(git diff --name-only "$expected_base"..HEAD | wc -l)" -eq 4
          node --check script.js
          node --check tools/verify-build.js
          cp index.html /tmp/index.before
          node build.js
          cmp /tmp/index.before index.html
          node tools/verify-build.js
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Install temporary QA tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v27qa
          cd /tmp/v27qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 lighthouse@12.8.2 >/dev/null
          command -v google-chrome
          google-chrome --version

      - name: Serve Final Freeze branch
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v27qa/http.log 2>&1 &
          echo $! >/tmp/v27qa/http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v27qa/http.log
          exit 1

      - name: Run 189-case responsive and interaction QA
        shell: bash
        env:
          NODE_PATH: /tmp/v27qa/node_modules
        run: |
          cat >/tmp/v27qa/qa.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const root = process.cwd();
          const widths = [320, 360, 390, 768, 1024, 1280, 1440];
          const failures = [];
          const pageErrors = [];
          const consoleErrors = [];
          const cases = [];
          const representative = new Set([
            'index.html@320', 'index.html@768', 'index.html@1440'
          ]);

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(p));
              else if (entry.isFile() && entry.name === 'index.html') out.push(p);
            }
            return out;
          }

          const detailFiles = walk(path.join(root, 'projects'))
            .filter((file) => fs.readFileSync(file, 'utf8').includes('detail-body'))
            .map((file) => path.relative(root, file).replaceAll(path.sep, '/'))
            .sort();
          const files = ['index.html', ...detailFiles];
          if (files.length !== 27) failures.push(`expected 27 pages, found ${files.length}`);

          (async () => {
            const browser = await chromium.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });

            for (const width of widths) {
              const context = await browser.newContext({
                viewport: { width, height: width <= 390 ? 844 : 1000 },
                colorScheme: 'light'
              });
              for (const file of files) {
                const page = await context.newPage();
                const key = `${file}@${width}`;
                const url = `http://127.0.0.1:4173/${file === 'index.html' ? '' : file}`;
                page.on('pageerror', (error) => pageErrors.push(`${key}: ${error.message}`));
                page.on('console', (msg) => {
                  if (msg.type() === 'error') consoleErrors.push(`${key}: ${msg.text()}`);
                });
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 20000 });
                await page.evaluate(() => {
                  localStorage.removeItem('lang');
                  localStorage.removeItem('theme');
                  document.querySelectorAll('img[loading="lazy"]').forEach((img) => { img.loading = 'eager'; });
                });
                await page.waitForTimeout(250);
                await page.evaluate(async () => {
                  const max = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
                  const step = Math.max(500, window.innerHeight * 0.8);
                  for (let y = 0; y < max; y += step) {
                    window.scrollTo(0, y);
                    await new Promise((resolve) => setTimeout(resolve, 15));
                  }
                  window.scrollTo(0, 0);
                  await new Promise((resolve) => setTimeout(resolve, 100));
                });

                const result = await page.evaluate(() => {
                  const viewport = window.innerWidth;
                  const docWidth = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth);
                  const brokenImages = [...document.images]
                    .filter((img) => img.complete && img.naturalWidth === 0 && !img.src.startsWith('data:'))
                    .map((img) => img.currentSrc || img.src);
                  const mediaOverflow = [...document.querySelectorAll('img, video, iframe, figure')]
                    .filter((el) => {
                      const style = getComputedStyle(el);
                      if (style.display === 'none' || style.visibility === 'hidden') return false;
                      const r = el.getBoundingClientRect();
                      if (r.width === 0 || r.height === 0) return false;
                      return r.left < -1 || r.right > viewport + 1;
                    })
                    .map((el) => `${el.tagName.toLowerCase()}.${el.className || ''}`.slice(0, 160));
                  const icon = document.querySelector('link[rel~="icon"]')?.href || '';
                  return {
                    docWidth,
                    viewport,
                    brokenImages,
                    mediaOverflow,
                    faviconOk: /\/assets\/favicon\.svg(?:[?#]|$)/.test(icon),
                    contextMenuBlocked: typeof document.oncontextmenu === 'function',
                    selectBlocked: typeof document.onselectstart === 'function' || getComputedStyle(document.body).userSelect === 'none',
                    domNodes: document.getElementsByTagName('*').length,
                    resourceCount: performance.getEntriesByType('resource').length,
                    decodedBytes: performance.getEntriesByType('resource').reduce((sum, e) => sum + (e.decodedBodySize || 0), 0)
                  };
                });

                if (result.docWidth > result.viewport + 1) failures.push(`${key}: horizontal overflow ${result.docWidth} > ${result.viewport}`);
                if (result.brokenImages.length) failures.push(`${key}: broken images ${result.brokenImages.join(', ')}`);
                if (result.mediaOverflow.length) failures.push(`${key}: media overflow ${result.mediaOverflow.join(', ')}`);
                if (!result.faviconOk) failures.push(`${key}: favicon mismatch`);
                if (result.contextMenuBlocked) failures.push(`${key}: context menu blocked`);
                if (result.selectBlocked) failures.push(`${key}: text selection blocked`);

                if (file === 'index.html' && width === 320) {
                  const hamburger = page.locator('#hamburger');
                  const menu = page.locator('#mobileMenu');
                  await hamburger.click();
                  if (!(await menu.evaluate((el) => el.classList.contains('open')))) failures.push('index@320: mobile menu did not open');
                  if ((await hamburger.getAttribute('aria-expanded')) !== 'true') failures.push('index@320: hamburger aria-expanded did not become true');
                  await page.keyboard.press('Escape');
                  if (await menu.evaluate((el) => el.classList.contains('open'))) failures.push('index@320: Escape did not close mobile menu');
                  if ((await hamburger.getAttribute('aria-expanded')) !== 'false') failures.push('index@320: hamburger aria-expanded did not reset');
                }

                if (file === 'index.html' && width === 390) {
                  await page.locator('#langToggle').click();
                  if ((await page.locator('html').getAttribute('lang')) !== 'en') failures.push('index@390: language toggle did not switch to EN');
                  if ((await page.evaluate(() => localStorage.getItem('lang'))) !== 'en') failures.push('index@390: EN preference not persisted');
                  await page.reload({ waitUntil: 'domcontentloaded' });
                  if ((await page.locator('html').getAttribute('lang')) !== 'en') failures.push('index@390: EN preference lost after reload');
                  await page.locator('#themeToggle').click();
                  const theme = await page.locator('html').getAttribute('data-theme');
                  if (!['light', 'dark'].includes(theme)) failures.push('index@390: theme toggle produced invalid state');
                  if ((await page.evaluate(() => localStorage.getItem('theme'))) !== theme) failures.push('index@390: theme preference not persisted');
                }

                if (representative.has(key)) {
                  await page.screenshot({ path: `/tmp/v27qa/${key.replaceAll('/', '_').replace('@', '-')}.png`, fullPage: true });
                }
                cases.push({ key, ...result });
                await page.close();
              }
              await context.close();
            }

            for (const mode of [
              { name: 'dark', colorScheme: 'dark', reducedMotion: 'no-preference', hasTouch: false },
              { name: 'reduced-motion', colorScheme: 'light', reducedMotion: 'reduce', hasTouch: false },
              { name: 'coarse-pointer', colorScheme: 'light', reducedMotion: 'no-preference', hasTouch: true }
            ]) {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                colorScheme: mode.colorScheme,
                reducedMotion: mode.reducedMotion,
                hasTouch: mode.hasTouch,
                isMobile: mode.hasTouch
              });
              const page = await context.newPage();
              let localError = null;
              page.on('pageerror', (error) => { localError = error.message; });
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 20000 });
              await page.waitForTimeout(250);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              if (overflow > 1) failures.push(`${mode.name}: main horizontal overflow +${overflow}px`);
              if (localError) failures.push(`${mode.name}: pageerror ${localError}`);
              await context.close();
            }

            await browser.close();
            if (pageErrors.length) failures.push(...pageErrors.map((v) => `pageerror ${v}`));
            const severeConsole = consoleErrors.filter((v) => !/favicon|Failed to load resource.*404/i.test(v));
            if (severeConsole.length) failures.push(...severeConsole.map((v) => `console ${v}`));

            const summary = {
              pageCount: files.length,
              detailPageCount: detailFiles.length,
              widths,
              caseCount: files.length * widths.length,
              failures,
              pageErrors,
              consoleErrors,
              cases
            };
            fs.writeFileSync('/tmp/v27qa/results.json', JSON.stringify(summary, null, 2));
            console.log(`pages=${files.length} details=${detailFiles.length} cases=${summary.caseCount} failures=${failures.length}`);
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/v27qa/qa.cjs

      - name: Run Lighthouse mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          LH=/tmp/v27qa/node_modules/.bin/lighthouse
          "$LH" http://127.0.0.1:4173/ \
            --quiet \
            --chrome-path=/usr/bin/google-chrome \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --output=json --output=html \
            --output-path=/tmp/v27qa/lighthouse-mobile
          "$LH" http://127.0.0.1:4173/ \
            --quiet \
            --preset=desktop \
            --chrome-path=/usr/bin/google-chrome \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --output=json --output=html \
            --output-path=/tmp/v27qa/lighthouse-desktop
          node <<'NODE'
          const fs=require('fs');
          for (const kind of ['mobile','desktop']) {
            const r=JSON.parse(fs.readFileSync(`/tmp/v27qa/lighthouse-${kind}.report.json`,'utf8'));
            const c=r.categories;
            const a=r.audits;
            const row={
              kind,
              performance:Math.round(c.performance.score*100),
              accessibility:Math.round(c.accessibility.score*100),
              bestPractices:Math.round(c['best-practices'].score*100),
              seo:Math.round(c.seo.score*100),
              fcp:a['first-contentful-paint'].displayValue,
              lcp:a['largest-contentful-paint'].displayValue,
              tbt:a['total-blocking-time'].displayValue,
              cls:a['cumulative-layout-shift'].displayValue,
              transfer:a['total-byte-weight'].displayValue
            };
            console.log(JSON.stringify(row));
            fs.appendFileSync('/tmp/v27qa/lighthouse-summary.jsonl', JSON.stringify(row)+'\n');
          }
          NODE

      - name: Record Final Freeze branch atomicity and network snapshot
        shell: bash
        run: |
          set -euo pipefail
          base='306f1d9c1fc07c0f8f6035d0706d25cb495c0eec'
          {
            echo '## commits'
            git log --oneline "$base"..HEAD
            echo
            echo '## diff stat'
            git diff --stat "$base"..HEAD
            echo
            echo '## changed files'
            git diff --name-only "$base"..HEAD
            echo
            echo '## responsive summary'
            node -e "const r=require('/tmp/v27qa/results.json'); console.log(JSON.stringify({pages:r.pageCount,details:r.detailPageCount,widths:r.widths,cases:r.caseCount,failures:r.failures.length},null,2))"
            echo
            echo '## lighthouse'
            cat /tmp/v27qa/lighthouse-summary.jsonl
          } | tee /tmp/v27qa/final-freeze-summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-final-freeze-independent-validation
          path: |
            /tmp/v27qa/results.json
            /tmp/v27qa/final-freeze-summary.txt
            /tmp/v27qa/lighthouse-summary.jsonl
            /tmp/v27qa/lighthouse-mobile.report.json
            /tmp/v27qa/lighthouse-mobile.report.html
            /tmp/v27qa/lighthouse-desktop.report.json
            /tmp/v27qa/lighthouse-desktop.report.html
            /tmp/v27qa/*.png
          if-no-files-found: warn
