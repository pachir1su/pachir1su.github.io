name: v2.7.x Final Freeze audit

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/v27-final-freeze-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v27-final-freeze-validation
          fetch-depth: 0

      - name: Structural and release-state audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git rev-parse --verify refs/tags/v2.7.0
          node --check script.js
          cp index.html /tmp/index.before
          node build.js
          cmp /tmp/index.before index.html
          node tools/verify-build.js
          git diff --check

          # Freeze에서 제거하기로 한 사용자-facing 구형 런타임 구조가 실제 코드로 돌아오지 않았는지 확인한다.
          ! grep -n 'id="mbti-section"' index.html
          ! grep -n 'id="sectionNav"' index.html
          ! grep -n 'normalizeV26Markup' script.js
          ! grep -n 'v26-runtime-layout' script.js
          ! grep -n 'floating-icons' index.html
          ! grep -n 'chicken-drop' style.css

          mkdir -p /tmp/v27-freeze-audit
          {
            echo '# Core deployed file sizes'
            wc -c index.html style.css script.js projects.json assets/favicon.svg 2>/dev/null || true
            echo
            echo '# Project media total'
            find projects -type f \( -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.mp4' -o -iname '*.webm' \) -printf '%s %p\n' | sort -nr
            echo
            echo '# Largest deployed files (top 30)'
            find . -path './.git' -prune -o -path './docs' -prune -o -type f -printf '%s %p\n' | sort -nr | head -30
          } > /tmp/v27-freeze-audit/size-report.txt

      - name: Browser QA across seven viewport widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium pillow
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          mkdir -p /tmp/v27-freeze-audit/screenshots

          python3 - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By

          details=[]
          for p in sorted(Path('projects').glob('*/index.html')):
              text=p.read_text(encoding='utf-8',errors='replace')
              if 'class="detail-body"' in text:
                  details.append((p.parent.name,p.parent.as_posix()+'/'))
          if len(details) != 26:
              raise SystemExit(f'Expected 26 detail pages, got {len(details)}')

          pages=[('home','')] + details
          widths=(320,360,390,768,1024,1280,1440)
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin=shutil.which('chromedriver') or shutil.which('chromium-driver')
          if not chrome:
              raise SystemExit('Chrome unavailable')
          opts=Options(); opts.binary_location=chrome
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars','--force-device-scale-factor=1','--lang=ko-KR']:
              opts.add_argument(arg)
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(), options=opts)
          d.set_page_load_timeout(35)
          base='http://127.0.0.1:8000/'
          results=[]; failures=[]; console_errors=[]

          def settle(path,width):
              d.set_window_size(width,1000)
              d.get(base+path)
              deadline=time.time()+12
              while time.time()<deadline:
                  h=int(d.execute_script('return Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)'))
                  for y in range(0,h+1,650):
                      d.execute_script('window.scrollTo(0,arguments[0])',y)
                      time.sleep(.02)
                  local_ok=d.execute_script('''
                    return [...document.images]
                      .filter(i=>{const s=i.getAttribute('src')||''; return s && !/^https?:|^data:/.test(s);})
                      .every(i=>i.complete && i.naturalWidth>0)
                  ''')
                  if document_ready := d.execute_script("return document.readyState === 'complete'"):
                      if local_ok: break
                  time.sleep(.12)
              d.execute_script('window.scrollTo(0,0)'); time.sleep(.18)

          for name,path in pages:
              for width in widths:
                  settle(path,width)
                  m=d.execute_script('''
                    const localImgs=[...document.images].filter(i=>{
                      const s=i.getAttribute('src')||''; return s && !/^https?:|^data:/.test(s);
                    });
                    const figs=[...document.querySelectorAll('.detail-gallery .detail-figure')];
                    return {
                      viewport:innerWidth,
                      scrollWidth:document.documentElement.scrollWidth,
                      scrollHeight:document.documentElement.scrollHeight,
                      localBroken:localImgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),
                      figureOverflow:figs.filter(f=>{const r=f.getBoundingClientRect();return r.left<-1||r.right>innerWidth+1;}).length,
                      favicon:document.querySelector('link[rel~=icon]')?.getAttribute('href')||'',
                      navVisible:!!document.querySelector('.navbar'),
                      readyState:document.readyState
                    };
                  ''')
                  errors=[]
                  if m['scrollWidth'] > width+1: errors.append('horizontal overflow')
                  if m['localBroken']: errors.append('broken local image')
                  if m['figureOverflow']: errors.append('gallery overflow')
                  if m['favicon'] != '/assets/favicon.svg': errors.append('favicon mismatch')
                  row={'page':name,'width':width,**m}
                  results.append(row)
                  if errors: failures.append({'errors':errors,**row})
                  for log in d.get_log('browser'):
                      if log.get('level') == 'SEVERE' and 'favicon' not in log.get('message','').lower():
                          console_errors.append({'page':name,'width':width,'message':log.get('message','')[:1000]})

              if name in {'home','2024_5th_CSRC','koreatechGongjiAgent','MultiMind','github_rank_insight'}:
                  for width in (320,390,1280):
                      settle(path,width)
                      h=min(int(d.execute_script('return document.documentElement.scrollHeight')),8000)
                      d.set_window_size(width,max(1200,h)); time.sleep(.15)
                      d.save_screenshot(f'/tmp/v27-freeze-audit/screenshots/{name}-{width}.png')

          # Main interaction smoke tests
          d.set_window_size(1280,1000); d.get(base); time.sleep(.35)
          d.execute_script("localStorage.clear()")
          d.refresh(); time.sleep(.35)
          before_lang=d.execute_script('return document.documentElement.lang')
          d.find_element(By.ID,'langToggle').click(); time.sleep(.15)
          after_lang=d.execute_script('return document.documentElement.lang')
          if before_lang == after_lang or after_lang != 'en':
              failures.append({'errors':['desktop language toggle failed'],'before':before_lang,'after':after_lang})
          before_theme=d.execute_script("return document.documentElement.dataset.theme || ''")
          d.find_element(By.ID,'themeToggle').click(); time.sleep(.15)
          after_theme=d.execute_script("return document.documentElement.dataset.theme || ''")
          if before_theme == after_theme:
              failures.append({'errors':['desktop theme toggle failed'],'before':before_theme,'after':after_theme})

          d.set_window_size(390,1000); d.get(base); time.sleep(.35)
          hb=d.find_element(By.ID,'hamburger'); hb.click(); time.sleep(.15)
          mobile_open=d.execute_script("return document.getElementById('mobileMenu').classList.contains('open') && document.getElementById('hamburger').getAttribute('aria-expanded')==='true'")
          if not mobile_open: failures.append({'errors':['mobile menu open failed']})
          d.execute_script("document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}))"); time.sleep(.15)
          mobile_closed=d.execute_script("return !document.getElementById('mobileMenu').classList.contains('open')")
          if not mobile_closed: failures.append({'errors':['mobile menu escape close failed']})

          # prefers-reduced-motion should be observed by the app at load time.
          d.execute_cdp_cmd('Emulation.setEmulatedMedia', {'features':[{'name':'prefers-reduced-motion','value':'reduce'}]})
          d.get(base); time.sleep(.35)
          reduced=d.execute_script("return matchMedia('(prefers-reduced-motion: reduce)').matches")
          typing=d.execute_script("return document.getElementById('typing-text')?.textContent || ''")
          if not reduced or not typing:
              failures.append({'errors':['reduced-motion smoke failed'],'reduced':reduced,'typing':typing})
          d.execute_cdp_cmd('Emulation.setEmulatedMedia', {'features':[]})

          # Performance/navigation samples for main page at representative device widths.
          perf=[]
          for width in (390,768,1280):
              d.set_window_size(width,1000)
              d.get(base); time.sleep(.8)
              perf.append(d.execute_script('''
                const n=performance.getEntriesByType('navigation')[0];
                const rs=performance.getEntriesByType('resource');
                return {
                  width:innerWidth,
                  domContentLoaded:n?Math.round(n.domContentLoadedEventEnd):null,
                  loadEvent:n?Math.round(n.loadEventEnd):null,
                  resources:rs.length,
                  transferSize:Math.round(rs.reduce((s,r)=>s+(r.transferSize||0),0)),
                  decodedBodySize:Math.round(rs.reduce((s,r)=>s+(r.decodedBodySize||0),0)),
                  domNodes:document.getElementsByTagName('*').length
                };
              '''))

          d.quit()
          Path('/tmp/v27-freeze-audit/browser-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/v27-freeze-audit/failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/v27-freeze-audit/console-errors.json').write_text(json.dumps(console_errors,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/v27-freeze-audit/performance.json').write_text(json.dumps(perf,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PAGES',len(pages),'RESPONSIVE_CHECKS',len(results))
          print('PERF',json.dumps(perf,ensure_ascii=False))
          print('CONSOLE_SEVERE_COUNT',len(console_errors))
          if failures:
              print(json.dumps(failures,ensure_ascii=False,indent=2))
              raise SystemExit(f'{len(failures)} QA failures')
          print('FINAL_FREEZE_BROWSER_QA_OK')
          PY

      - name: Lighthouse main-page sample
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8001 --bind 127.0.0.1 >/tmp/lh-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8001/ --quiet --chrome-flags='--headless=new --no-sandbox' --output=json --output-path=/tmp/v27-freeze-audit/lighthouse-mobile.json
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8001/ --quiet --preset=desktop --chrome-flags='--headless=new --no-sandbox' --output=json --output-path=/tmp/v27-freeze-audit/lighthouse-desktop.json
          node - <<'NODE'
          const fs=require('fs');
          for(const mode of ['mobile','desktop']){
            const p=`/tmp/v27-freeze-audit/lighthouse-${mode}.json`;
            if(!fs.existsSync(p)) continue;
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            const c=r.categories||{};
            console.log(mode, Object.fromEntries(Object.entries(c).map(([k,v])=>[k,v.score])));
          }
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-final-freeze-audit
          path: /tmp/v27-freeze-audit
          retention-days: 5
