name: v2.7.x Final Freeze independent validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/v27-final-freeze-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v27-final-freeze
          fetch-depth: 0

      - name: Structural and atomicity validation
        shell: bash
        run: |
          set -euo pipefail
          expected_base='306f1d9c1fc07c0f8f6035d0706d25cb495c0eec'
          expected_head='19ab5a3b7c0cf4ef664b9c241b72693f8e94a12d'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git rev-list --count "$expected_base"..HEAD)" -eq 4
          test "$(git diff --name-only "$expected_base"..HEAD | wc -l)" -eq 4
          test "$(git diff --name-only "$expected_base"..HEAD | sort | tr '\n' ' ')" = 'README.md script.js style.css tools/verify-build.js '
          node --check script.js
          node --check tools/verify-build.js
          cp index.html /tmp/index.before
          node build.js
          cmp /tmp/index.before index.html
          node tools/verify-build.js
          git diff --check
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/v27-final-validation/screenshots
          git diff --stat "$expected_base"..HEAD > /tmp/v27-final-validation/diff-stat.txt
          git log --oneline "$expected_base"..HEAD > /tmp/v27-final-validation/commits.txt

      - name: Browser QA — 27 pages x 7 widths and interactions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/v27-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          python3 - <<'PY'
          import json
          import shutil
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          out=Path('/tmp/v27-final-validation')
          shots=out/'screenshots'
          shots.mkdir(parents=True,exist_ok=True)

          details=[]
          for p in sorted(Path('projects').glob('*/index.html')):
              text=p.read_text(encoding='utf-8',errors='replace')
              if 'class="detail-body"' in text:
                  details.append((p.parent.name,p.parent.as_posix()+'/'))
          if len(details)!=26:
              raise SystemExit(f'Expected 26 detail pages, got {len(details)}')

          pages=[('home','')]+details
          widths=(320,360,390,768,1024,1280,1440)
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin=shutil.which('chromedriver') or shutil.which('chromium-driver')
          if not chrome:
              raise SystemExit('Chrome unavailable')

          opts=Options()
          opts.binary_location=chrome
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--hide-scrollbars','--force-device-scale-factor=1','--lang=ko-KR']:
              opts.add_argument(arg)
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(),options=opts)
          d.set_page_load_timeout(40)
          base='http://127.0.0.1:8000/'
          results=[]
          failures=[]
          console_severe=[]
          third_party_severe=[]

          def force_local_images():
              imgs=d.find_elements(By.CSS_SELECTOR,'img[src]')
              for img in imgs:
                  raw=d.execute_script("return arguments[0].getAttribute('src') || ''",img)
                  if not raw or raw.startswith(('http://','https://','data:','/')):
                      continue
                  try:
                      d.execute_script("arguments[0].scrollIntoView({block:'center',inline:'nearest'})",img)
                      deadline=time.time()+4
                      while time.time()<deadline:
                          state=d.execute_script("return {complete:arguments[0].complete,w:arguments[0].naturalWidth}",img)
                          if state['complete'] and state['w']>0:
                              break
                          time.sleep(.05)
                  except Exception:
                      pass

          def settle(path,width):
              d.set_window_size(width,1000)
              d.get(base+path)
              deadline=time.time()+10
              while time.time()<deadline and d.execute_script('return document.readyState')!='complete':
                  time.sleep(.05)
              force_local_images()
              d.execute_script('window.scrollTo(0,0)')
              time.sleep(.12)

          for name,path in pages:
              for width in widths:
                  settle(path,width)
                  m=d.execute_script('''
                    const local=[...document.images].filter(i=>{
                      const s=i.getAttribute('src')||'';
                      return s && !/^https?:|^data:|^\//.test(s);
                    });
                    const figs=[...document.querySelectorAll('.detail-gallery .detail-figure')];
                    return {
                      viewport:innerWidth,
                      scrollWidth:document.documentElement.scrollWidth,
                      scrollHeight:document.documentElement.scrollHeight,
                      localBroken:local.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),
                      figureOverflow:figs.filter(f=>{const r=f.getBoundingClientRect();return r.left<-1||r.right>innerWidth+1;}).length,
                      favicon:document.querySelector('link[rel~=icon]')?.getAttribute('href')||'',
                      readyState:document.readyState
                    };
                  ''')
                  errors=[]
                  if m['scrollWidth']>width+1: errors.append('horizontal overflow')
                  if m['localBroken']: errors.append('broken local image')
                  if m['figureOverflow']: errors.append('gallery overflow')
                  if m['favicon']!='/assets/favicon.svg': errors.append('favicon mismatch')
                  row={'page':name,'width':width,**m}
                  results.append(row)
                  if errors:
                      failures.append({'errors':errors,**row})

                  for log in d.get_log('browser'):
                      if log.get('level')!='SEVERE':
                          continue
                      msg=log.get('message','')[:1200]
                      rec={'page':name,'width':width,'message':msg}
                      if '127.0.0.1:8000' in msg or 'Uncaught' in msg or 'javascript' in msg.lower():
                          console_severe.append(rec)
                      else:
                          third_party_severe.append(rec)

              if name in {'home','2024_5th_CSRC','koreatechGongjiAgent','MultiMind','github_rank_insight'}:
                  for width in (320,390,1280):
                      settle(path,width)
                      d.save_screenshot(str(shots/f'{name}-{width}-top.png'))
                      d.execute_script('window.scrollTo(0,document.documentElement.scrollHeight)')
                      time.sleep(.15)
                      d.save_screenshot(str(shots/f'{name}-{width}-bottom.png'))

          if len(results)!=189:
              failures.append({'errors':['responsive check count mismatch'],'actual':len(results),'expected':189})

          # 320px regression must be fully gone on the main page.
          home320=next((r for r in results if r['page']=='home' and r['width']==320),None)
          if not home320 or home320['scrollWidth']>321:
              failures.append({'errors':['320px footer overflow regression'],'row':home320})

          # Desktop KO/EN and theme toggles.
          d.set_window_size(1280,1000)
          d.get(base)
          d.execute_script('localStorage.clear()')
          d.refresh(); time.sleep(.3)
          before_lang=d.execute_script('return document.documentElement.lang')
          d.find_element(By.ID,'langToggle').click(); time.sleep(.15)
          after_lang=d.execute_script('return document.documentElement.lang')
          if before_lang==after_lang or after_lang!='en':
              failures.append({'errors':['desktop language toggle failed'],'before':before_lang,'after':after_lang})
          before_theme=d.execute_script("return document.documentElement.dataset.theme || ''")
          d.find_element(By.ID,'themeToggle').click(); time.sleep(.15)
          after_theme=d.execute_script("return document.documentElement.dataset.theme || ''")
          if before_theme==after_theme:
              failures.append({'errors':['desktop theme toggle failed'],'before':before_theme,'after':after_theme})

          # Mobile menu with a real Escape key.
          d.set_window_size(390,1000)
          d.get(base); time.sleep(.3)
          hb=d.find_element(By.ID,'hamburger')
          hb.click(); time.sleep(.15)
          opened=d.execute_script("return mobileMenu.classList.contains('open') && hamburger.getAttribute('aria-expanded')==='true'")
          if not opened:
              failures.append({'errors':['mobile menu open failed']})
          d.find_element(By.TAG_NAME,'body').send_keys(Keys.ESCAPE); time.sleep(.15)
          closed=d.execute_script("return !mobileMenu.classList.contains('open') && hamburger.getAttribute('aria-expanded')==='false'")
          if not closed:
              failures.append({'errors':['mobile menu real Escape close failed']})

          # Reduced motion is observed at load and typing remains readable.
          d.execute_cdp_cmd('Emulation.setEmulatedMedia',{'features':[{'name':'prefers-reduced-motion','value':'reduce'}]})
          d.get(base); time.sleep(.3)
          reduced=d.execute_script("return matchMedia('(prefers-reduced-motion: reduce)').matches")
          typing=d.execute_script("return document.getElementById('typing-text')?.textContent || ''")
          if not reduced or not typing:
              failures.append({'errors':['reduced-motion smoke failed'],'reduced':reduced,'typing':typing})
          d.execute_cdp_cmd('Emulation.setEmulatedMedia',{'features':[]})

          # Coarse/mobile input: fine-pointer-only card shadow behavior must not be active.
          d.execute_cdp_cmd('Emulation.setDeviceMetricsOverride',{'mobile':True,'width':390,'height':844,'deviceScaleFactor':1})
          d.execute_cdp_cmd('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          d.get(base); time.sleep(.3)
          fine=d.execute_script("return matchMedia('(hover: hover) and (pointer: fine)').matches")
          if fine:
              failures.append({'errors':['coarse-pointer emulation still reports fine pointer']})
          d.execute_cdp_cmd('Emulation.setTouchEmulationEnabled',{'enabled':False})
          d.execute_cdp_cmd('Emulation.clearDeviceMetricsOverride',{})

          # Non-throttled local navigation samples for trend/reference only.
          perf=[]
          for width in (390,768,1280):
              d.set_window_size(width,1000)
              d.get(base); time.sleep(.7)
              perf.append(d.execute_script('''
                const n=performance.getEntriesByType('navigation')[0];
                const rs=performance.getEntriesByType('resource');
                return {
                  width:innerWidth,
                  domContentLoaded:n?Math.round(n.domContentLoadedEventEnd):null,
                  loadEvent:n?Math.round(n.loadEventEnd):null,
                  resources:rs.length,
                  transferSize:Math.round(rs.reduce((s,r)=>s+(r.transferSize||0),0)),
                  decodedBodySize:Math.round(rs.reduce((s,r)=>s+(r.decodedBodySize||0),0)),
                  domNodes:document.getElementsByTagName('*').length
                };
              '''))

          d.quit()
          (out/'browser-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'browser-failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'console-severe.json').write_text(json.dumps(console_severe,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'third-party-severe.json').write_text(json.dumps(third_party_severe,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'performance.json').write_text(json.dumps(perf,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PAGES',len(pages),'RESPONSIVE_CHECKS',len(results))
          print('HOME_320',json.dumps(home320,ensure_ascii=False))
          print('PERFORMANCE',json.dumps(perf,ensure_ascii=False))
          print('LOCAL_CONSOLE_SEVERE',len(console_severe),'THIRD_PARTY_SEVERE',len(third_party_severe))
          if console_severe:
              failures.append({'errors':['local/javascript severe console errors'],'items':console_severe})
          if failures:
              print(json.dumps(failures,ensure_ascii=False,indent=2))
              raise SystemExit(f'{len(failures)} validation failures')
          print('FINAL_FREEZE_BROWSER_QA_OK')
          PY

      - name: Lighthouse mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8001 --bind 127.0.0.1 >/tmp/v27-lighthouse-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8001/ --quiet --chrome-flags='--headless=new --no-sandbox' --output=json --output-path=/tmp/v27-final-validation/lighthouse-mobile.json
          npx --yes lighthouse@12.2.1 http://127.0.0.1:8001/ --quiet --preset=desktop --chrome-flags='--headless=new --no-sandbox' --output=json --output-path=/tmp/v27-final-validation/lighthouse-desktop.json
          node - <<'NODE'
          const fs=require('fs');
          const summary={};
          for(const mode of ['mobile','desktop']){
            const report=JSON.parse(fs.readFileSync(`/tmp/v27-final-validation/lighthouse-${mode}.json`,'utf8'));
            const c=report.categories;
            const a=report.audits;
            summary[mode]={
              performance:c.performance.score,
              accessibility:c.accessibility.score,
              bestPractices:c['best-practices'].score,
              seo:c.seo.score,
              fcp:a['first-contentful-paint'].numericValue,
              lcp:a['largest-contentful-paint'].numericValue,
              cls:a['cumulative-layout-shift'].numericValue,
              tbt:a['total-blocking-time'].numericValue,
              speedIndex:a['speed-index'].numericValue
            };
          }
          fs.writeFileSync('/tmp/v27-final-validation/lighthouse-summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-final-freeze-independent-validation
          path: /tmp/v27-final-validation
          retention-days: 5
