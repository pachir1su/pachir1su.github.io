name: v2.7.x narrow footer diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/v27-final-freeze-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v27-final-freeze

      - name: Verify min-width root cause at 320px
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/v27-diag-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          python3 - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin=shutil.which('chromedriver') or shutil.which('chromium-driver')
          opts=Options(); opts.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--force-device-scale-factor=1']:
              opts.add_argument(a)
          d=webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(),options=opts)
          d.set_window_size(320,1000)
          d.get('http://127.0.0.1:8000/'); time.sleep(.5)
          before=d.execute_script('''
            const sels=['.footer','.footer-inner','.social-links','.contact-email','.email-addr','.copy-hint'];
            const rows={};
            for(const s of sels){const e=document.querySelector(s);if(!e)continue;const r=e.getBoundingClientRect(),c=getComputedStyle(e);rows[s]={left:r.left,right:r.right,width:r.width,display:c.display,minWidth:c.minWidth,maxWidth:c.maxWidth,flexWrap:c.flexWrap,flexDirection:c.flexDirection,whiteSpace:c.whiteSpace,overflowWrap:c.overflowWrap};}
            return {scrollWidth:document.documentElement.scrollWidth,rows};
          ''')
          print('BEFORE',json.dumps(before,ensure_ascii=False,indent=2))

          after_min=d.execute_script('''
            const s=document.createElement('style');
            s.textContent='@media(max-width:340px){.footer .social-links{min-width:0!important}}';
            document.head.appendChild(s);
            return {scrollWidth:document.documentElement.scrollWidth,social:getComputedStyle(document.querySelector('.footer .social-links')).minWidth};
          ''')
          print('AFTER_MIN_WIDTH',json.dumps(after_min,ensure_ascii=False,indent=2))

          after_column=d.execute_script('''
            const s=document.createElement('style');
            s.textContent='@media(max-width:340px){.footer .social-links{min-width:0!important;flex-direction:column!important;align-items:flex-start!important}.footer .contact-email{width:100%!important;min-width:0!important}.footer .email-addr{overflow-wrap:anywhere!important;min-width:0!important}}';
            document.head.appendChild(s);
            return {scrollWidth:document.documentElement.scrollWidth};
          ''')
          print('AFTER_COLUMN_FALLBACK',json.dumps(after_column,ensure_ascii=False,indent=2))
          d.quit()
          if after_min['scrollWidth']>321:
              raise SystemExit('min-width:0 alone did not fix overflow')
          PY
