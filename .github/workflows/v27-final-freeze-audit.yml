name: v2.7.x Final Freeze implementation runner

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/v27-final-freeze-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v27-final-freeze
          fetch-depth: 0

      - name: Apply exact Final Freeze files with atomic commits
        shell: bash
        run: |
          set -euo pipefail
          expected_base='306f1d9c1fc07c0f8f6035d0706d25cb495c0eec'
          test "$(git rev-parse HEAD)" = "$expected_base"
          git config user.name 'pachir1su'
          git config user.email 'crong3323@naver.com'

          python3 - <<'PY'
          from pathlib import Path

          p=Path('style.css'); s=p.read_text(encoding='utf-8')
          marker='/* v2.7.x Final Freeze — 320px footer contact overflow regression */'
          if marker in s: raise SystemExit('style marker already exists')
          s=s.rstrip()+'''\n\n/* v2.7.x Final Freeze — 320px footer contact overflow regression */\n@media (max-width: 340px) {\n  .footer .social-links {\n    width: 100%;\n    max-width: 100%;\n    flex-wrap: wrap;\n    gap: 10px;\n  }\n  .footer .contact-email {\n    min-width: 0;\n    max-width: 100%;\n  }\n  .footer .contact-email .email-addr {\n    overflow-wrap: anywhere;\n  }\n}\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('script.js'); s=p.read_text(encoding='utf-8')
          old='pachir1su.github.io — v2.6.x interactions'; new='pachir1su.github.io — v2.7.x interactions'
          if s.count(old)!=1: raise SystemExit(f'script marker count={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          reps={
            '<br>v2.5.0 : 현재 공개 릴리즈 — #117 머지 기준':'<br>v2.5.0 : #117 머지 기준 안정 릴리즈',
            '<br>v2.6.0 (Release 준비) : Final Note — MBTI·불필요 인터랙션 제거, 재학 정보·상단 연락처·메뉴·반응형 UI 정리 (#114, #118, #119, #121, #122, #123, #16). [Release notes](docs/v2.6.0-release-notes.md)':'<br>v2.6.0 : Final Note — MBTI·불필요 인터랙션 제거, 재학 정보·상단 연락처·메뉴·반응형 UI 정리 (#114, #118, #119, #121, #122, #123, #16). [Release notes](docs/v2.6.0-release-notes.md)',
            '<br>v2.6.x (예정) : Freeze / Refactor — 정적 dead-code 제거, 실제 기기 반응형·성능 회귀 QA. [Freeze plan](docs/v2.6.x-freeze.md)':'<br>v2.6.x : Freeze / Refactor — 정적 dead-code 제거, 실제 기기 반응형·성능 회귀 QA. [Freeze plan](docs/v2.6.x-freeze.md)',
            '<br>v3.0.0 ~ (예정) : 디자인 컨셉 변경 — [docs/design-concept-v3.md](docs/design-concept-v3.md)':'<br>v2.7.0 : 현재 공개 릴리즈 — Visual / Media Pass와 상세 페이지 반응형 안정화\n<br>v2.7.x : Final Freeze / release hygiene — v3 전 마지막 v2 안정화 계열. [Final Freeze](docs/v2.7.x-final-freeze.md)\n<br>v3.0.0 ~ (예정) : 디자인 컨셉 변경 — [docs/design-concept-v3.md](docs/design-concept-v3.md)'
          }
          for old,new in reps.items():
              if s.count(old)!=1: raise SystemExit(f'README target mismatch count={s.count(old)}: {old[:50]}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('tools/verify-build.js'); s=p.read_text(encoding='utf-8')
          anchor='\nif (failures.length === 0) {'
          if s.count(anchor)!=1: raise SystemExit(f'verify anchor count={s.count(anchor)}')
          lines=[
            '',
            '/* --- 6) v2.7.x Final Freeze regression gates --- */',
            'const rootIndex = fs.readFileSync(indexPath, "utf8");',
            'const rootScript = fs.readFileSync(path.join(root, "script.js"), "utf8");',
            'const rootStyle = fs.readFileSync(path.join(root, "style.css"), "utf8");',
            '',
            'for (const match of rootIndex.matchAll(/<img\\b[^>]*\\bsrc="([^\"]+)"[^>]*>/gi)) {',
            '  const ref = match[1];',
            '  if (/^(?:https?:|data:|\\/)/i.test(ref)) continue;',
            '  check(fs.existsSync(path.join(root, ref)), `메인 페이지 로컬 이미지 없음: ${ref}`);',
            '}',
            '',
            'const retiredUiPatterns = [',
            "  [rootIndex, 'id=\"mbti-section\"', \"폐기된 MBTI 섹션이 메인 markup에 돌아왔습니다.\"],",
            "  [rootIndex, 'id=\"sectionNav\"', \"폐기된 sectionNav가 메인 markup에 돌아왔습니다.\"],",
            '  [rootIndex, "floating-icons", "폐기된 floating-icons가 메인 markup에 돌아왔습니다."],',
            '  [rootScript, "normalizeV26Markup", "폐기된 v2.6 runtime normalize 코드가 돌아왔습니다."],',
            '  [rootScript, "v26-runtime-layout", "폐기된 v2.6 runtime layout 주입이 돌아왔습니다."],',
            '  [rootStyle, ".chicken-drop", "폐기된 chicken-drop 스타일이 돌아왔습니다."],',
            '];',
            'for (const [source, pattern, message] of retiredUiPatterns) {',
            '  check(!source.includes(pattern), message);',
            '}',
            ''
          ]
          block='\n'.join(lines)
          p.write_text(s.replace(anchor,'\n'+block+anchor),encoding='utf-8')
          PY

          node --check script.js
          node --check tools/verify-build.js
          cp index.html /tmp/index.before
          node build.js
          cmp /tmp/index.before index.html
          node tools/verify-build.js
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          test "$(git diff --numstat -- style.css | awk '{print $1+$2}')" -lt 40

          git add -- style.css
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'fix: wrap footer contacts on narrow screens'

          git add -- script.js
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'chore: mark interactions for v2.7 freeze'

          git add -- README.md
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'docs: sync release history through v2.7'

          git add -- tools/verify-build.js
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'chore: extend final freeze regression gates'

          test -z "$(git status --porcelain)"
          test "$(git rev-list --count "$expected_base"..HEAD)" -eq 4
          test "$(git diff --name-only "$expected_base"..HEAD | wc -l)" -eq 4
          git log --oneline "$expected_base"..HEAD
          git diff --stat "$expected_base"..HEAD
          git push origin HEAD:agent/v27-final-freeze
