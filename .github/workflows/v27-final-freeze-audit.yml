name: v2.7.x footer CSSOM diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/v27-final-freeze-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v27-final-freeze

      - name: Inspect footer rule in CSSOM
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/v27-cssom-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          python3 - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          driver_bin=shutil.which('chromedriver') or shutil.which('chromium-driver')
          opts=Options(); opts.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--force-device-scale-factor=1']:
              opts.add_argument(a)
          d=webdriver.Chrome(service=Service(driver_bin) if driver_bin else Service(),options=opts)
          d.set_window_size(320,1000)
          d.get('http://127.0.0.1:8000/'); time.sleep(.5)
          diag=d.execute_script('''
            function walk(rules, chain, out){
              for(const r of [...rules]){
                const next=(r.conditionText!==undefined)?chain.concat([r.conditionText]):chain;
                if(r.selectorText && r.selectorText.includes('.footer .social-links')) out.push({selector:r.selectorText,css:r.cssText,chain:next});
                if(r.cssRules) walk(r.cssRules,next,out);
              }
            }
            const found=[]; const sheets=[];
            for(const s of [...document.styleSheets]){
              let count=null,error=null;
              try{count=s.cssRules.length;walk(s.cssRules,[],found);}catch(e){error=String(e)}
              sheets.push({href:s.href,count,error});
            }
            const el=document.querySelector('.footer .social-links');
            const c=getComputedStyle(el); const r=el.getBoundingClientRect();
            return {
              innerWidth,
              outerWidth,
              media340:matchMedia('(max-width: 340px)').matches,
              scrollWidth:document.documentElement.scrollWidth,
              computed:{width:c.width,minWidth:c.minWidth,maxWidth:c.maxWidth,flexWrap:c.flexWrap,gap:c.gap,left:r.left,right:r.right},
              found,
              sheets
            };
          ''')
          print(json.dumps(diag,ensure_ascii=False,indent=2))

          # Prove candidate fixes independently of the committed stylesheet.
          candidates={
            'minWidth':'@media(max-width:340px){.footer .social-links{min-width:0!important}}',
            'wrapMin':'@media(max-width:340px){.footer .social-links{min-width:0!important;width:100%!important;max-width:100%!important;flex-wrap:wrap!important}}',
            'column':'@media(max-width:340px){.footer .social-links{min-width:0!important;width:100%!important;max-width:100%!important;flex-direction:column!important;align-items:flex-start!important}.footer .contact-email{min-width:0!important;max-width:100%!important}}'
          }
          for name,css in candidates.items():
              d.refresh(); time.sleep(.2)
              result=d.execute_script('''
                const st=document.createElement('style'); st.textContent=arguments[0]; document.head.appendChild(st);
                const e=document.querySelector('.footer .social-links'),c=getComputedStyle(e),r=e.getBoundingClientRect();
                return {scrollWidth:document.documentElement.scrollWidth,flexWrap:c.flexWrap,minWidth:c.minWidth,width:r.width,right:r.right};
              ''',css)
              print(name,json.dumps(result,ensure_ascii=False))
          d.quit()
          PY
