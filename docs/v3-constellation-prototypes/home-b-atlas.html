<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Galaxy Atlas · v3 Prototype</title>
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body data-page="atlas">
  <header class="site-header atlas-header">
    <a class="brand-mark" href="index.html">PACHIR1SU <span>✦</span></a>
    <a class="header-mail" href="mailto:capybara@koreatech.ac.kr">capybara@koreatech.ac.kr</a>
  </header>

  <main class="atlas-page">
    <section class="atlas-intro">
      <p class="atlas-greeting">안녕하세요.</p>
      <h1>이건영<small>Lee Geon Yeong</small></h1>
      <p class="atlas-role">혁신의 기업가 &amp; 풀스택 개발자</p>
      <p class="atlas-vision">이윤을 넘어 혁신을 추구합니다.<br>월 100만 명이 사용하는 서비스를 만드는 것이 목표입니다.</p>
      <div class="atlas-identity-links">
        <a href="https://github.com/pachir1su">GitHub</a>
        <span>한국기술교육대학교 26학번</span>
      </div>
    </section>

    <div class="atlas-toolbar" aria-label="우주 지도 조작">
      <button type="button" data-atlas-reset>처음으로</button>
      <button type="button" data-atlas-focus="growth">성장 별자리</button>
      <button type="button" data-atlas-focus="projects">프로젝트 은하</button>
      <button type="button" data-atlas-focus="moon">달 관측소</button>
    </div>

    <section class="atlas-viewport" data-atlas-viewport aria-label="드래그 가능한 개인 우주 지도">
      <div class="atlas-world" data-atlas-world>
        <div class="ambient-stars atlas-stars" data-starfield aria-hidden="true"></div>
        <section class="atlas-zone atlas-growth-zone" data-zone="growth">
          <h2>실제 사건으로<br>연결된 별자리</h2>
          <div class="atlas-growth-map" data-growth-constellation></div>
        </section>

        <section class="atlas-zone atlas-project-zone" data-zone="projects">
          <h2>연도별 관측소</h2>
          <div class="orbit-rings" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="atlas-stations" data-atlas-stations></div>
        </section>

        <section class="atlas-zone atlas-moon-zone" data-zone="moon">
          <div class="atlas-moon" data-atlas-moon aria-hidden="true"></div>
          <h2>가장 빠른 연락</h2>
          <a href="mailto:capybara@koreatech.ac.kr">capybara@koreatech.ac.kr</a>
          <div class="atlas-eclipse-target" data-atlas-eclipse-target aria-hidden="true"></div>
        </section>

        <div class="comet-event atlas-comet" data-comet-event aria-hidden="true">
          <div class="comet-tail"></div><div class="capybara-placeholder"><span class="capy-ear"></span><span class="capy-eye"></span></div>
        </div>

        <canvas class="capy-nebula atlas-capy" data-capy-nebula aria-hidden="true"></canvas>
      </div>
    </section>

    <aside class="atlas-drawer" data-atlas-drawer aria-live="polite">
      <button type="button" data-drawer-close aria-label="정보 패널 닫기">×</button>
      <p class="section-kicker" data-drawer-kicker hidden>OBSERVATORY</p>
      <h2 data-drawer-title>별이나 관측소를 선택하세요.</h2>
      <p data-drawer-description>선택한 기록이 이곳에 표시됩니다.</p>
      <div class="drawer-projects" data-drawer-projects></div>
    </aside>
  </main>
  <button class="sound-stop" data-sound-stop type="button" hidden aria-label="재생 중인 소리 멈추기">소리 멈춤 ×</button>
  <script type="application/json" id="prototype-config">{"source":"../../projects.json","defaultGroup":"2026"}</script>
</body>
</html>
