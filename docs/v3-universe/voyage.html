<!-- =====================================================================
     v3 방향 실험 — 항해 (docs/v3-universe/voyage.html)

     "너무 포트폴리오 느낌이잖아. v2는 포트폴리오고 v3은 이쁘게 꾸몄으면
     좋겠어. 여행하는 느낌이 들게" (2026-08-26)에 대한 실험이다.

     모델 A(관측창 + 목록)에서 목록을 버리고, 항로를 따라 기항지를 지나는
     구성으로 바꿨다. 스크롤이 카메라를 밀고, 별은 깊이별로 다른 속도로
     흘러가며, 기항지에 닿으면 그 해의 별자리가 그어진다.

     아직 확정된 방향이 아니다. 운영 /universe/ 에는 반영하지 않았다.
     ?cam=0~1 로 항로 위 한 지점을 바로 열 수 있다.
     ===================================================================== -->

<style>
:root{
  --ground:#e8eaf2; --deep:#dfe2ec; --ink:#242636; --muted:#606579; --subtle:#7a7f92;
  --violet:#706994; --gold:#8f7736; --line:#cbd0df; --pane:#f1f2f7;
  --halo:0 0 8px #e8eaf2,0 0 20px rgba(232,234,242,.92);
  --sans:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1118; --deep:#11151d; --ink:#e0e3eb; --muted:#a2a8b8; --subtle:#8b92a4;
  --violet:#968dbb; --gold:#c9b477; --line:#2b3242; --pane:#161b25;
  --halo:0 0 8px #0d1118,0 0 22px rgba(13,17,24,.94);
}}
:root[data-theme="dark"]{
  --ground:#0d1118; --deep:#11151d; --ink:#e0e3eb; --muted:#a2a8b8; --subtle:#8b92a4;
  --violet:#968dbb; --gold:#c9b477; --line:#2b3242; --pane:#161b25;
  --halo:0 0 8px #0d1118,0 0 22px rgba(13,17,24,.94);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:2px}

/* 창 — 여행 내내 이 한 장만 본다 */
#port{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* 스크롤 길이만 만드는 빈 구간 */
#track{position:relative;z-index:1;pointer-events:none}
.leg{height:96vh}

/* 기항지 표지 — 창 위에 겹치는 고정 레이어 */
#deck{position:fixed;inset:0;z-index:2;pointer-events:none}
.plate{position:absolute;opacity:0;transition:opacity 620ms var(--ease)}
.plate.is-here{opacity:1}

.mark{left:clamp(20px,5vw,72px);bottom:clamp(48px,9vh,110px);max-width:min(40ch,80vw)}

            line-height:.86;color:var(--ink);text-shadow:var(--halo)}
.mark .place{display:block;margin-top:10px;color:var(--muted);font-size:clamp(12px,1.4vw,15px);
             letter-spacing:.12em;text-shadow:var(--halo)}
.mark .note{margin:14px 0 0;color:var(--muted);font-size:13.5px;text-shadow:var(--halo)}

.hail{left:clamp(20px,5vw,72px);bottom:clamp(48px,9vh,110px);max-width:min(44ch,84vw)}
.hail h1{margin:0;font-weight:200;font-size:clamp(46px,9vw,116px);letter-spacing:-.055em;line-height:.94;text-shadow:var(--halo)}
.hail .en{display:block;margin-top:6px;color:var(--muted);font-size:clamp(11px,1.3vw,14px);letter-spacing:.34em;text-transform:uppercase;text-shadow:var(--halo)}
.hail p{margin:22px 0 0;max-width:32ch;font-weight:300;font-size:clamp(15px,1.7vw,19px);line-height:1.6;text-shadow:var(--halo)}

            border-bottom:1px solid var(--line);padding-bottom:2px;text-shadow:var(--halo);pointer-events:auto;

.hail .mail:hover{color:var(--ink);border-bottom-color:var(--gold)}

#gauge{position:fixed;left:clamp(12px,2.4vw,26px);top:50%;transform:translateY(-50%);z-index:3;
       width:1px;height:min(46vh,320px);background:var(--line);pointer-events:none}
#gauge i{position:absolute;left:-3px;width:7px;height:7px;border-radius:50%;
         background:var(--ground);border:1px solid var(--line);transition:background 400ms var(--ease),border-color 400ms var(--ease)}
#gauge i.is-passed{background:var(--gold);border-color:var(--gold)}
#gauge b{position:absolute;left:-2px;width:5px;height:5px;border-radius:50%;background:var(--gold);
         box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent);transition:top 220ms linear}

/* 마주친 것 — 별을 누르면 나오는 관측 메모 */
#note{position:fixed;right:clamp(16px,3vw,40px);bottom:clamp(16px,3vw,40px);z-index:4;
      width:min(330px,calc(100vw - 32px));padding:16px 18px 18px;
      background:var(--pane);border:1px solid var(--line);
      box-shadow:0 20px 44px -30px rgba(0,0,0,.6);
      opacity:0;transform:translateY(10px);pointer-events:none;
      transition:opacity 300ms var(--ease),transform 300ms var(--ease)}

#note .role{margin:0 0 9px;color:var(--gold);font-size:11.5px}

             color:var(--subtle);font-size:15px;line-height:1;cursor:pointer}
#note button:hover{color:var(--ink)}

/* 키보드·스크린리더 경로 — 화면에는 목록을 두지 않는다 */
.sr-nav{position:absolute;left:-9999px;top:0}
.sr-nav:focus-within{position:fixed;left:12px;top:12px;z-index:9;width:min(300px,80vw);
  max-height:70vh;overflow:auto;background:var(--pane);border:1px solid var(--line);padding:10px}
.sr-nav button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--ink);font:inherit;font-size:13px;padding:7px 6px;cursor:pointer}
.sr-nav button:hover{color:var(--gold)}

     opacity:0;transition:opacity 620ms var(--ease);pointer-events:none}
.end.is-here{opacity:1;pointer-events:auto}
.end a{display:block;width:44px;height:48px;background:linear-gradient(160deg,#f6e79f,#e7cd6c);

       transition:transform 300ms var(--ease)}
.end a:hover{transform:rotate(-1deg) translateY(-3px)}

@media (prefers-reduced-motion:reduce){
  .plate,.end,#note{transition-duration:.001ms}
}
</style>

const dark = matchMedia('(prefers-color-scheme: dark)');

const T = () => {
  const d = document.documentElement.dataset.theme;
  const isDark = d === 'dark' || (d !== 'light' && dark.matches);
  return isDark
    ? {L:false, g0:'#12161f',g1:'#0d1118',neb:'#4a4468',neb2:'#6d648f',ink:'#e6e9f1',gold:'#c9b477',glow:'#cfd3e4',vig:'#05070c'}
    : {L:true,  g0:'#eceef5',g1:'#dfe2ec',neb:'#706994',neb2:'#8d86ab',ink:'#242636',gold:'#8f7736',glow:'#ffffff',vig:'#c9cdda'};
};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`};
const rng=s=>()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
/* 표지판은 짧게 — 긴 이름은 메모에서 온전히 읽는다. 항로에서는 알아볼 만큼만. */
function sign(name){
  let s=String(name).split(/\s*[—(]/)[0].trim();
  if(!s) s=String(name).trim();
  return s.length>16 ? s.slice(0,15)+'…' : s;
}
const ease=k=>1-Math.pow(1-clamp(k,0,1),3);

function fitBox(w,h,ratio,inset){
  const aw=w*(1-inset*2), ah=h*(1-inset*2);
  let bw=aw, bh=bw/ratio;
  if(bh>ah){bh=ah;bw=bh*ratio}
  return {x:(w-bw)/2,y:(h-bh)/2,w:bw,h:bh};
}

  return {depth:L.depth, stars:out};
});

const CLOUDS = (()=>{const r=rng(88),o=[];for(let i=0;i<14;i++)o.push({

let ctx=null, W=0, H=0, dpr=1;
function size(){

/* ?cam=0..1 로 항로 위 한 지점을 바로 열 수 있다. 스크롤 없이 그 장면을 본다. */
const FORCED = (()=>{const v=new URLSearchParams(location.search).get('cam');
  return v===null?null:clamp(parseFloat(v)||0,0,1)})();
function camera(){
  const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
  const p=FORCED!==null?FORCED:clamp(scrollY/max,0,1);
  return {p, x:p*PATH_END, y:Math.sin(p*Math.PI*2.1)*120};
}

function project(x,y,cam,depth){
  return [W*.5+(x-cam.x)/depth, H*.5+(y-cam.y)/depth];
}

function star(c,x,y,r,col,alpha,haloR,haloA,t){
  if(haloR>0){
    const hc=t.L?t.glow:col;
    const g=c.createRadialGradient(x,y,0,x,y,haloR);
    g.addColorStop(0,rgba(hc,haloA));g.addColorStop(.45,rgba(hc,haloA*.38));g.addColorStop(1,rgba(hc,0));
    c.fillStyle=g;c.beginPath();c.arc(x,y,haloR,0,7);c.fill();
  }
  c.globalAlpha=alpha;c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.globalAlpha=1;
}

function draw(){
  const t=T(), cam=camera();
  const g=ctx.createLinearGradient(W,0,0,H);
  g.addColorStop(0,t.g0);g.addColorStop(1,t.g1);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  /* 성운 — 지나가는 구름 */
  CLOUDS.forEach(cl=>{
    const [sx,sy]=project(cl.x,cl.y,cam,cl.depth);
    const rr=cl.rx/cl.depth;
    if(sx<-rr*1.4||sx>W+rr*1.4) return;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(cl.rot);ctx.scale(1,.6);
    const rg=ctx.createRadialGradient(rr*.2,-rr*.24,rr*.04,0,0,rr);
    const a=cl.a*(t.L?.62:1.5);
    rg.addColorStop(0,rgba(t.neb,a));rg.addColorStop(.28,rgba(t.neb,a*.62));
    rg.addColorStop(.55,rgba(t.neb2,a*.3));rg.addColorStop(.8,rgba(t.neb2,a*.09));rg.addColorStop(1,rgba(t.neb2,0));
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,rr,0,7);ctx.fill();ctx.restore();
  });

  /* 별 3계층 */
  FIELD.forEach(layer=>{
    layer.stars.forEach(s=>{
      const [sx,sy]=project(s.x,s.y,cam,layer.depth);
      if(sx<-20||sx>W+20||sy<-20||sy>H+20) return;
      ctx.globalAlpha=s.a*(t.L?.85:1);
      ctx.fillStyle=s.gold?t.gold:t.ink;
      ctx.beginPath();ctx.arc(sx,sy,s.r,0,7);ctx.fill();
    });
  });
  ctx.globalAlpha=1;

  /* 항로 — 기항지를 잇는 낡은 금빛 실선 */
  ctx.save();ctx.lineCap='round';ctx.lineWidth=1;ctx.setLineDash([2,10]);
  ctx.strokeStyle=rgba(t.gold,t.L?.34:.4);
  ctx.beginPath();
  STOPS.forEach((s,i)=>{const[p,q]=project(s.x,s.y,cam,1.35);i?ctx.lineTo(p,q):ctx.moveTo(p,q)});
  ctx.stroke();ctx.restore();

  /* 달 — 항로 중간에 한 번 마주친다 */
  {
    const [mx,my]=project(MOON.x,MOON.y,cam,MOON.depth);
    const R=MOON.r/MOON.depth;
    if(mx>-R*4&&mx<W+R*4){
      const gg=ctx.createRadialGradient(mx-R*.25,my-R*.3,R*.1,mx,my,R*2.6);
      gg.addColorStop(0,rgba(t.glow,t.L?.26:.2));gg.addColorStop(1,rgba(t.glow,0));
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(mx,my,R*2.6,0,7);ctx.fill();
      ctx.save();ctx.beginPath();ctx.arc(mx,my,R,0,7);ctx.clip();
      ctx.fillStyle=rgba(t.L?t.ink:t.glow,t.L?.26:.66);ctx.fillRect(mx-R,my-R,R*2,R*2);
      const r2=rng(9);ctx.fillStyle=rgba(t.L?t.ink:t.neb,t.L?.14:.28);
      for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(mx+(r2()-.5)*R*1.2,my+(r2()-.5)*R*1.2,R*(.14+r2()*.22),0,7);ctx.fill()}
      ctx.restore();
    }
  }

  /* 기항지 */
  hits=[];
  ctx.font='400 12.5px "IBM Plex Sans KR", sans-serif';
  ctx.textBaseline='middle';
  STOPS.forEach(stop=>{
    if(!stop.cards) return;
    const near=1-clamp(Math.abs(cam.x-stop.x)/(SPAN*.62),0,1);
    if(near<=0.001) return;
    const arrive=ease(near);
    let [ox,oy]=project(stop.x,stop.y,cam,1.35);
    const boxW=Math.min(W*.52,620), boxH=Math.min(H*.56,470);
    /* 기항지가 화면 위아래로 잘리지 않게 붙든다. 항로의 높낮이는 배경이 대신 전한다. */
    oy=clamp(oy,boxH*.5+56,H-boxH*.5-150);
    ox=clamp(ox,boxW*.5+24,W-boxW*.5-24);

    let pts;
    if(stop.shape){
      const sh=SHAPES[stop.shape];
      const b=fitBox(boxW,boxH,sh.ratio,0.02);
      pts=sh.pts.map(([x,y])=>[ox-boxW/2+b.x+x*b.w, oy-boxH/2+b.y+y*b.h]);
      ctx.save();ctx.lineCap='round';ctx.lineWidth=1.1;
      ctx.strokeStyle=rgba(t.gold,(t.L?.52:.6)*arrive);
      const n=stop.cards.length;
      sh.edges.filter(([a,b2])=>a<n&&b2<n).forEach(([a,b2],i,arr)=>{
        const k=clamp(arrive*arr.length*1.15-i,0,1);
        if(k<=0) return;
        ctx.beginPath();ctx.moveTo(pts[a][0],pts[a][1]);
        ctx.lineTo(pts[a][0]+(pts[b2][0]-pts[a][0])*ease(k),pts[a][1]+(pts[b2][1]-pts[a][1])*ease(k));
        ctx.stroke();
      });
      ctx.restore();
    }else{
      const r=rng(stop.id.length*131+7);
      pts=stop.cards.map(()=>[ox-boxW/2+ (0.06+r()*0.88)*boxW, oy-boxH/2+(0.08+r()*0.84)*boxH]);
    }

    const signs=[];
    stop.cards.forEach((card,i)=>{
      const p=pts[i]; if(!p) return;
      const [sx,sy]=p;
      const sel=(selected&&selected.stop===stop.id&&selected.i===i);
      const app=clamp(arrive*2.2-i*0.06,0,1);
      if(app<=0) return;
      const R=(sel?4.2:2.6);
      star(ctx,sx,sy,R*app,sel?t.gold:t.ink,(t.L?.82:.94)*app,(sel?30:16)*app,(t.L?.34:.16)*app,t);
      const la=clamp((arrive-0.35)/0.4,0,1)*app;
      if(la>0.02) signs.push({sx,sy,ly:sy,text:sign(card.n||card.t),left:sx<W*.5,a:la,sel});
      hits.push({stop:stop.id,i,x:sx,y:sy,card});
    });

    /* 표지판 — 도착했을 때만 켜진다. 같은 쪽끼리 겹치면 아래로 밀어낸다.
       라벨을 캔버스에 그리므로 여기서 한 번에 풀 수 있다. */
    signs.forEach(s=>{
      const w=ctx.measureText(s.text).width;
      s.x0=s.left? s.sx+16 : s.sx-16-w;
      s.x1=s.x0+w;
    });
    const placed=[];
    signs.sort((a,b)=>a.sy-b.sy).forEach(s=>{
      for(let guard=0;guard<26;guard++){
        const hit=placed.find(o=>Math.abs(o.ly-s.ly)<16 && s.x1>o.x0-10 && s.x0<o.x1+10);
        if(!hit) break;
        s.ly=hit.ly+16;
      }
      placed.push(s);
    });
    signs.forEach(s=>{
      ctx.globalAlpha=s.a*(s.sel?1:.84);
      ctx.fillStyle=s.sel?t.gold:t.ink;
      ctx.textAlign=s.left?'left':'right';
      ctx.shadowColor=t.L?'#e8eaf2':'#0d1118';ctx.shadowBlur=9;
      if(Math.abs(s.ly-s.sy)>2){
        ctx.strokeStyle=rgba(t.ink,.16*s.a);ctx.lineWidth=.8;
        ctx.beginPath();ctx.moveTo(s.sx+(s.left?9:-9),s.sy);
        ctx.lineTo(s.sx+(s.left?13:-13),s.ly);ctx.stroke();
      }
      ctx.fillText(s.text,s.sx+(s.left?16:-16),s.ly);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    });
  });
  ctx.textAlign='left';

  /* 비네트 */
  const S=Math.min(W,H);
  const v=ctx.createRadialGradient(W*.58,H*.4,S*.24,W*.44,H*.56,S*1.25);
  v.addColorStop(0,rgba(t.vig,0));v.addColorStop(1,rgba(t.vig,t.L?.24:.5));
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

/* ---- 기항지 표지 ---- */
const deck=document.getElementById('deck');
STOPS.forEach((s,i)=>{
  if(s.kind==='hail'||s.kind==='home') return;
  const el=document.createElement('div');
  el.className='plate mark';
  el.dataset.plate=String(i);
  el.innerHTML='<span class="year"></span><span class="place"></span><p class="note"></p>';
  el.querySelector('.year').textContent=s.year||s.id;
  el.querySelector('.place').textContent=s.place||'';
  el.querySelector('.note').textContent=s.note||'';
  deck.appendChild(el);
});
const plates=[...document.querySelectorAll('.plate')];
const endEl=document.querySelector('.end');

/* ---- 항로 게이지 ---- */
const gauge=document.getElementById('gauge');
const pin=gauge.querySelector('b');
STOPS.forEach(s=>{const d=document.createElement('i');d.style.top=((s.x/PATH_END)*100)+'%';gauge.appendChild(d)});
const pips=[...gauge.querySelectorAll('i')];

/* ---- 관측 메모 ---- */
let selected=null;
const note=document.getElementById('note');
note.querySelector('button').addEventListener('click',()=>{selected=null;note.classList.remove('is-open');kick()});
function open(hit){
  selected={stop:hit.stop,i:hit.i};
  const c=hit.card;
  note.querySelector('h3').textContent=c.n||c.t;
  note.querySelector('.role').textContent=c.r||c.when||c.p||'';
  note.querySelector('.body').textContent=c.f||c.d||'';
  note.classList.add('is-open');
  kick();
}
canvas.parentElement.addEventListener('click',()=>{},false);
addEventListener('click',e=>{
  if(e.target.closest('#note')||e.target.closest('.sr-nav')||e.target.closest('.end')||e.target.closest('.mail'))return;
  let best=null,bd=1e9;
  hits.forEach(h=>{const d=Math.hypot(e.clientX-h.x,e.clientY-h.y);if(d<bd){bd=d;best=h}});
  if(best&&bd<44) open(best);
});

/* ---- 키보드·스크린리더 경로 ---- */
const nav=document.querySelector('.sr-nav');
STOPS.forEach((s,si)=>{
  if(!s.cards) return;
  s.cards.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.textContent=(s.year||s.id)+' · '+(c.n||c.t);
    b.addEventListener('click',()=>{
      const max=document.documentElement.scrollHeight-innerHeight;
      scrollTo({top:(s.x/PATH_END)*max,behavior:reduced.matches?'auto':'smooth'});
      setTimeout(()=>{const h=hits.find(x=>x.stop===s.id&&x.i===i);if(h)open(h)},reduced.matches?60:700);
    });
    nav.appendChild(b);
  });
});

/* 이메일 복사 */
const mail=document.querySelector('.mail');
mail.addEventListener('click',()=>{
  if(!navigator.clipboard)return;
  navigator.clipboard.writeText(mail.dataset.mail).then(()=>{
    const old=mail.textContent;mail.textContent='복사됨';setTimeout(()=>{mail.textContent=old},1500);
  },()=>{});
});

/* ---- 프레임 : 스크롤 중과 도착 전환 중에만 돈다 ---- */
let raf=0, until=0;
function paint(){
  draw();
  const cam=camera();
  plates.forEach(el=>{
    const s=STOPS[+el.dataset.plate];
    el.classList.toggle('is-here',Math.abs(cam.x-s.x)<SPAN*.42);
  });
  endEl.classList.toggle('is-here',cam.p>0.955);
  pin.style.top=(cam.p*100)+'%';
  pips.forEach((d,i)=>d.classList.toggle('is-passed',cam.x>=STOPS[i].x-SPAN*.42));
}
function frame(){
  raf=0;
  paint();
  if(performance.now()<until) raf=requestAnimationFrame(frame);
}
/* 캔버스를 지운 채로 두지 않는다. kick은 먼저 한 장을 그리고 나서 루프를 건다.
   resize는 캔버스를 지우므로 그 자리에서 다시 그린다. */
function kick(ms){
  until=performance.now()+(ms||420);
  paint();
  if(!raf) raf=requestAnimationFrame(frame);
}
addEventListener('scroll',()=>kick(260),{passive:true});
addEventListener('resize',()=>{size();kick(300)},{passive:true});
dark.addEventListener('change',()=>kick(60));
document.fonts&&document.fonts.ready.then(()=>kick(120));
kick(1400);
})();
</script>
</body></html>
