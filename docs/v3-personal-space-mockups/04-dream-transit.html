<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>04 · Dream Transit</title>
  <style>
    /* Dream transit: nostalgic station signage turns projects into a gentle trip through time. */
    :root{--dawn:#f8f5ff;--ink:#2e2947;--muted:#77708a;--purple:#6a51bd;--deep:#44386f;--lav:#ddd6fa;--mist:#edeafa;--yellow:#f2d66d;--red:#d97988}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 12%,#fff2b8 0 2%,transparent 16%),linear-gradient(145deg,#faf9ff,#e9e5f9);color:var(--ink);font-family:ui-rounded,"Segoe UI",system-ui,sans-serif}.terminal{max-width:1320px;margin:auto;padding:30px 34px 65px}.rail{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.rail strong{color:var(--deep);letter-spacing:-.03em}.ticket{display:grid;grid-template-columns:1.15fr .85fr;gap:0;margin-top:30px;overflow:hidden;border-radius:30px;background:#fdfcff;box-shadow:0 25px 70px #3b30601f}.story{padding:55px 56px 48px}.route{display:inline-flex;gap:8px;align-items:center;color:var(--purple);font-size:12px;font-weight:900;letter-spacing:.1em}.route i{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:14px 0 var(--lav),28px 0 var(--purple)}h1{max-width:720px;margin:20px 0 17px;font-size:clamp(45px,5.5vw,78px);letter-spacing:-.075em;line-height:.9}h1 span{color:var(--purple)}.story p{max-width:490px;color:var(--muted);font-size:17px;line-height:1.7}.boarding{display:flex;align-items:center;gap:13px;margin-top:31px}.boarding button{border:0;border-radius:14px;padding:13px 16px;background:var(--deep);color:#fff;font:inherit;font-weight:800;cursor:pointer}.boarding small{color:var(--muted)}.window{position:relative;min-height:505px;overflow:hidden;background:linear-gradient(150deg,#bcb5e5,#796bab 54%,#4b3b77)}.window:before{position:absolute;z-index:1;top:11%;bottom:11%;left:9%;right:9%;border:11px solid #e7e2f5;border-radius:23px;box-shadow:inset 0 0 0 1px #57477f;content:""}.moon{position:absolute;right:25%;top:21%;width:82px;height:82px;border-radius:50%;background:#fff3b7;box-shadow:0 0 35px #ffe7945e}.hill{position:absolute;bottom:-30px;left:-7%;width:124%;height:45%;border-radius:50% 50% 0 0;background:#48396e;transform:rotate(-5deg)}.hill:after{position:absolute;bottom:28px;left:14%;width:110%;height:57%;border-radius:50% 50% 0 0;background:#645588;content:""}.train{position:absolute;z-index:2;bottom:17%;left:-6%;width:112%;height:73px;border-radius:17px;background:repeating-linear-gradient(90deg,#35304d 0 120px,#a9a0cd 122px 176px);box-shadow:0 15px 28px #27203d45}.train:after{position:absolute;left:0;right:0;bottom:-11px;height:11px;background:#28243e;content:""}.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 4px 0}.station{position:relative;padding:14px 13px 11px;border-top:1px solid #d7d1e8}.station:before{position:absolute;top:-5px;left:0;width:9px;height:9px;border:2px solid #fff;border-radius:50%;background:var(--purple);content:""}.station small{color:var(--muted);font-size:11px}.station h2{margin:8px 0 0;font-size:15px;letter-spacing:-.035em}.station.current:before{background:var(--yellow);box-shadow:0 0 0 4px #fff5c5}.station.current h2{color:var(--purple)}.platform{display:flex;align-items:center;justify-content:space-between;gap:25px;margin-top:30px;padding:16px 21px;border-radius:17px;background:#eeeafd;color:var(--deep)}.platform b{font-size:14px}.platform span{font-size:13px;color:var(--muted)}@media(max-width:790px){.terminal{padding:18px}.ticket{grid-template-columns:1fr}.story{padding:43px 26px 34px}.window{min-height:340px;order:-1}.stations{grid-template-columns:repeat(2,1fr)}.platform{align-items:flex-start;flex-direction:column;gap:6px}} 
  </style>
</head>
<body>
  <div class="terminal"><header class="rail"><strong>pachir1su dream transit</strong><span>마지막 출발 · 매일 새벽</span><span>KO / EN</span></header><main class="ticket"><section class="story"><span class="route"><i></i> START — TRY — SHARE — AGAIN</span><h1>조금 돌아가도,<br><span>다음 별</span>로 가는<br>중입니다.</h1><p>이 포트폴리오는 결과물 목록이 아니라 제가 지나온 작은 정거장들입니다. 실패해도 다음 역의 문은 열리고, 좋아했던 장면은 표지판처럼 남습니다.</p><div class="boarding"><button id="rideButton" type="button">탑승하기</button><small id="rideText">현재 플랫폼: “새로운 걸 무서워하지 않기”</small></div><section class="stations" aria-label="성장 정거장"><article class="station"><small>01</small><h2>첫 코드</h2></article><article class="station"><small>02</small><h2>첫 공개</h2></article><article class="station current"><small>03 · NOW</small><h2>별자리 설계</h2></article><article class="station"><small>04</small><h2>다음 신호</h2></article></section></section><aside class="window" aria-label="새벽 기차 창문 일러스트"><div class="moon"></div><div class="hill"></div><div class="train"></div></aside></main><aside class="platform"><b>✦ 오늘의 플랫폼 메모</b><span>“모르는 것을 피하지 않고, 작게라도 손으로 만져 보기.”</span></aside></div>
  <script>
    /* One travel action updates the route state; background scenery remains still for comfort. */
    const stops=['현재 플랫폼: “새로운 걸 무서워하지 않기”','다음 플랫폼: “작동하는 첫 화면 만들기”','다음 플랫폼: “친구에게 먼저 보여 주기”'];let stopIndex=0;document.querySelector('#rideButton').addEventListener('click',()=>{stopIndex=(stopIndex+1)%stops.length;document.querySelector('#rideText').textContent=stops[stopIndex];document.querySelector('#rideButton').textContent=stopIndex===0?'탑승하기':'다음 역 보기'});
  </script>
</body>
</html>
